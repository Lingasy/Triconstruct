<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
/* 无视屏幕宽度，永远禁用移动端视图 */
html { min-width: 1600px; width: 100%; height: 100%; }
.view-sidebar,.ev-sidebar,.left-sidebar,.right-sidebar { display:block !important; }
</style>
<meta name="description" content="三构体 · 创作台与档案 —— 基于浏览器的创作工作台：写作、档案、人物、事件时间线、世界层与展示图库，全部数据保存在浏览器本地存储中。">
<meta name="theme-color" content="#050507">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050507'/%3E%3Cpath d='M32 10 L54 32 L32 54 L10 32 Z' fill='none' stroke='%23ff2140' stroke-width='4'/%3E%3Cpath d='M32 22 L42 32 L32 42 L22 32 Z' fill='%23ff2140'/%3E%3C/svg%3E">
<title>三构体 · 创作台与档案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--fs:22px;--accent:#ff2140;--accent2:#7c5cff;--bl-blood:#ff2140;--bl-intensity:1.5;--bl-period:12s;--corner-color:#ff2140;--corner-intensity:1.2;--corner-period:3s;--corner-size:380px;--panel-a:0.15;--tl-main:#ff2140;--tl-sub-start:#8b0000;--tl-sub-end:#ffb3b3;--z-blood:2;--z-fx:5;--z-corner:8;--z-view:10;--z-resizer:30;--z-topbar:50;--z-popover:80;--z-modal:800;--z-toast:900;--z-menu:2000;--z-tip:2500;--z-ripple:3000}
body{width:100%;height:100%;overflow:hidden}
body{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-size:var(--fs);line-height:1.85;background:#000;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--bg);color:var(--text-body);overflow:hidden;transition:background .3s,color .3s}
body[data-theme="dark"]{--bg:#050507;--panel:#0b0b0e;--panel-rgb:11,11,14;--panel2:#111116;--panel2-rgb:17,17,22;--border:#242429;--border-soft:#17171c;--text:#fff;--text-body:#fff;--text-dim:#9a9aa6;--hover:#15151a;--shadow:0 14px 44px rgba(0,0,0,.85);--text-shadow:0 1px 3px rgba(0,0,0,.9)}
body[data-theme="light"]{--bg:#e9ecf1;--panel:#fff;--panel-rgb:255,255,255;--panel2:#f4f6f9;--panel2-rgb:244,246,249;--border:#d6dbe3;--border-soft:#e6eaef;--text:#08080a;--text-body:#08080a;--text-dim:#5c6270;--hover:#eef1f5;--shadow:0 14px 36px rgba(20,26,40,.16);--text-shadow:0 1px 2px rgba(255,255,255,.7)}
body[data-font="red"]{--text-body:#ff2b4a}
body[data-theme="light"][data-font="red"]{--text-body:#c2001e}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 18%,transparent);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
::selection{background:var(--accent);color:#fff}

.bg-art{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.bg-img-layer{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;opacity:0;filter:blur(0)}
.creature{position:absolute;inset:0;animation:creep 46s ease-in-out infinite;transform-origin:50% 50%;opacity:.04}
.creature path{fill:var(--accent)}
@keyframes creep{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}33%{transform:translate(-1.4%,1.2%) scale(1.06) rotate(1.2deg)}66%{transform:translate(1%,-.8%) scale(.97) rotate(-.8deg)}}
.blood-lines{position:absolute;inset:0;z-index:var(--z-blood);pointer-events:none;overflow:visible}
.blood-lines .bl{fill:none;stroke-linecap:round;animation:lineBreath var(--bl-period) ease-in-out infinite;will-change:opacity}
@keyframes lineBreath{0%,100%{opacity:calc(.15*var(--bl-intensity))}50%{opacity:calc(.95*var(--bl-intensity))}}
body[data-theme="light"] .blood-lines .bl{animation-name:lineBreathLight}
@keyframes lineBreathLight{0%,100%{opacity:calc(.10*var(--bl-intensity))}50%{opacity:calc(.62*var(--bl-intensity))}}
.scanlines{position:absolute;inset:0;z-index:var(--z-fx);pointer-events:none;opacity:.22;background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px)}
body[data-theme="light"] .scanlines{opacity:.04}
.vignette{position:absolute;inset:0;z-index:var(--z-fx);pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 28%,rgba(0,0,0,.5) 82%,rgba(0,0,0,.92) 100%)}
body[data-theme="light"] .vignette{background:radial-gradient(ellipse at 50% 38%,transparent 48%,rgba(20,26,40,.10) 100%)}
.corner-hb{position:absolute;bottom:0;width:var(--corner-size);height:calc(var(--corner-size)*0.68);pointer-events:none;z-index:var(--z-corner);opacity:0}
.corner-hb.left{left:0;background:radial-gradient(ellipse at bottom left,color-mix(in srgb,var(--corner-color) 90%,transparent) 0%,transparent 68%)}
.corner-hb.right{right:0;background:radial-gradient(ellipse at bottom right,color-mix(in srgb,var(--corner-color) 90%,transparent) 0%,transparent 68%)}
@keyframes hbSync{0%{opacity:0}5%{opacity:calc(.85*var(--corner-intensity))}33.3%{opacity:0}100%{opacity:0}}
.corner-hb.left,.corner-hb.right{animation:hbSync var(--corner-period) ease-out infinite}

.click-ripple{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid var(--accent);border-radius:50%;pointer-events:none;z-index:var(--z-ripple);animation:rippleAnim .55s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rippleAnim{0%{transform:scale(.55);opacity:.65}100%{transform:scale(4.2);opacity:0}}

.topbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:var(--z-topbar);display:flex;align-items:center;gap:12px;padding:0 20px;background:rgba(var(--panel-rgb),.94);border-bottom:1px solid var(--border);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 22%,transparent);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;font-size:.9em;letter-spacing:.2em;color:var(--text);white-space:nowrap;font-weight:600;text-shadow:var(--text-shadow)}
.brand .glyph{color:var(--accent);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.brand em{font-style:normal;font-size:.6em;letter-spacing:.22em;color:var(--text-dim);font-weight:400}
.mainnav{display:flex;gap:2px;margin-left:6px}
.mainnav a{display:flex;align-items:center;height:34px;padding:0 13px;font-size:.68em;letter-spacing:.14em;color:var(--text-dim);text-decoration:none;transition:.2s;border-bottom:2px solid transparent;white-space:nowrap;text-shadow:var(--text-shadow)}
.mainnav a:hover{color:var(--text)}
.mainnav a.active{color:var(--accent);border-bottom-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tb-search{flex:1;max-width:430px;display:flex;align-items:center;gap:8px;height:32px;padding:0 11px;background:var(--panel2);border:1px solid var(--border);transition:.2s}
.tb-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.tb-search .si{font-size:.75em;color:var(--text-dim)}
.tb-search input{flex:1;min-width:0;border:none;background:transparent;outline:none;color:var(--text-body);font-size:.68em;font-family:inherit}
.tb-ctl{display:flex;align-items:center;gap:5px;margin-left:auto}
.tb-btn{height:28px;padding:0 9px;background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);font-size:.62em;font-family:inherit;letter-spacing:.06em;cursor:pointer;transition:.2s;white-space:nowrap}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tb-btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tb-btn.sync-all{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.tb-btn.sync-all:hover{background:var(--accent);color:#fff}
.tb-font{display:flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--border);padding:2px 4px}
.tb-font button{width:22px;height:22px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;font-size:.65em;font-family:inherit;transition:.15s}
.tb-font button:hover{border-color:var(--accent);color:var(--accent)}
.tb-font span{min-width:26px;text-align:center;font-size:.65em;color:var(--text);font-variant-numeric:tabular-nums}
.tb-font input{width:46px;height:22px;text-align:center;background:transparent;border:1px solid var(--border);color:var(--text);font-size:.65em;font-family:inherit;font-variant-numeric:tabular-nums;outline:none;border-radius:2px}
.tb-font input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.tb-font input::-webkit-outer-spin-button,.tb-font input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

#view{position:absolute;top:56px;left:0;right:0;bottom:0;z-index:var(--z-view);overflow:hidden}
#view.lock{overflow:hidden;display:flex;flex-direction:column}

.btn{height:30px;padding:0 12px;background:var(--panel2);border:1px solid var(--border);color:var(--text-body);font-size:.66em;font-family:inherit;letter-spacing:.06em;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.12);color:#fff}
.btn.danger:hover{border-color:#ff3b3b;color:#ff6b6b;background:rgba(255,59,59,.1)}
.mini{width:28px;height:26px;border:1px solid var(--border);background:var(--panel2);color:var(--text-dim);cursor:pointer;font-size:.6em;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
.mini:hover{background:var(--accent);color:#fff}
.mini-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:.58em;font-family:inherit;padding:3px 9px;cursor:pointer;transition:.2s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.red:hover{border-color:#ff3b3b;color:#ff6b6b}
.mini-btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

.popover{position:absolute;right:20px;top:62px;width:340px;z-index:var(--z-popover);background:rgba(var(--panel-rgb),.98);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow);display:none;max-height:calc(100vh - 80px);overflow-y:auto;backdrop-filter:blur(14px)}
.popover.open{display:block}
.pop-head{display:flex;align-items:center;justify-content:space-between;font-size:.72em;font-weight:600;margin-bottom:12px;color:var(--text)}
.popover label{display:flex;align-items:center;justify-content:space-between;font-size:.66em;color:var(--text-dim);padding:6px 0;gap:8px}
.popover input[type=color]{width:52px;height:26px;border:1px solid var(--border);background:transparent;cursor:pointer;padding:2px}
.popover input[type=range]{width:130px;accent-color:var(--accent)}
.popover .val{font-size:.85em;color:var(--accent);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.pop-section{font-size:.58em;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--border-soft)}
.pop-actions{display:flex;flex-direction:column;gap:6px;margin-top:12px}

#toast{position:absolute;left:50%;bottom:40px;transform:translate(-50%,20px);background:var(--accent);color:#fff;padding:10px 22px;font-size:.72em;letter-spacing:.06em;opacity:0;pointer-events:none;transition:.28s;z-index:var(--z-toast);box-shadow:0 12px 34px color-mix(in srgb,var(--accent) 45%,transparent);max-width:1200px;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;padding:30px}
.modal{background:rgba(var(--panel-rgb),.98);border:1px solid var(--border);border-top:2px solid var(--accent);max-width:800px;width:100%;max-height:760px;display:flex;flex-direction:column;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-soft)}
.modal-head h3{font-size:1.05em;font-weight:400;letter-spacing:.14em;color:var(--text);flex:1}
.modal-close{background:transparent;border:1px solid var(--border);color:var(--text-dim);width:28px;height:28px;cursor:pointer;font-size:.8em}
.modal-close:hover{border-color:var(--accent);color:var(--accent)}
.modal-body{padding:20px 24px 26px;overflow-y:auto;font-size:.82em;line-height:2.05}
.modal-body b{color:var(--text);font-weight:600}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft)}
.doc-content{font-size:.86em;line-height:2.15;white-space:pre-wrap}

.hover-tip{position:fixed;z-index:var(--z-tip);max-width:400px;background:rgba(var(--panel-rgb),.99);border:1px solid var(--border);border-top:2px solid var(--accent);padding:12px 14px;box-shadow:var(--shadow);pointer-events:none;backdrop-filter:blur(14px);font-size:.72em;line-height:1.85;color:var(--text-body);animation:tipFade .12s ease}
@keyframes tipFade{from{opacity:0}to{opacity:1}}
.hover-tip h4{font-size:.95em;color:var(--text);margin-bottom:6px}
.hover-tip .sub{font-size:.85em;color:var(--text-dim);margin-bottom:8px;letter-spacing:.06em}
.hover-tip .tip-body{max-height:200px;overflow-y:auto;white-space:pre-wrap}
.hover-tip b{color:var(--text);font-weight:600}
.hover-tip i{font-style:normal;color:var(--accent)}

/* ===== 通用面板拖拽调整 ===== */
.view-sidebar,.ev-sidebar{position:relative}
.pane-resizer{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:var(--z-resizer);touch-action:none}
.pane-resizer::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:transparent;transition:background .18s,box-shadow .18s;border-radius:2px}
.pane-resizer:hover::before,.pane-resizer.active::before{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.pane-resizer::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:26px;transform:translate(-50%,-50%);border-radius:3px;background:transparent;transition:background .18s}
.pane-resizer:hover::after{background:color-mix(in srgb,var(--accent) 40%,transparent)}

.view-layout{display:grid;grid-template-columns:260px minmax(0,1fr);width:100%;height:100%;background:rgba(var(--panel-rgb),var(--local-panel-alpha,.15));backdrop-filter:blur(var(--local-panel-blur,0px))}
.view-sidebar{display:flex;flex-direction:column;min-height:0;background:rgba(var(--panel-rgb),.6);border-right:1px solid var(--border);backdrop-filter:blur(10px)}
.sb-head{padding:12px 14px 8px;border-bottom:1px solid var(--border-soft);flex:0 0 auto}
.sb-head h3{font-size:.72em;font-weight:600;color:var(--text);letter-spacing:.14em;margin-bottom:8px;text-shadow:var(--text-shadow)}
.sb-search{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;background:var(--panel2);border:1px solid var(--border);transition:.2s}
.sb-search:focus-within{border-color:var(--accent)}
.sb-search .si{font-size:.68em;color:var(--text-dim)}
.sb-search input{flex:1;min-width:0;border:none;background:transparent;outline:none;color:var(--text-body);font-size:.68em;font-family:inherit}
.sb-panel-ctrl{border-bottom:1px solid var(--border-soft);padding:10px 14px;font-size:.62em;background:color-mix(in srgb,var(--accent) 5%,transparent)}
.sb-panel-ctrl .pctrl-head{font-size:.58em;letter-spacing:.18em;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sb-panel-ctrl .pctrl-head .arrow{font-size:.8em;transition:transform .18s}
.sb-panel-ctrl.collapsed .pctrl-head .arrow{transform:rotate(-90deg)}
.sb-panel-ctrl .pctrl-body{display:block}
.sb-panel-ctrl.collapsed .pctrl-body{display:none}
.sb-panel-ctrl label{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--text-dim);padding:3px 0}
.sb-panel-ctrl input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
.sb-panel-ctrl .val{color:var(--accent);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.sb-body{flex:1;overflow-y:auto;min-height:0;padding:6px 0}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:.7em;color:var(--text-dim);cursor:pointer;transition:.15s;border-left:2px solid transparent;text-decoration:none}
.sb-item:hover{background:var(--hover);color:var(--text)}
.sb-item.active{color:var(--accent);border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sb-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .badge{font-size:.85em;color:var(--accent);font-variant-numeric:tabular-nums}
.sb-section{font-size:.58em;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;padding:10px 14px 4px}
.sb-actions{padding:8px 14px;border-top:1px solid var(--border-soft);flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.sb-actions .btn{width:100%;font-size:.62em;text-align:center}
.sb-empty{padding:24px 14px;text-align:center;color:var(--text-dim);font-size:.66em;line-height:2}
.view-main{overflow-y:auto;min-height:0;position:relative}

.archive-body{padding:22px 32px 120px}
.page-hero{border:1px solid var(--border);border-left:2px solid var(--accent);background:linear-gradient(140deg,rgba(var(--panel-rgb),.7),rgba(var(--panel-rgb),.35));padding:22px 24px;margin-bottom:22px}
.page-hero h1{font-size:1.55em;font-weight:300;letter-spacing:.3em;color:var(--text);margin-bottom:8px}
.page-hero p{font-size:.72em;color:var(--text-dim);letter-spacing:.1em;line-height:2}
.keyrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.keychip{font-size:.62em;letter-spacing:.12em;padding:3px 10px;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:.2s;display:inline-block}
.keychip:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.section{margin-bottom:18px;scroll-margin-top:20px}
/* 档案分区折叠：网格行高动画（原 display:none 无动画且引发跳变/掉帧） */
.section-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.3,.8,.4,1)}
.section.collapsed .section-body{grid-template-rows:0fr}
.section-body-in{overflow:hidden;min-height:0}
.section-head{display:flex;align-items:center;gap:11px;padding:11px 15px;border:1px solid var(--border);border-left:2px solid var(--accent2);background:rgba(var(--panel-rgb),.5);cursor:pointer;user-select:none;transition:.2s}
.section-head:hover{border-left-color:var(--accent);background:var(--hover)}
.section-head h2{font-size:.8em;font-weight:600;letter-spacing:.2em;color:var(--text);text-shadow:var(--text-shadow)}
.section-head .desc{font-size:.62em;color:var(--text-dim);letter-spacing:.1em}
.section-head .cnt{margin-left:auto;font-size:.62em;color:var(--text-dim);font-variant-numeric:tabular-nums}
.section-body-in{padding-top:7px}
/* 离屏档案卡片跳过渲染，显著降低折叠 / 展开时的布局与绘制开销 */
.archive-body .card{content-visibility:auto;contain-intrinsic-size:auto 96px}
/* 档案折叠动画期间暂停模糊合成 */
.view-layout.fold-anim,.view-layout.fold-anim .view-sidebar{backdrop-filter:none}
.view-layout.fold-anim .section-body,.view-layout.fold-anim .card-body{will-change:grid-template-rows}
.chev{display:inline-block;width:11px;font-size:.6em;color:var(--accent);transition:transform .22s;flex-shrink:0}
.chev.closed{transform:rotate(-90deg)}
.card{border:1px solid var(--border);border-left:2px solid var(--border);background:rgba(var(--panel-rgb),.4);margin-bottom:7px;transition:.22s}
.card:hover{border-left-color:var(--accent);background:var(--hover)}
.card.collapsed .card-body{display:none}
.card.is-user{border-left-color:var(--accent2)}
.card-head{display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer;user-select:none}
.card-head h3{font-size:.8em;font-weight:600;color:var(--text);letter-spacing:.06em;flex-shrink:0;text-shadow:var(--text-shadow)}
.card-head .sub{font-size:.64em;color:var(--text-dim);letter-spacing:.06em;flex-shrink:0}
.card-head .spacer{flex:1}

.wd-head{padding:16px 20px 10px;border-bottom:1px solid var(--border-soft);position:relative;flex:0 0 auto}
.wd-head .close{position:absolute;right:14px;top:14px;width:28px;height:28px;background:transparent;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-size:.8em;display:flex;align-items:center;justify-content:center}

.wd-level{font-size:1.8em;font-weight:200;color:var(--wd-color,var(--accent));line-height:1;text-shadow:0 0 30px color-mix(in srgb,var(--wd-color,var(--accent)) 55%,transparent);margin-bottom:6px}
.wd-name{font-size:.92em;font-weight:500;color:var(--text);letter-spacing:.1em;margin-bottom:4px}
.wd-terrain{font-size:.66em;color:var(--text-dim)}
.wd-body{flex:1;overflow-y:auto;padding:14px 20px 24px;font-size:.78em;line-height:2;white-space:pre-wrap}
.wd-line{position:absolute;left:-120px;top:32px;width:120px;height:2px;background:linear-gradient(270deg,var(--wd-color,var(--accent)) 0%,transparent 100%);opacity:.8;pointer-events:none}
.wd-line::before{content:'';position:absolute;left:0;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--wd-color,var(--accent));box-shadow:0 0 12px var(--wd-color,var(--accent));animation:wdPulse calc(var(--bl-period)*.8) ease-in-out infinite}
@keyframes wdPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:1}}

/* 详情连线 SVG */
.world-detail-links{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.world-detail-links path{fill:none;stroke:var(--bl-blood);stroke-linecap:round;}

/* 世界中心血线呼吸动画 */
#worldPathMain { animation: worldLineBreath var(--bl-period) ease-in-out infinite; }
#worldPathSub { animation: worldLineBreath var(--bl-period) ease-in-out infinite; animation-delay: -2s; }
@keyframes worldLineBreath {
  0%,100% { opacity: calc(.15 * var(--bl-intensity)); }
  50% { opacity: calc(.75 * var(--bl-intensity)); }
}

.bio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

/* 数据管理 */
.data-wrap{display:grid;grid-template-columns:260px minmax(0,1fr);width:100%;height:100%;background:rgba(var(--panel-rgb),var(--local-panel-alpha,.15));backdrop-filter:blur(var(--local-panel-blur,0px))}

.data-hero h1{font-size:1.4em;font-weight:300;letter-spacing:.3em;color:var(--text);margin-bottom:8px}

.data-grid .row input:focus,.data-grid .row textarea:focus{border-color:var(--accent)}
.data-grid .row input[type=color]{width:100%;height:30px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;padding:2px}

/* ============================================================
   v3 增强：动画 · 人物档案 · 展示图库 · 导航拖拽 · 右键编辑
   ============================================================ */
/* 视图切换入场动画 */
#view>*{animation:viewIn .24s cubic-bezier(.2,.7,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* 弹窗入场 */
.modal{animation:modalIn .3s cubic-bezier(.2,.8,.3,1.12) both}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
/* 卡片展开/收起动画（二级条目默认折叠） */
.card-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s cubic-bezier(.3,.8,.4,1)}
.card-body-in{overflow:hidden;min-height:0}
.card.collapsed .card-body{display:grid;grid-template-rows:0fr}
.card-body{padding:0}
.card-body-in{padding:0 16px 14px 38px;transition:padding-bottom .32s cubic-bezier(.3,.8,.4,1)}
.card.collapsed .card-body-in{padding-bottom:0}
/* 分区折叠动画 */
.section-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s cubic-bezier(.3,.8,.4,1)}
.section-body-in{overflow:hidden;min-height:0}
.section.collapsed .section-body{display:grid;grid-template-rows:0fr}
.section-body{padding-top:0}
.section-body-in{padding-top:7px}
/* 板块外观折叠动画 */
.sb-panel-ctrl .pctrl-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s cubic-bezier(.3,.8,.4,1);overflow:hidden}
.sb-panel-ctrl.collapsed .pctrl-body{display:grid;grid-template-rows:0fr}
/* 世界标签页切换动画 */
.world-tab-pane.active{display:block;animation:paneIn .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes paneIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
/* 可右键编辑文本的提示 */
[data-edit]{cursor:context-menu}
[data-edit]:hover{outline:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

.mainnav a.nav-flip{transition:transform .28s cubic-bezier(.3,.8,.4,1)}
/* 档案独立页面 */
.arch-page-head{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-left:2px solid var(--accent);background:linear-gradient(140deg,rgba(var(--panel-rgb),.7),rgba(var(--panel-rgb),.35));padding:20px 24px;margin-bottom:20px}

.arch-page-head .cnt{margin-left:auto;font-size:.62em;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:2px 10px;white-space:nowrap}
.arch-tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.arch-tab{padding:8px 16px;font-size:.72em;letter-spacing:.14em;color:var(--text-dim);cursor:pointer;background:transparent;border:none;border-bottom:2px solid transparent;font-family:inherit;transition:.2s;display:inline-flex;align-items:center;gap:7px}

.gal-detail .gd-line{height:2px;background:linear-gradient(90deg,transparent,var(--bl-blood),transparent);animation:gdPulse 2.6s ease-in-out infinite}
@keyframes gdPulse{0%,100%{opacity:.45}50%{opacity:1}}
.gal-detail .gd-head{padding:16px 20px 6px;position:relative}
.gal-detail .gd-head .close{position:absolute;right:12px;top:12px;background:transparent;border:1px solid var(--border);color:var(--text-dim);width:26px;height:26px;cursor:pointer;font-size:.75em}
.gal-detail .gd-head .close:hover{border-color:var(--accent);color:var(--accent)}
.gal-detail .gd-name{font-size:1em;color:var(--text);letter-spacing:.08em;padding-right:34px}
.gal-detail .gd-meta{font-size:.58em;color:var(--text-dim);letter-spacing:.1em;margin-top:5px}
.gal-detail .gd-img{margin:12px 20px 0;border:1px solid var(--border);max-height:280px;object-fit:cover;width:calc(100% - 40px);display:block;background:var(--panel2)}
.gal-detail .gd-story{padding:14px 20px;font-size:.74em;line-height:2;color:var(--text-body)}
.gal-detail .gd-story b{color:var(--text)}
.gal-detail .gd-ops{padding:0 20px 20px;display:flex;gap:8px}
.gal-detail-links{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.gal-detail-links path{fill:none;stroke:var(--bl-blood);stroke-linecap:round}
@keyframes worldLineBreathV{0%,100%{opacity:.2}50%{opacity:.75}}
.gal-card{animation:cardIn .4s cubic-bezier(.2,.7,.3,1) both}
/* 右键编辑弹层内的小字提示 */
.edit-tip{font-size:.6em;color:var(--text-dim);margin-top:10px;letter-spacing:.06em;line-height:1.8}

/* ==================== v4：人物档案 · 战力雷达 · 图库拖拽 · 移动端 ==================== */
.chars-wrap{display:grid;grid-template-columns:350px minmax(0,1fr);width:100%;height:100%;background:rgba(var(--panel-rgb),var(--local-panel-alpha,.15));backdrop-filter:blur(var(--local-panel-blur,0px))}
.chars-side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:rgba(var(--panel-rgb),.6);backdrop-filter:blur(10px)}
/* 折叠动画期间临时关闭侧栏背景模糊：避免每帧重采样模糊导致卡顿 */
.chars-side.fold-anim{backdrop-filter:none}
.chars-side.fold-anim .cat-sub-wrap,.chars-side.fold-anim .char-sub-body,.chars-side.fold-anim .char-sub2-body,.chars-side.fold-anim .char-roster-body{will-change:grid-template-rows}
.chars-list{flex:1;overflow-y:auto;min-height:0;padding:10px 12px}
.char-roster-group{margin-bottom:14px}
.char-roster-head{display:flex;align-items:center;gap:6px;font-size:.62em;letter-spacing:.2em;color:var(--text-dim);padding:5px 4px;cursor:pointer;user-select:none}
.char-roster-head .chev{transition:transform .2s;font-size:.8em}
.char-roster-group.collapsed .char-roster-head .chev{transform:rotate(-90deg)}
.char-roster-head .cnt{margin-left:auto;opacity:.7}
.char-roster-head .add-sub{margin-left:6px}
.char-roster-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
.char-roster-group.collapsed .char-roster-body{grid-template-rows:0fr}
.char-roster-body-in{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:4px}
.char-roster-group.collapsed .char-roster-body-in{padding-bottom:0}
.char-roster-item{display:flex;gap:10px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:5px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;animation:cardIn .35s cubic-bezier(.2,.7,.3,1) both}
.char-roster-item:hover{background:var(--hover);transform:translateX(3px)}
.char-roster-item.active{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.char-roster-item img{width:36px;height:48px;object-fit:cover;border-radius:3px;background:var(--panel2);flex:0 0 auto}
.ri-ph{width:36px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--text-dim);border-radius:3px;flex:0 0 auto}
.ri-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
.ri-info{min-width:0;flex:1}
.ri-info .nm{font-size:.72em;color:var(--text);line-height:1.5}
.ri-info .id2{font-size:.58em;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.chars-main{min-height:0;overflow-y:auto;padding:22px 28px 40px}
.ch-left{display:flex;gap:20px;align-items:center;justify-content:flex-start;min-width:0}
.ch-left>img{width:236px;height:315px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:var(--panel2);flex:0 0 auto;box-shadow:var(--shadow)}
.ch-ph{width:236px;height:315px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);color:var(--text-dim);font-size:.62em;text-align:center;border-radius:8px;flex:0 0 auto;line-height:2}
.char-hero-info{align-self:center;display:flex;flex-direction:column;gap:10px;min-width:0}
.char-hero-info h1{font-size:1.2em}
.char-hero-info .char-tagline{font-size:.68em}
.char-hero-info{min-width:0;flex:1}
.char-hero-info h1{font-size:1.05em;color:var(--text);letter-spacing:.06em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.char-hero-info h1 .mini-btn{font-size:.5em;letter-spacing:.1em}
.char-tagline{font-size:.64em;color:var(--text-dim);margin-top:4px;line-height:2}
.char-tagline b{color:var(--accent);font-weight:600}
.char-desc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;margin:16px 0 6px}
.char-desc-item{border:1px solid var(--border-soft);border-radius:6px;padding:7px 10px;background:rgba(var(--panel-rgb),.4);transition:border-color .2s}
.char-desc-item:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.char-desc-item .k{font-size:.55em;letter-spacing:.18em;color:var(--text-dim)}
.char-desc-item .v{font-size:.7em;color:var(--text-body);margin-top:2px;min-height:1.4em}
.ability-link{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:.78em;color:var(--accent);cursor:pointer;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:14px;padding:1px 9px;transition:.2s;vertical-align:middle}
.ability-link:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.radar-sec h2{font-size:.72em;letter-spacing:.28em;color:var(--text);margin:22px 0 12px;display:flex;align-items:center;gap:12px}
.radar-sec h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,transparent),transparent)}
.radar-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.radar-panel{background:rgba(var(--panel-rgb),.5);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;animation:radarIn .45s cubic-bezier(.2,.7,.3,1) both;transition:border-color .3s,box-shadow .3s}
.radar-panel.pulse{animation:radarPulse 1s ease 2}
@keyframes radarPulse{0%,100%{box-shadow:0 0 0 0 transparent;border-color:var(--border-soft)}50%{box-shadow:0 0 28px color-mix(in srgb,var(--accent) 55%,transparent);border-color:var(--accent)}}
.radar-panel h3{font-size:.62em;letter-spacing:.24em;color:var(--accent);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.radar-panel h3 .rp-ops{display:flex;gap:6px}
.radar-svg-wrap{display:flex;justify-content:center;position:relative}
.radar-svg-wrap svg{max-width:100%}
.radar-empty{text-align:center;color:var(--text-dim);font-size:.66em;padding:26px 0;line-height:2.2}
.preset-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.preset-pill{display:inline-flex;align-items:center;gap:4px;font-size:.6em;padding:3px 9px;border:1px solid var(--border);border-radius:16px;color:var(--text-dim);cursor:pointer;transition:.15s;background:transparent;font-family:inherit;line-height:1.7}
.preset-pill:hover{color:var(--text);border-color:var(--accent)}
.preset-pill.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.preset-pill .pp-kind{opacity:.55;font-size:.85em}
.preset-pill .pp-x{opacity:.5;padding:0 1px}
.preset-pill .pp-x:hover{opacity:1;color:var(--accent)}
.preset-add{font-size:.6em;color:var(--text-dim);border:1px dashed var(--border);background:none;border-radius:16px;padding:3px 10px;cursor:pointer;font-family:inherit;transition:.15s}
.preset-add:hover{color:var(--accent);border-color:var(--accent)}
.radar-ctl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);font-size:.62em;color:var(--text-dim)}
.radar-ctl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.radar-ctl input[type=color]{width:26px;height:20px;border:1px solid var(--border);background:none;padding:0;cursor:pointer;border-radius:3px}
.radar-ctl input[type=range]{width:86px;accent-color:var(--accent)}
.radar-ctl select{background:var(--panel2);color:var(--text);border:1px solid var(--border);font-size:.95em;padding:2px 5px;font-family:inherit;border-radius:3px}
.radar-ctl .val{color:var(--accent);min-width:34px;font-variant-numeric:tabular-nums}
@keyframes radarIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
/* 图库分类拖拽 */
.gal-tab,.gal-sub-btn{cursor:grab;user-select:none}
.gal-tab.dragging,.gal-sub-btn.dragging{opacity:.4;cursor:grabbing}
.gal-tab.drop-hint,.gal-sub-btn.drop-hint{border-color:var(--accent)!important;color:var(--accent)!important}
/* 雷达字号跟随整体字号（--fs） */
.radar-svg-wrap text{font-size:.58em;fill:var(--text-dim)}
.radar-axis{cursor:context-menu}
.radar-axis:hover{fill:var(--accent)}
text.radar-axis:hover{fill:var(--accent)}
/* 雷达面板：单侧雷达图 + 数值滑杆 */
.rp-body{display:flex;gap:14px;align-items:flex-start;margin-top:4px}
.radar-side{flex:0 0 auto}
.radar-ctl-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:8px}
.ax-ctl{display:flex;align-items:center;gap:8px;font-size:.6em}
.ax-ctl .ax-name{flex:0 0 62px;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px dashed transparent;transition:.15s}
.ax-ctl .ax-name:hover{border-bottom-color:var(--accent);color:var(--accent)}
.ax-ctl input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
.ax-ctl .ax-val{flex:0 0 26px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
/* 人物介绍 / 生平简述 */
.ci-sec{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.ci-block{border:1px solid var(--border-soft);border-radius:8px;background:rgba(var(--panel-rgb),.4);padding:12px 16px;animation:radarIn .45s cubic-bezier(.2,.7,.3,1) both}
.ci-head{font-size:.6em;letter-spacing:.24em;color:var(--accent);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ci-head span{font-size:.85em;color:var(--text-dim);letter-spacing:.08em;opacity:.7}
.ci-body{font-size:.7em;color:var(--text-body);line-height:2.1;min-height:3em}
/* 事件 · 时间线自定义颜色 */
.ev-item .t{color:var(--ev-accent,var(--text))}
.ev-item .kind{border-color:var(--ev-accent,var(--border-soft));color:var(--ev-accent,var(--text-dim))}
.tl-color-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px}
.tl-color-grid label{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tl-color-grid input[type=color]{width:24px;height:18px;border:1px solid var(--border);background:none;padding:0;cursor:pointer;border-radius:3px}
/* 人物档案：hero 三栏（照片 / 姓名能力 / 基础信息） */
.char-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;margin-bottom:14px;animation:radarIn .45s cubic-bezier(.2,.7,.3,1) both}
.ch-mid{display:flex;flex-direction:column;gap:12px;min-width:0;justify-content:center;margin-top:14px}
.ch-mid h1{font-size:1.2em}
.ch-id{font-size:.7em;color:var(--text-body)}
.ch-id b{color:var(--accent);font-weight:600}
.ch-row{font-size:.68em;color:var(--text-body)}
.ch-row .k{color:var(--text-dim)}
.ch-right{border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;background:rgba(var(--panel-rgb),.4)}
.ch-right-head{font-size:.95em;font-weight:700;letter-spacing:.22em;color:var(--accent);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:.66em}
.ch-info-grid .ii{display:flex;gap:8px;min-width:0}
.ch-info-grid .ii.wide{grid-column:1/-1}
.ch-info-grid .k{color:var(--text-dim);flex:0 0 auto}
.ch-info-grid .v{color:var(--text-body);min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 内容块显示 / 隐藏 */
.ch-sec-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease}
.ch-sec.collapsed .ch-sec-body{grid-template-rows:0fr}
.ch-sec-body-in{overflow:hidden;min-height:0}
.ch-sec-toggle{font-size:.85em;padding:0 7px}
/* 人物分类列表 */
.cat-list{margin:2px 0 8px}
.char-cat-item{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;font-size:.64em;color:var(--text-dim);cursor:pointer;border-left:2px solid transparent;border-radius:4px;transition:background .15s,color .15s;user-select:none}
.char-cat-item:hover{background:var(--hover);color:var(--text)}
.char-cat-item.active{color:var(--accent);border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.char-cat-item.dragging{opacity:.4}
.cat-drag{cursor:grab;opacity:.4;font-size:.9em;flex:0 0 auto}
.cat-drag:hover{opacity:1;color:var(--accent)}
.sb-item.ar-cat-item{display:flex;align-items:center;gap:7px}
.cat-chk{accent-color:var(--accent);cursor:pointer;flex:0 0 auto;margin:0}
.char-cat-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-cat-item .badge{font-size:.85em;opacity:.55}
.cat-x{opacity:.3;cursor:pointer;padding:0 2px;flex:0 0 auto}
.cat-x:hover{opacity:1;color:var(--accent)}
.cat-add{opacity:.45;cursor:pointer;padding:0 2px;flex:0 0 auto;font-size:1.05em;line-height:1;color:var(--accent2)}
.cat-add:hover{opacity:1;color:var(--accent)}
.char-sub-head.drop-hot{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px}
/* 分类阵营颜色 · 隐藏显示 */
.char-cat-item .cat-color{-webkit-appearance:none;appearance:none;width:15px;height:15px;border:1px solid var(--border);border-radius:50%;padding:0;background:none;cursor:pointer;flex:0 0 auto;transition:box-shadow .15s}
.char-cat-item .cat-color:hover{box-shadow:0 0 8px currentColor}
.char-cat-item .cat-color::-webkit-color-swatch-wrapper{padding:1px}
.char-cat-item .cat-color::-webkit-color-swatch{border:none;border-radius:50%}
.char-cat-item .cat-color::-moz-color-swatch{border:none;border-radius:50%}
.cat-eye{cursor:pointer;opacity:.45;flex:0 0 auto;font-size:.85em;transition:.15s;user-select:none;width:15px;text-align:center}
.cat-eye:hover{opacity:1;color:var(--accent)}
.cat-eye.off{opacity:.35;color:var(--text-dim)}
.char-cat-item.cat-hidden .nm{opacity:.4;text-decoration:line-through}
/* v9：新建人物 / 阵营弹窗字号整体放大一号 */
.char-modal{font-size:1.14em}
.char-modal .modal-head h3{font-size:1.1em}
.char-modal .modal-close{width:32px;height:32px;font-size:.9em}
.char-modal .data-grid .row label{font-size:.72em}
.char-modal .data-grid .row input[type=text]{font-size:.8em;padding:7px 10px}
.char-modal .data-grid .row textarea{font-size:.8em;padding:7px 10px}
.char-modal .data-grid .row select{font-size:.82em}
.char-modal .btn{font-size:.74em;height:34px;padding:0 16px}
.char-modal .edit-tip{font-size:.66em}
/* v9：阵营 / 分类详情入口 */
.cat-info{opacity:.35;cursor:pointer;flex:0 0 auto;font-size:.85em;transition:opacity .15s,color .15s;user-select:none}
.cat-info:hover{opacity:1;color:var(--accent)}
/* v9：名录人物条目不重复播放入场动画（点选刷新不再闪烁） */
.chars-list .char-roster-item{animation:none}
/* v9：创作台左栏操作行 */
.st-ops{display:flex;gap:6px;padding:0 12px 8px;border-bottom:1px solid var(--border-soft);flex:0 0 auto}
.st-ops .btn{flex:1;font-size:.6em;height:28px;padding:0 8px}
/* v9.1：点击查看原图 */
img[data-view-src]{cursor:zoom-in}
.img-viewer-mask{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.92);display:flex;flex-direction:column;opacity:0;transition:opacity .18s;cursor:zoom-out}
.img-viewer-mask.in{opacity:1}
.img-viewer-mask.out{opacity:0}
.img-viewer-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#fff;font-size:13px;flex:0 0 auto;font-family:inherit}
.img-viewer-bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-viewer-bar .h{opacity:.55;font-size:12px}
.img-viewer-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img-viewer-wrap img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;transition:transform .12s}
/* 人物多选 */
.char-roster-item .selbox{display:none}
.char-roster-item.multi-sel{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* 多选操作栏 */
.char-cat-block .cat-fold{flex:0 0 auto;width:13px;text-align:center;color:var(--text-dim);cursor:pointer;font-size:.72em;transition:transform .22s,color .15s;user-select:none}
.char-cat-block .cat-fold:hover{color:var(--accent)}
.char-cat-block .cat-fold.off{transform:rotate(-90deg)}
.cat-sub-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s ease}
.cat-sub-wrap.collapsed{grid-template-rows:0fr}
.cat-sub-wrap-in{overflow:hidden;min-height:0}
/* ===== 三级分类：第一类(阵营/势力·其他人物) > 第二类(内部·外部成员) > 第三类(重要·其他人物) ===== */
.char-cat-block{margin-bottom:2px}
.char-sub2-head{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 24px;font-size:.6em;letter-spacing:.16em;color:var(--accent2);cursor:pointer;user-select:none;transition:color .15s}
.char-kind-head{display:flex;align-items:center;gap:8px;padding:6px 4px 2px;user-select:none}
.char-kind-head .kh-tag{font-size:.58em;letter-spacing:.3em;color:var(--text-dim);border-left:2px solid color-mix(in srgb,var(--accent) 60%,transparent);padding-left:8px}
.char-kind-head .cnt{margin-left:auto;font-size:.56em;color:var(--text-dim);border:1px solid var(--border);padding:0 7px}
.char-roster-item.dragging{opacity:.45}
.char-sub2-head.drop-hot,.char-cat-item.drop-hot,.char-roster-item.drop-hot{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px}
.ch-drag-ghost{position:fixed;z-index:9999;pointer-events:none;background:color-mix(in srgb,var(--accent) 88%,black);color:#fff;font-size:.62em;letter-spacing:.12em;padding:4px 12px;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap}
.gal-card.dragging{opacity:.4}
.char-sub2-head:hover{color:var(--text)}
.char-sub2-head .chev2{font-size:.8em;transition:transform .2s;color:var(--accent2)}
.char-sub2-head.off .chev2{transform:rotate(-90deg)}

.char-sub2-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s cubic-bezier(.3,.8,.4,1)}

.char-sub2-body-in{overflow:hidden;min-height:0}
.char-sub-head{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 40px;font-size:.58em;letter-spacing:.12em;color:var(--text-dim);cursor:pointer;user-select:none;transition:color .15s}
.char-sub-head:hover{color:var(--text)}
.char-sub-head .chev2{font-size:.8em;transition:transform .2s}
.char-sub-head.off .chev2{transform:rotate(-90deg)}
.char-sub-head .cnt{margin-left:auto;opacity:.6;letter-spacing:.05em}
.char-sub-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s cubic-bezier(.3,.8,.4,1)}

.char-sub-body-in{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:4px;padding:2px 0 4px 26px}
.ri-badge{flex:0 0 auto;font-size:.52em;letter-spacing:.05em;padding:0 4px;border:1px solid color-mix(in srgb,var(--accent2) 45%,transparent);color:var(--accent2);border-radius:3px;line-height:1.7}
.ri-badge.ext{border-color:var(--border);color:var(--text-dim)}
.ri-star{color:#ffb020;font-size:.72em;flex:0 0 auto;text-shadow:0 0 6px rgba(255,176,32,.55)}
/* ===== 图库动画：图片淡入 · 悬停缩放 · 详情图切换动画 ===== */
.gal-card img{opacity:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
.gal-card img.ld{opacity:1}
.gal-card:hover img{transform:scale(1.07)}
.gal-detail .gd-img{animation:gdImgIn .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes gdImgIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.sb-item.dragging{opacity:.4}
/* 事件 · 双时间线模式切换 */
.ev-slide{position:relative;width:100%;height:100%;overflow:hidden}
.ev-mode-sw{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex:0 0 auto}
.ev-mode-sw button{font-family:inherit;font-size:.6em;letter-spacing:.14em;padding:5px 14px;background:transparent;color:var(--text-dim);border:none;cursor:pointer;transition:.25s}
.ev-mode-sw button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.ev-cat{cursor:pointer;user-select:none}
.ev-cat::after{content:' ▾';opacity:.5;font-size:.85em}
.ev-cat.off::after{content:' ▸'}
/* 滑杆轨道透明 */

{id:'fgroup',name:'政党/阵营/势力',desc:'军团 · 议会 · 组织',subs:[{name:'军团',children:['第一军团','第二军团','第三军团','第四军团','第五军团','第六军团','第七军团','第八军团','第九军团','第十军团','第十一军团','第十二军团','第十三军团']},'锚议会','光照与生态分配委员会','记忆审查局','科研院','同行公约','熵辉联盟','地区','商会','黑市','异能者协会','艺术院','人文历史院','生物历史院',{name:'组织',children:['雇佣兵','非正式商会','零散异能者','武装力量']}]},
{id:'person',name:'人物档案',desc:'元帅 · 安全员 · 其他',subs:['军团','锚议会','光照与生态分配委员会','记忆审查局','科研院','同行公约','熵辉联盟','地区','商会','黑市','异能者协会','艺术院','人文历史院','生物历史院','组织','有重大贡献','有严重犯罪历史','其他']},
{id:'art',name:'美术与文化',desc:'光 · 分形 · 微小之物',subs:['人文美术','自然美学','设计','常见艺术','禁忌艺术','其他']}
];
function subNameOf(s){return typeof s==='string'?s:s.name}
function catSubs(c){return (c.subs||[]).map(subNameOf)}
function subChildren(c,sname){const s=(c.subs||[]).find(x=>typeof x!=='string'&&x.name===sname);return s&&Array.isArray(s.children)?s.children:null}
const AR_TAX_CATMAP={core:'core',horror:'aberr',bio:'bio',society:'society',legion:'fgroup',person:'person',faction:'fgroup',art:'art'};
const AR_TAX_DEFCLS={core:'平面',aberr:'有威胁',bio:'其他',mega:'其他',phen:'其他',spec:'待确认',society:'当前社会情况',fgroup:'军团',person:'其他',art:'其他'};
const ARCHIVE=[
/* ===== 世界法则 ===== */
{id:'core-layer',cat:'core',cls:'平面',title:'层界结构',sub:'0层 · ±1000米/层 · 9层宜居',tags:['空间','层','漂移边界','潮汐'],body:'人类适宜生存的空间内，正中平面命名为 <b>0层</b>，向上向下每 1000 米为 +1 / −1 层。±9 层（含 9 层）是人类适宜居住区。10 层内出现 <b>漂移边界</b>——不存在固定分界线，有序与混沌的阈值持续漂移，再往外开始出现认知污染与其他生物。'},
{id:'core-light',cat:'core',cls:'向上',title:'光照区 · Lx',sub:'阳光是奢侈品',tags:['光照区','Lx','亮度','权力'],body:'特殊地形会有阳光、恒星光等自然光出现，称之为 <b>光照区</b>，等级分为 <b>Lx 区</b>，x 表示亮度（如 1、3、5、7、9，正常正午日光亮度为 5）。阳光是奢侈品，L 区不仅是地形，更是权力、财富和希望的象征——谁掌控 L 区的分布和光照时间，谁就掌握着社会的情绪稳定剂。'},
{id:'core-up',cat:'core',cls:'向上',title:'向上 · 极限',sub:'重复中叠加的偏差',tags:['向上','因绯生物','极限','影像坍缩'],body:'向上的属性是「改变」。不断重复，极度微小的偏差叠加，导致最后一切变得陌生——这其实是<b>极限</b>。变化路径：<b>具体 → 模糊 → 无限接近具体</b>（有明显体征的因绯生物 → 无明显体征的因绯生物 → 类人的因绯生物）。越向上探索越会导致失去自我，且无法察觉；探索的终点便是同化消亡。'},
{id:'core-plane',cat:'core',cls:'平面',title:'平面 · 曼德博集合',sub:'锚定自我 · 无限',tags:['平面','曼德博','无限','共识'],body:'平面的属性是 <b>具体</b>。<b>锚定自我平面：曼德博集合</b>——这个是无限的。人类之间自带的冲突构成了平面最主要的认知污染来源。被框在两个平面之间，越过平面便是无尽的未知。'},
{id:'core-down',cat:'core',cls:'向下',title:'向下 · 认知锁',sub:'剥离恐惧',tags:['向下','深渊','认知锁','恐惧'],body:'向下的属性是 <b>模糊</b>。<b>凝聚共识向下：认知锁</b>（应该算有限）。向下探索同时意味着 <b>剥离恐惧</b>，向下是无法被触碰的无尽深渊。'},
{id:'core-anchor',cat:'core',cls:'平面',title:'锚定与共识',sub:'人类是低维具体性的极限模板',tags:['锚定','共识','锚定强度','具体'],body:'人类不是天然的人类，而是被<b>共识、记忆、光照、防护网和彼此承认</b>维持的「具体」。这个世界里人类与异类没有绝对本体鸿沟，只有<b>锚定强度</b>的差异：人类从具体滑向模糊，因绯生物、深渊生物、灰英人等，都是从模糊变成具体。两者在边界处交换位置。'},
/* ===== 巨构 ===== */
{id:'core-mega',cat:'mega',cls:'无生命',title:'巨构与砼核',sub:'水泥 · 石柱 · 无限延伸',tags:['巨构','建筑','砼核','深渊'],body:'建筑的主体一般为水泥，或直接将连接天地的石柱内部掏空做房屋设计，城市的主色调永远是灰暗。向上探索只能发现一层又一层仿佛凭空生成的建筑体；平面无限延伸，随机出现各种地形。'},
{id:'bio-array',cat:'mega',cls:'有生命',title:'阵列体 · 活体建筑',sub:'建筑是有生命的',tags:['阵列体','建筑','生命'],body:'阵列体是因绯生物的一种，是<b>向上探索时出现的规则建筑，且是活体</b>。阵列体的存在意味着：建筑是有生命的。漂移边界以内，具体哪部分巨构或建筑有生命，还未被人类探测出。'},
{id:'hor-bloodline',cat:'mega',cls:'有生命',title:'血线',sub:'巨构血管 · 活体脉络',tags:['血线','巨构','活体','脉络'],body:'在负层巨构内部被首次记录。它们像血管一样嵌在水泥与石柱之中。当 <b>[[bio-array|阵列体]]</b> 进入活化期时，血线会同步搏动。'},
{id:'mega-living',cat:'mega',cls:'有生命',title:'活体巨构与纵贯线锚点',sub:'+11层巨构核心 · 纵贯线',tags:['巨构核心','纵贯线','锚点','活体化'],body:'第一次发现巨构是有生命的、且和阵列体相连，是在负层开始探索后，具体实例为顾屿守护的 <b>+11 层巨构核心</b>。已发现的纵贯线锚点：<b>最上端 +13、中段 0、尾端 −7（主锚点）</b>。尾端锚点加速上移，若抵达更高层数将直接打通多个层，大部分军团的防护网络都会失效。'},
/* ===== 畸变 ===== */
{id:'hor-twisted',cat:'aberr',cls:'有威胁',title:'扭曲体',sub:'在漂移边界里被折碎的人形',tags:['扭曲体','漂移边界','人形','恐怖'],body:'返回者中有一部分被称为 <b>扭曲体</b>。最令人不安的一点是：<b>他们仍然认得自己的家人。</b>'},
{id:'hor-faceless',cat:'aberr',cls:'有威胁',title:'无面巡回体',sub:'看见它的人会忘记自己的脸',tags:['无面','巡回体','漂移边界','巡逻'],body:'在漂移边界内按固定路线巡逻的类人形体，<b>没有面部结构</b>。'},
/* ===== 生物 ===== */
{id:'bio-gray',cat:'bio',cls:'无威胁',title:'灰英人',sub:'被平面同化的存在',tags:['灰英人','曼德博边界','精神影子'],body:'在曼德博集合边界附近活动的「人类痕迹」，是长期生活在平面方向的人留下的「精神影子」，是「被平面同化的存在」，可能提供关于「无限循环」的线索。'},
{id:'bio-meye',cat:'bio',cls:'无威胁',title:'曼德博之眼',sub:'固定观察者',tags:['曼德博之眼','平面','观察者'],body:'平面扩展探索时出现的奇怪生物，<b>一般不移动</b>。纽曼娜阶段三时会变异：从固定观察者变成节点，看它的人会逐渐被收束成平面的一部分。'},
{id:'bio-mirror',cat:'bio',cls:'高威胁',title:'镜界游群',sub:'Mirror-Swarm · 模仿即饥饿',tags:['镜界游群','模仿','反光','混淆'],body:'平面探索时会遭遇快速移动的、表面高度反光的活体群。它们会「模仿」你看到的任何东西——这种模仿并非攻击性，而是「饥饿」：通过变成你见过的样子来使自己「存在」。模仿得越像，你越容易将它们与记忆中的真实事物混淆。'},
{id:'bio-roots',cat:'bio',cls:'高威胁',title:'逆熵根须',sub:'Negentropic Roots · 以未知为食',tags:['逆熵根须','深渊','物理规则','根须'],body:'深渊生物中一种以「下方更大未知」为食物的根须状生物，从深渊底部向人类居住区缓慢生长。不主动攻击，但根须穿过的区域物理定律会发生微调（重力、温度、熵的方向）。是「向下探索不只是空间变化，还是物理规则变化」的关键证据。'},
{id:'bio-neuman',cat:'bio',cls:'极大型',title:'纽曼娜集群',sub:'平面正在收敛',tags:['纽曼娜','平面进化','收敛','巨型'],body:'出现在平面的新生物：<b>纽曼娜集群 / 妞尔生物</b>，目前已知唯一不携带认知类污染的巨型生物，整体由无数粗细不一的「线」组成，体型百米至千米不等。纽尔生物是平面变化的指标，纽曼娜集群比纽尔生物更简洁、更集中、更高效——<b>人类可能正在看到平面本身在进化，平面在向某个方向收敛。</b>'},
{id:'bio-yinfei',cat:'bio',cls:'其他',title:'因绯生物',sub:'向上探索 · 形态多样',tags:['因绯生物','向上','本能','同化'],body:'向上探索时出现的可自由活动且形态多样的生物。大部分并无太高智慧，基本依靠本能行事，少部分有和人类相当的智慧。人类被其同化即成为其中一员。'},
{id:'bio-abyss',cat:'bio',cls:'其他',title:'深渊生物',sub:'向下探索 · 形态多样',tags:['深渊生物','向下','本能','深渊'],body:'向下探索时出现的可自由活动且形态多样的生物。大部分依靠本能行事，少部分拥有与人类相当的智慧。'},
/* ===== 现象 ===== */
{id:'core-pollution',cat:'phen',cls:'社会类',title:'认知污染',sub:'自动消化所有反面证据',tags:['认知污染','循环','幻觉'],body:'认知污染会 <b>自动消化所有反面证据</b>，用来巩固自身，形成封闭循环。向上：改变熟悉的事物；平面：人类之间自带的冲突；向下：大量未知冲击。'},
{id:'phen-tide',cat:'phen',cls:'世界变化类',title:'潮汐现象',sub:'十层内 · 集体幻觉',tags:['潮汐','十层','幻觉','防护'],body:'十层内会出现潮汐现象，一般根据十层外生物数量波动，导致第九层居民时不时出现集体幻觉或认知错乱，需要异能者主动防护。'},
{id:'phen-collapse',cat:'phen',cls:'世界变化类',title:'影像坍缩',sub:'高维投影独立于本体',tags:['影像坍缩','向上','投影','同化'],body:'向上探索一定距离后，高维在低维的投影会逐渐独立于本体，彻底独立后二者其一会直接扭曲，被因绯生物同化。黑市的「记忆租赁」正是利用此原理。'},
{id:'phen-array',cat:'phen',cls:'世界变化类',title:'畸变列阵',sub:'阵列体的畸变终点',tags:['畸变列阵','阵列体','类人'],body:'向上不断出现的阵列体畸变而来，最后会变成类似人类的样子。'},
{id:'phen-unobs',cat:'phen',cls:'世界变化类',title:'不可观测畸变体',sub:'抓不住局部形态',tags:['不可观测','扭曲','探测失效'],body:'向上探索时出现，形体不断自我复制，空间持续扭曲；当你聚焦某一处细节，细节消散、探测失效。只能瞥见整体轮廓，永远抓不住局部形态。'},
/* ===== 变化推测 ===== */
{id:'core-philo',cat:'spec',cls:'待确认',title:'逆流的人类',sub:'边界处的位置交换',tags:['哲学','具体','模糊','锚定'],body:'<b>人类是低维具体性的极限模板。</b>世界是在进化的，人类只是其中的逆流。探索的终点不是发现新世界，而是把自己变成世界的一部分。'},
{id:'spec-vert',cat:'spec',cls:'待确认',title:'纵贯线',sub:'+13 · 0 · −7（主锚点）',tags:['纵贯线','锚点','同化主义','拉力装置'],body:'阿黛尔·辉关于纵贯线的研究：最上端锚点在 +13，中段 0，尾端 −7（主锚点）。尾端锚点加速上移，若到了更高的层数，会直接打通好几个层，届时大部分军团的防护网络都会失效。<b>若琳（女）和予思兰（男）是同化主义</b>，两人夺取阿黛尔的研究，想将纵贯线直接打通让人类全部被同化，设计出拉力装置将主锚点持续向上拉。'},
{id:'spec-neuman',cat:'spec',cls:'有争议',title:'平面收敛 · 纽曼娜阶段推演',sub:'织网期 → 活体共识体',tags:['纽曼娜','收敛','推演','高维'],body:'阶段二·织网期：线开始交织、打结、成网。阶段三：地形随机性下降，曼德博之眼变异为节点，分形主义可能转向「收敛主义」。阶段四：线织成网后平面局部闭合，形成高维膜或收敛核。阶段五：层概念失效，漂移边界向九层、八层扩散，军团防护网络大面积失效，Lx 变成「高维窗口」稳定度，阵列体与纽曼娜线融合，巨构成为平面器官。阶段六·后平面/活体共识体：平面、建筑、生物、人类的界限消失，出现新物种、新主义。'},
/* ===== 社会 ===== */
{id:'soc-resident',cat:'society',cls:'当前社会情况',title:'人类居住地',sub:'城市 · 城邦 · 拾荒区 · 光照区',tags:['居住地','城市','光照区','缓冲区'],body:'固定城市、移动城市（8 个）、军团（13 个）、探索区、小型独立城邦、拾荒区（较安全的 89 个）、缓冲区、危险区（∞）、光照区（已建立安全区的 14 个，知道位置的 34 个）。固定城市由市长管理，小型城邦由锚议会、美术院共同管理，移动城市一般有军团元帅作为固定联系人。'},
{id:'soc-noble',cat:'society',cls:'当前社会情况',title:'光照贵族与光癖文化',sub:'L5 以上 · 恐暗症 · 日光妄想',tags:['光照贵族','恐暗症','人造光成瘾','光癖'],body:'在光照区（尤其 L5 以上）居住的权贵阶层，长期被自然光照射，心理耐受度更高，但会衍生严重的「恐暗症」和「日光妄想」。相对地，城市居民长期生活在人造光下，产生「人造光成瘾」，对极端锐利、反射光强的物件有狂热崇拜，形成新型「光癖文化」。'},
{id:'soc-memrent',cat:'society',cls:'当前社会情况',title:'记忆租赁',sub:'借来的记忆 · 异物',tags:['记忆租赁','黑市','身份认同','影像数据'],body:'由于影像坍缩和认知污染会重塑人的记忆，个人对身份的认知极度脆弱。黑市上出现「记忆租赁」——将探险者的影像数据租给居民，短暂体验他人记忆以缓解身份认同障碍。但借来的记忆可能混入因绯生物的「异物」，导致借阅者逐渐沦为「漂移行人」的预备役。'},
{id:'soc-frac',cat:'society',cls:'社会问题',title:'分形主义',sub:'与无限同在的狂喜',tags:['分形主义','认知污染','死亡率','收敛主义'],body:'部分探险者发现曼德博集合的无限嵌套结构能带来极致审美快感，进而分化出「分形主义」——故意吞食分形图像的认知污染，追求「与无限同在」的狂喜。死亡率极高，残骸往往变成「半分形半人」的混合物，成为新的深渊生物。'},
{id:'soc-blood',cat:'society',cls:'重大社会性事件',title:'血瞳疫事件',sub:'新型污染 · 视觉与认知传播',tags:['血瞳疫','权野商会','新型污染','解药'],body:'权野商会研究生物型抗污染装置时意外造出的新型污染，通过视觉和认知传播，与平面的灰英人有关。权野商会自行研究解药后大面积扩散污染，企图发横财。索塔纳感染严重，第九军团外圈被因绯生物集火；科研院、锚议会、第一军团介入，发现其直接在人身上实验、把不少人搞成了灰英人。解药研发成功，索塔纳恢复，但不能长时间用眼。'},
{id:'soc-dir',cat:'society',cls:'下一步目标',title:'三大方向共识',sub:'上行 · 下行 · 稳定',tags:['上行派','下行派','稳定派','共赢'],body:'人类阵营分上行派（军团、科研人员）、下行派（军团、探索区）、稳定派（军团、政党）。三个方向都有必要保持甚至进步，所有人都基于「我们不想这么早死」的理念，保持合作和共赢的关系。'},
/* ===== 政党/阵营/势力 ===== */
{id:'lg1',cat:'fgroup',cls:'军团',cls2:'第一军团',title:'第一军团 · 中枢要塞',sub:'散装基地 · 中枢 · 同行公约',tags:['0层','中枢','信息枢纽','斯诺里尔'],body:'驻扎于 0 层，最早出现的军团。范围大、面积极广，分散型驻扎，+1、0、−1 每个区域都有面积不小的要塞。人力最强，抗污染能力略差，因特殊驻扎方式成为几乎是信息中枢的存在。移动城市 23 个、固定城市 43 个、城邦 73 个、光照区 5 个、缓冲区 11 个。<b>元帅：[[p-sinuolier|斯诺里尔]]　安全员：[[p-suoyina|索依娜]]</b>'},
{id:'lg2',cat:'fgroup',cls:'军团',cls2:'第二军团',title:'第二军团 · 援渡回廊',sub:'回型要塞 · 增援 · 同行公约',tags:['-2层','武力最高','传送门','湮索纳比斯'],body:'驻扎于 −2 层，人类开始主动探索时出现的军团，<b>武力值最高</b>，经常派人援助其他负层。驻扎在连续回型巨构内部，内部设有数量庞大的传送门。光照区 2 个、固定城市 28 个、缓冲区 9 个。<b>元帅：湮索纳比斯　安全员：洛洛曼</b>'},
{id:'lg3',cat:'fgroup',cls:'军团',cls2:'第三军团',title:'第三军团 · 双探阶梯',sub:'阶梯要塞 · 探索 · 熵辉联盟',tags:['+3层','-7层','双探','罗厄斯'],body:'分两部分驻扎于 +3 和 −7 层，−7 部分主向下探索，+3 部分主收集/整理信息。借地表自然阶梯状巨构和墙体为墙体。固定城市 13 个、光照区 4 个（均未建立居住体系）、缓冲区 20 个。<b>元帅：罗厄斯　安全员：卡满娜</b>'},
{id:'lg4',cat:'fgroup',cls:'军团',cls2:'第四军团',title:'第四军团 · 存续之火',sub:'移动要塞 · 存活 · 独立阵营',tags:['移动','采集','种子样本','莫克'],body:'移动型要塞，没有准确驻扎地点，活动范围一般在 −6 层到 +3 层之间。走到哪里采集资源到哪里，有单独的科研、探索、经商团队，主要提供保命和探测装置。内部存有大量植物种子和生物样本。<b>元帅：莫克　安全员：乌拉兰斯</b>'},
{id:'lg5',cat:'fgroup',cls:'军团',cls2:'第五军团',title:'第五军团 · 秘守之城',sub:'城墙要塞 · 科研 · 独立阵营',tags:['-10层以下','隐秘','人均作战','西里斯'],body:'有驻扎地点但位置无法被探测，疑似在 −10 层以下。有两个光照区，军团和居民区混杂，内部成员人均有作战能力。偶尔和其他军团联系/救援。<b>元帅：[[p-xilisi|西里斯]]　安全员：[[p-eebaisi|厄尔拜斯]]</b>'},
{id:'lg6',cat:'fgroup',cls:'军团',cls2:'第六军团',title:'第六军团 · 许疗千层',sub:'复合要塞 · 治疗 · 独立领地',tags:['+4层','治疗','传送阵','绯千钰'],body:'位于 +4 层，巨大峡谷与水泥建筑间楼层错综复杂，到处都是传送阵和电梯。治疗条件更好，医药费也更贵，和第七军团有很深的合作。领地多为探索区、危险区、未开发光照区、拾荒区等资源丰富区域。<b>元帅：[[p-feiqianyu|绯千钰]]　安全员：于浅希</b>'},
{id:'lg7',cat:'fgroup',cls:'军团',cls2:'第七军团',title:'第七军团 · 转疗门扉',sub:'平面要塞 · 治疗 · 同行公约',tags:['-5层','传送门','异能者协会','清予'],body:'位于 −5 层，比较小的要塞，由异能者协会和大量小型城邦、移动城市组成。具有很强的转移能力，负责伤员救治和转运。驻扎在巨大平原中间，周边是数量庞多、形状诡异的石质门框，由空间异能者留下通往各处的传送门。固定城市 5 个、城邦 23 个、光照区 2 个、移动城市 7 个。<b>元帅：[[p-qingyu|清予]]　安全员：[[p-qingluan|清栾]]（双胞胎姐妹）</b>'},
{id:'lg8',cat:'fgroup',cls:'军团',cls2:'第八军团',title:'第八军团 · 迂复秘境',sub:'迷宫要塞 · 探索 · 熵辉联盟',tags:['-8层','世界树','精神保护网络','朋莱特'],body:'位于 −8 层，核心在仿佛迷宫般的巨大构造顶端的世界树上。军团与居民混杂，内部设有少量大型传送门方便危机时转移居民。有独立的精神保护网络，覆盖范围几乎整个迷宫。未开发光照区 2 个、城邦 12 个、固定城市 1 个、拾荒区 33 个、缓冲区 5 个。<b>元帅：朋莱特　安全员：埃诺</b>'},
{id:'lg9',cat:'fgroup',cls:'军团',cls2:'第九军团',title:'第九军团 · 临界塔桥',sub:'塔桥要塞 · 防御 · 同行公约',tags:['+9层','悬空','防御','思羽'],body:'驻扎于 +9 层的复合型要塞，几乎全部悬空。要塞正下方便是 +7 层最大的固定城市「罗婪」，以此为最高点，往下圆锥形范围包含 7 个固定城市、19 个探索区、光照区 3 个、城邦 45 个、拾荒区 10 个、缓冲区 4 个。<b>元帅：[[p-siyu|思羽]]　安全员：[[p-suotana|索塔纳]]</b>'},
{id:'lg10',cat:'fgroup',cls:'军团',cls2:'第十军团',title:'第十军团 · 行界重盘',sub:'移动要塞 · 机动防御 · 同行公约',tags:['+9层','履带','机动打击','婆罗莎'],body:'驻扎于 +9 层的移动型要塞，由巨大履带托起，拥有很强的机动打击、抗风险能力。和第九军团几乎同样的护卫范围，更注重 +8 和 +7 两层的防护。巡逻范围包括 14 个固定城市、43 个探索区、光照区 1 个、城邦 57 个、缓冲区 2 个。<b>元帅：[[p-boluosha|婆罗莎]]　安全员：[[p-yisuofa|伊索法]]</b>'},
{id:'lg11',cat:'fgroup',cls:'军团',cls2:'第十一军团',title:'第十一军团 · 集研链桥',sub:'悬空要塞 · 收集 · 熵辉联盟',tags:['+5层','悬浮石林','科研团队','鸢鸢絮御'],body:'位于 +5 层「悬浮石林」间，依靠当地特殊地理环境和物理情况建起的零碎堡垒，核心区在正中央的巨大悬浮石体上。负责收集、整合熵辉联盟带回的探索信息和样本，有独立且最优秀的科研团队，定期和第一军团进行信息整合与对比。固定城市 1 个、光照区 1 个、缓冲区 6 个、探索区 21 个、城邦 12 个。<b>元帅：鸢鸢絮御　安全员：爱比斐南</b>'},
{id:'lg12',cat:'fgroup',cls:'军团',cls2:'第十二军团',title:'第十二军团 · 连续砼体',sub:'砼体要塞 · 防御 · 独立领地',tags:['+3层','希美','黎簇亚斯','阿卡柏曼'],body:'独立于其他军团的地方势力，位于 +3 层「连续砼体」区域，附近是固定城市「希美」和「黎簇亚斯」。要塞背后是完全无光的危险区，曼德博集合的重发地。周围有移动城市 1 个、城邦 12 个、拾荒区 21 个、光照区 1 个、探索区 21 个。<b>元帅：阿卡柏曼　安全员：渊</b>'},
{id:'lg13',cat:'fgroup',cls:'军团',cls2:'第十三军团',title:'第十三军团 · 援探重堡',sub:'荆棘要塞 · 防御 · 熵辉联盟',tags:['-9层','深渊生物','中转站','南迩'],body:'位于 −9 层，在一堆高攻击性植物类深渊生物中建起的堡垒，有很多重型武器。自己向下探索的同时负责给熵辉联盟军团当中转站，内部设有很多传送门和轨道。固定城市 1 个、移动城市 12 个、未开发光照区 2 个、探索区 72 个。会尽力救援每一个在深渊求助的人。<b>元帅：南迩　安全员：莫达拉斯、菲尔菲娜</b>'},
{id:'f-anchor',cat:'fgroup',cls:'锚议会',title:'锚议会',sub:'校正人类共识',tags:['共识','历史','严谨','重罚'],body:'锚定人类共识、校正人类历史、反复检查人类文明记录，定期检查和校正人类群体的基本共识。内部规则极其严谨，处罚力度极大。小型城邦由锚议会、美术院共同管理。'},
{id:'f-memory',cat:'fgroup',cls:'记忆审查局',title:'记忆审查局',sub:'记忆租赁官方平台',tags:['记忆','租赁','归属权','保存'],body:'判断可售记忆归属权，管理记忆租赁的官方平台，保存记忆。与锚议会有比较深的合作。制度较为松散，处罚力度极大。'},
{id:'f-light',cat:'fgroup',cls:'光照与生态分配委员会',title:'光照与生态分配委员会',sub:'光照等级 · 区域管理分配',tags:['光照区','分配','多级确认','生态'],body:'多级确认制度，勉强算公平公正。负责接手光照区，也负责确认光照等级、区域管理和分配。'},
{id:'f-conv',cat:'fgroup',cls:'同行公约',title:'同行公约',sub:'只求人类存续',tags:['同行公约','存续','中立','互助'],body:'锚议会和熵辉联盟双方激烈互殴时期出现的阵营，不参与斗争，只求人类存续。成员：第一、二、七、九、十军团，共同维护人类生存领地，也负责探索和获取资源的工作。'},
{id:'f-entro',cat:'fgroup',cls:'熵辉联盟',title:'熵辉联盟',sub:'主探索 · 科研院领头',tags:['熵辉联盟','探索','科研院','未知'],body:'主探索，以科研院、军团领大头，异能者协会跟随行动为主，主要目的是探索未知。成员：第三、八、十一、十三军团，着重向上和向下的探索工作。'},
{id:'f-esp',cat:'fgroup',cls:'异能者协会',title:'异能者协会',sub:'民间异能者组织',tags:['异能者','民间','平面探索','小队'],body:'民间组织，主要由未加入军团的异能者组成，大部分人着重探索平面，少数和科研院有合作的会在深渊探索。以小队或个人活动为主，很少向上探索。也会根据情况接城市内部的任务。'},
{id:'f-sci',cat:'fgroup',cls:'科研院',title:'科研院',sub:'生物 · 物理 · 数学',tags:['科研','审查','探索','学者'],body:'都是科研人员，生物、物理、数学的人最多，少部分有异能的会自己出去探索，探索到的东西和带回来的东西必须经过严格审查。'},
{id:'f-artc',cat:'fgroup',cls:'艺术院',title:'艺术院',sub:'监测表达 · 宣传共识',tags:['艺术院','监测','宣传','锚议会'],body:'会监测每个人的表达，推断人类群体目前的状态，有告知锚议会的义务。得到指示后会主动宣传各种艺术作品，确认强调一些基本共识。'},
{id:'f-market',cat:'fgroup',cls:'商会',title:'商会与黑市',sub:'站中间吃两边',tags:['商会','黑市','贸易','拍卖'],body:'明面上负责各个城市之间的商贸，暗地里背着官方交易深渊生物、因绯生物以及价值很高但具危险性的物品。<b>银印商会</b>（普通商会，贸易网强大，主日常）、<b>普缘商会</b>（主交易因绯生物相关物品）、<b>残垣商会</b>（主交易深渊生物相关物品，最大拍卖会组织方）三足鼎立。'},
{id:'f-quanye',cat:'fgroup',cls:'商会',title:'权野商会',sub:'血瞳疫事件始作俑者',tags:['权野商会','违规实验','野心','血瞳疫'],body:'三大商会之外野心不小的独立商会。研究生物型抗污染装置时不慎造出血瞳疫新型污染，自行研究解药后大面积扩散企图发横财。话事人曾亲自到第九军团「谈合作」，后被多方介入清算。'},
{id:'f-org-merc',cat:'fgroup',cls:'组织',cls2:'雇佣兵',title:'雇佣兵组织',sub:'组织 · 雇佣兵',tags:['雇佣兵','组织','武装'],body:'承接各类委托的武装组织，游走于军团管辖之外的灰色地带。'},

{id:'p-siyu',cat:'person',cls:'军团',title:'思羽',sub:'第九军团元帅 · 24岁',tags:['数据系','能量系','小乌鸦','乐子人'],body:'<b>数据、能量双系异能</b>，能当主 C 能当辅助。黑发银瞳，经常扎低马尾，头发最长到腰间；身高 165，匀称体型，柔韧性很强，力速双 A，动态视力极好。黑发在强光下显蓝紫色，被同事称为「小乌鸦」。野外独自探索时被神秘老者（厄弥斯）拐到军团，算空降元帅，三年后靠能力站稳脚跟。工作时效率极高，效率一低立马炸毛；不工作时是火烧身上也觉得乐的乐子人。疾病：哮喘、腰椎旧伤、腱鞘炎、偏头疼。喜欢好看的人/物、面点、又甜又冰的东西、果咖、亮晶晶的东西；不喜欢过度宣泄情绪、被骗、不讲逻辑。'},
{id:'p-suotana',cat:'person',cls:'军团',title:'索塔纳',sub:'第九军团元帅副官 · 安全员 · 30岁',tags:['特殊系','监测','毒舌','记忆锚点'],body:'思羽的安全员，也是副官头头。黑发蓝瞳，银框眼镜配眼镜链，平常绾成发髻或低马尾；身高 174，体型偏清瘦。性格沉稳冷静毒舌，看得出思羽大部分时候在演戏所以看得比较严；一旦交付信任便付出所有，记忆力很好，索依娜带出来的得意门生。<b>异能：特殊系（监测控制为主，净化为辅）</b>——被动对情绪与细节极敏锐；监测为长效主动技；记忆锚点可标记情绪状态与关键记忆片段；稳定场展开约 10 米精神稳定区域；共鸣回响可投射平静情绪；情绪镜像可复制他人情绪状态；大招「群体同步」约 15 分钟。左侧很长的鬓发发尾打着卷，是思羽闲着没事卷的。'},
{id:'p-sinuolier',cat:'person',cls:'军团',title:'斯诺里尔',sub:'第一军团元帅 · 61岁',tags:['数据系','空间系','严肃长者','嘴毒'],body:'任职元帅 8 年，经典严肃长者，对看好的后辈爱操心。嘴很毒，说话经常戳人肺管子还有理有据无法反驳。和科研院的娅缪达 28 岁结婚，夫妻恩爱至今，无子孙。思羽称呼他「老登」。<b>异能：数据系、空间系（精度高范围广）</b>'},
{id:'p-suoyina',cat:'person',cls:'军团',title:'索依娜',sub:'第一军团安全员 · 39岁',tags:['特殊系','监测','严格','雷厉风行'],body:'斯诺里尔的安全员，<b>安全员体系最高的山</b>，带出了很多优秀安全员（索塔纳就是其中之一）。雷厉风行，嘴也很毒，偶尔喜欢呛斯诺里尔两句，对后辈很关照，是比较严格的类型。<b>异能：特殊系（监测为主，防御净化为辅）</b>'},
{id:'p-qingyu',cat:'person',cls:'军团',title:'清予',sub:'第七军团元帅 · 36岁',tags:['空间系','软刀子','温和','坚定'],body:'浅青色长发，待人谦逊有礼、温和近人，必要时会展现坚定、毫不退让的样子，知名的「软刀子」。是个酒蒙子，总偷吃三无零食（清栾语）。<b>异能：空间系（通道、转移）</b>'},
{id:'p-qingluan',cat:'person',cls:'军团',title:'清栾',sub:'第七军团安全员 · 36岁',tags:['特殊系','群体净化','温柔','清予之妹'],body:'清予的安全员，浅青色短发。待人平和有礼，情绪稳定，大部分时候冷淡，接触久了会发现其实很温柔、比较容易心软。双胞胎中的妹妹，比姐姐更高一些、气质更锋利。<b>异能：特殊系（群体净化）</b>'},
{id:'p-boluosha',cat:'person',cls:'军团',title:'婆罗莎',sub:'第十军团元帅 · 32岁',tags:['能量系','空间系','力量','热情'],body:'多次越级提拔上来的元帅，力量和抗打击能力数一数二，各方面能力都非常强，只是相比年长的元帅缺少经验和特殊系异能。为人善良热情、富有力量感，很自律，胆大心细，喜欢逗性格相似或内向的人。身高 187，深棕色长卷发。和思羽相差 8 岁，相处像欢喜冤家的姐妹；喜欢肢体接触，爱揉思羽的脑袋。不爱喝酒但酒量非常好。<b>异能：能量系、空间系（力大砖飞类型）</b>'},
{id:'p-yisuofa',cat:'person',cls:'军团',title:'伊索法',sub:'第十军团安全员 · 28岁',tags:['特殊系','内向','情商高','单向净化'],body:'婆罗莎的安全员。性格温和坚定，待人有礼谦逊，比较内向，平时不怎么爱说话，但会在合适的时候插话，情商很高。婆罗莎觉得副官需要到处对接不适合他，只安排不需要经常对接的工作。<b>异能：特殊系（单向净化和控制）</b>'},
{id:'p-emisi',cat:'person',cls:'其他',title:'厄弥斯',sub:'神秘老者 · 定天之眼',tags:['特殊系','鉴定','捡人','神秘'],body:'到处捡人的神秘老者，性格跳脱，总给人一种是干诈骗的感觉。情商很高，比较悲观，又因异能的特殊性相信人定胜天，乐观和悲观同时存在。情感非常细腻。头发金银混杂，看起来很梦幻。先后捡回思羽、绯千钰，本意把思羽扔给斯诺里尔培养。<b>异能：特殊系（定天之眼）（鉴定类，可直接看见个人拥有的品质、潜力、能力，且绝不会出错）</b>'},
{id:'p-xilisi',cat:'person',cls:'军团',title:'西里斯',sub:'第五军团元帅 · 58岁',tags:['数据系','极强','严肃','俊美'],body:'和斯诺里尔一个类型的严肃长辈，眉眼俊美，年轻时是女生男相的典型代表，不管什么时期都好看到让人迷糊的程度（思羽真的很喜欢她）。会操心小辈但摆在明面上，严慈并济，带出来很多优秀的数据系异能者。说一不二、想法表现在行动里，大部分时候严厉，偶尔温和。她的数据系非常强大敏感，在 −10 层就能知道其他层的事情，到 −5 层以上已知信息量极大，很容易破坏自我锚定层。<b>异能：数据系（极强）</b>'},
{id:'p-eebaisi',cat:'person',cls:'军团',title:'厄尔拜斯',sub:'第五军团安全员 · 32岁',tags:['治疗系','沉默','影子','可靠'],body:'西里斯的安全员，像沉默的影子，不爱说话，干什么都悄无声息的，非常靠谱，判断力很强。<b>异能：治疗系（单体很强，附带净化）</b>'},
{id:'p-aideer',cat:'person',cls:'军团',title:'阿黛尔·辉',sub:'第九军团前任元帅 · 因公殉职',tags:['数据系','纵贯线','阵列体同化','责任心'],body:'黑发，白蓝紫渐变色眼睛。第九军团前任元帅，任职 7 年，在纵贯线研究进行到末尾时死于阵列体同化（思羽折跃事件后翻案调查才发现真相），两分钟同化期间无求援。很有责任心和远见，细心细致，偶尔容易想过头多疑。她的数据里藏着一个死人的眼睛——思羽反向追踪时发现自己的异能参数里被她埋了一个留存时间极长的节点。<b>异能：数据系（系统建模和调度）</b>'},
/* ===== 美术与文化 ===== */
{id:'art-glass',cat:'art',cls:'人文美术',title:'琉璃水晶画',sub:'越暗越闪 · 越亮越清透',tags:['琉璃','水晶','昂贵','艺术'],body:'极其昂贵的玻璃雕刻和晶石镶嵌艺术，在灰暗中折射出微小的七彩光芒，越暗越闪，越亮越清透鲜艳。'},
{id:'art-fractal',cat:'art',cls:'禁忌艺术',title:'分形艺术',sub:'无限嵌套 · 头晕目眩',tags:['分形','曼德博','禁忌','认知污染'],body:'一部分艺术家沉迷于将无限嵌套的分形图案作为艺术语言。这种画作极其危险，看着看着就会让人头晕目眩，甚至引发认知污染。官方通常将其列为禁忌艺术，但在黑市和权力、商人的圈层里极其火爆。'},
{id:'art-light',cat:'art',cls:'设计',title:'人造光与室内设计',sub:'单向透视落地窗',tags:['人造光','设计','落地窗','痴迷'],body:'画作着重表现「光」的概念，设计师对人造光无比痴迷，也就有了对人造光的极致开发。设计师们非常注重室内设计，住房一般都是单向透视的巨大落地窗。'},
{id:'art-tiny',cat:'art',cls:'常见艺术',title:'微小之物 · 文创',sub:'可控的安慰',tags:['文创','小饰品','微小','心理'],body:'面对宏观的恐惧，普通人本能地喜欢微小可控的东西，因此小装饰、小饰品、文创等物件深受群众喜欢，城市内有很多类似的店铺。'},
{id:'art-consensus',cat:'art',cls:'常见艺术',title:'毁灭迷恋与生命呐喊',sub:'绝境中的证据',tags:['毁灭','巨构','深渊','生命'],body:'既有对毁灭的迷恋（深渊、分形、巨构），也包含了在绝境中试图留下证据的微弱呐喊，更能从中窥见人类顽强的生命。'}

function logAction(a,d){state.actionLog.push({time:Date.now(),action:a,detail:String(d||'').slice(0,60)});if(state.actionLog.length>200)state.actionLog.shift()}
let undoStack=[],undoInProgress=false;
function cloneForUndo(){const c=deepCopy(state);c.bioImages=[];c.bgImage=null;if(Array.isArray(c.characters))c.characters.forEach(ch=>{if(ch)ch.photo=null});if(Array.isArray(c.gallery))c.gallery.forEach(g=>{if(g){g.src='';g.size=0}});return c}
function pushUndo(){if(undoInProgress)return;try{const snap=JSON.stringify(cloneForUndo());if(undoStack.length&&undoStack[undoStack.length-1]===snap)return;undoStack.push(snap);if(undoStack.length>40)undoStack.shift()}catch(e){}}
function doUndo(){if(!undoStack.length){toast('没有可撤销的操作');return}undoInProgress=true;try{const prevState=state;state=JSON.parse(undoStack.pop());state.bioImages=prevState.bioImages;state.bgImage=prevState.bgImage;if(Array.isArray(state.characters))state.characters.forEach(ch=>{const o=(prevState.characters||[]).find(x=>x&&x.id===ch.id);if(o)ch.photo=o.photo});if(Array.isArray(state.gallery))state.gallery.forEach(g=>{const o=(prevState.gallery||[]).find(x=>x&&x.id===g.id);if(o){g.src=o.src;g.size=o.size}});applyTheme();applyLabels();applyBg();renderView();applyPanelSettings();logAction('撤销','回到上一步');save();toast('已撤销上一步')}catch(e){toast('撤销失败')}undoInProgress=false}

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function attr(v){return escapeHtml(String(v==null?'':v))}
function escapeRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function debounce(fn,w){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),w)}}
let toastTimer=null;
function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function allArchive(){return ARCHIVE.concat(state.userEntries||[])}
function getEntry(id){const base=allArchive().find(e=>e.id===id);if(!base)return null;const ed=state.archiveEdit[id];return ed?Object.assign({},base,ed):base}
function renderText(t){if(!t)return '';let out=escapeHtml(t);out=out.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,id,label)=>{const target=getEntry(id);const text=label||(target?target.title:id);return '<a class="xref" data-goto="'+escapeHtml(id)+'">'+text+'</a>'});return out}
function hexToRgb(hex){let h=String(hex||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mixColor(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A.r+(B.r-A.r)*t,A.g+(B.g-A.g)*t,A.b+(B.b-A.b)*t)}
function countWords(s){return String(s||'').replace(/\s/g,'').length}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getLabel(key){const cats=state.wbCategories||[];const cat=cats.find(c=>c.key===key);return (cat&&cat.label)||(state.labels&&state.labels[key])||key}
function getCategory(key){return (state.wbCategories||[]).find(c=>c.key===key)}
function paneW(k){const v=(state.paneW||{})[k];return (typeof v==='number'&&!isNaN(v))?v:(PANE_DEF[k]?PANE_DEF[k].def:260)}

/* ============ 主血线 ============ */
let bloodRAF=null;
function initBloodLines(){
  if(bloodRAF){cancelAnimationFrame(bloodRAF);bloodRAF=null}
  const svg=$('#bloodLinesSvg');if(!svg)return;svg.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  const left=[[38,46],[92,80],[148,156],[20,14],[198,190],[288,296],[62,70]];
  const right=[[1882,1876],[1828,1840],[1772,1766],[1900,1906],[1722,1730],[1632,1628],[1858,1850]];
  const all=[...left,...right];
  const baseRGB=hexToRgb(state.blBlood);
  const paths=[];
  all.forEach(a=>{
    const [x1,x2]=a;const p=document.createElementNS(NS,'path');
    const cx1=x1+(Math.random()-.5)*220;const cx2=x2+(Math.random()-.5)*220;
    p.setAttribute('d',`M${x1},-40 C${cx1},380 ${cx2},760 ${x2},1120`);
    p.setAttribute('class','bl');p.setAttribute('stroke-width',(0.8+Math.random()*2.2).toFixed(2));
    const shift=(Math.random()-.5)*0.35;
    const r=Math.min(255,Math.max(0,baseRGB.r*(1+shift)));
    const g=Math.min(255,Math.max(0,baseRGB.g*(1+shift)));
    const b=Math.min(255,Math.max(0,baseRGB.b*(1+shift)));
    p.setAttribute('stroke',`rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`);
    p.style.animationDuration=(state.blPeriod*(0.85+Math.random()*0.5)).toFixed(1)+'s';
    p.style.animationDelay=(-Math.random()*10).toFixed(1)+'s';
    svg.appendChild(p);paths.push(p);
  });
  const S=28;
  paths.forEach(p=>{try{const len=p.getTotalLength();const pts=[];for(let i=0;i<=S;i++){const pt=p.getPointAtLength(len*i/S);pts.push({x:pt.x,y:pt.y})}p._basePts=pts}catch(e){p._basePts=null}p._phase=Math.random()*Math.PI*2;p._period=80+Math.random()*90;p._amp=18+Math.random()*34});
  const t0=performance.now();let last=0;
  function tick(now){bloodRAF=requestAnimationFrame(tick);if(!svg.isConnected){bloodRAF=null;return}if(now-last<50)return;last=now;const t=(now-t0)/1000;for(const p of paths){if(!p._basePts)continue;const pts=p._basePts,phase=p._phase,omega=Math.PI*2/p._period,amp=p._amp,spatial=Math.PI/pts.length;let d='';for(let i=0;i<pts.length;i++){const pt=pts[i];const w=Math.sin(t*omega+phase+i*spatial)*amp+Math.sin(t*omega*0.4+phase*1.3)*amp*0.45+Math.cos(t*omega*0.7+phase*0.8)*amp*0.25;d+=(i===0?'M ':'L ')+(pt.x+w).toFixed(1)+' '+pt.y.toFixed(1)+' '}p.setAttribute('d',d)}}
  bloodRAF=requestAnimationFrame(tick);
}

function route(){
  const hash=location.hash||'#/studio';
  const key=hash.slice(2).split('/')[0];
  $$('#mainnav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===key));
  const view=$('#view');view.classList.remove('lock');

    if(hash.startsWith('#/data')){renderDataView();return}

}

let hoverTipEl=null;let hoverTipTimer=null;let lastMouseX=0,lastMouseY=0;
document.addEventListener('mousemove',e=>{lastMouseX=e.clientX;lastMouseY=e.clientY;if(hoverTipEl)positionTip(e.clientX,e.clientY)});
function positionTip(mx,my){
  if(!hoverTipEl)return;
  const tw=hoverTipEl.offsetWidth,th=hoverTipEl.offsetHeight;
  let left=mx+22,top=my+22;
  if(left+tw>window.innerWidth-10)left=mx-tw-22;
  if(top+th>window.innerHeight-10)top=my-th-22;
  if(left<10)left=10;if(top<10)top=10;
  hoverTipEl.style.left=left+'px';hoverTipEl.style.top=top+'px';
}
function hideHoverTip(){if(hoverTipTimer)clearTimeout(hoverTipTimer);if(hoverTipEl){hoverTipEl.remove();hoverTipEl=null}}
function showEntryHoverTip(anchor,entryId){
  hideHoverTip();
  const entry=getEntry(entryId);if(!entry)return;
  let body=entry.body||'';
  body=body.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,id,label)=>label||(getEntry(id)||{}).title||id);
  const tip=document.createElement('div');tip.className='hover-tip';
  tip.innerHTML=`<h4>${escapeHtml(entry.title)}</h4>${entry.sub?`<div class="sub">${escapeHtml(entry.sub)}</div>`:''}<div class="tip-body">${renderText(body)}</div>`;
  document.body.appendChild(tip);hoverTipEl=tip;
  positionTip(lastMouseX,lastMouseY);
}

function renderArchiveNav(){
  const nav=$('#arNav');if(!nav)return;let html='';
  CATS.forEach(c=>{const items=ARCHIVE.filter(e=>e.cat===c.id).concat((state.userEntries||[]).filter(e=>e.cat===c.id));const vis=filterArchive(items);if(archiveQuery&&!vis.length)return;html+=`<div class="sb-item" data-goto-cat="${attr(c.id)}"><span class="nm">${c.name}</span><span class="badge">${vis.length}</span></div>`});

function filterArchive(items){if(!archiveQuery)return items;const q=archiveQuery.toLowerCase();return items.filter(e=>(e.title+(e.sub||'')+(e.body||'')+(e.tags||[]).join(' ')).toLowerCase().includes(q))}
function renderArchiveBody(){
  const body=$('#arBody');if(!body)return;let html='';
  CATS.forEach(c=>{
    const base=ARCHIVE.filter(e=>e.cat===c.id);const usr=(state.userEntries||[]).filter(e=>e.cat===c.id);const all=filterArchive(base.concat(usr));
    if(archiveQuery&&!all.length)return;

    el.addEventListener('dragend',()=>{

      clearCatDropMarks();

    });

      if(dragArts){

    el.addEventListener('contextmenu',e=>{

        {act:'ren',label:'重命名',fn:()=>renameArticle(id)},

        {act:'del',label:'删除'+(selArts.size>1?'（已选 '+selArts.size+' 篇）':''),danger:true,fn:()=>{if(!selArts.has(id))toggleSel(id);deleteSelected();}}

function applyBlank(t){t=String(t).replace(/\r\n/g,'\n');const ls=t.split('\n').map(l=>l.trimEnd());const out=[];for(let i=0;i<ls.length;i++){out.push(ls[i]);if(ls[i].trim()&&i<ls.length-1){const n=ls[i+1];if(n.trim()&&!/^\s*$/.test(n))out.push('')}}return out.join('\n').replace(/\n{3,}/g,'\n\n')}

function s2tw(t){return String(t).split('').map(c=>S2T[c]||c).join('')}

function catChildren(parentKey){return (state.wbCategories||[]).filter(c=>c.parent===parentKey)}
function catRoots(){const cats=(state.wbCategories||[]).filter(c=>!c.parent);return cats.slice().sort((a,b)=>((a.group==='setting'?0:1)-(b.group==='setting'?0:1)))}
function catRoot(c){let p=c,guard=0;while(p&&p.parent&&guard<50){const q=getCategory(p.parent);if(!q)break;p=q;guard++}return p||c}
function catDepth(c){let d=0,p=c,guard=0;while(p&&p.parent&&guard<50){const q=getCategory(p.parent);if(!q)break;d++;p=q;guard++}return d}
function isDescendant(ancestorKey,key){let c=getCategory(key),guard=0;while(c&&c.parent&&guard<50){if(c.parent===ancestorKey)return true;c=getCategory(c.parent);guard++}return false}
function subtreeKeys(key){const out=[key];const walk=k=>{catChildren(k).forEach(c=>{out.push(c.key);walk(c.key)})};walk(key);return out}
function flattenTree(){const out=[];const walk=(p,d)=>{catChildren(p).forEach(c=>{out.push({c,depth:d});walk(c.key,d+1)})};catRoots().forEach(r=>{out.push({c:r,depth:0});walk(r.key,1)});return out}

    s.wbCategories.forEach(c=>{if(!c||typeof c!=='object')return;if(!c.key)c.key='custom_'+Math.random().toString(36).slice(2,8);if(c.parent&&!keys.has(c.parent))c.parent=null;if(!c.parent&&!c.group)c.group='article'});

    s.wbCategories.forEach(c=>{if(!c||!c.parent)return;let p=c,guard=0;const lim=s.wbCategories.length+1;while(p&&p.parent&&guard<lim){if(p.parent===c.key){c.parent=null;break}p=byKey[p.parent];guard++}});

  const cats=state.wbCategories;
  const src=getCategory(srcKey),tgt=getCategory(targetKey);
  if(!src||!tgt||srcKey===targetKey)return;
  if(isDescendant(srcKey,targetKey)){toast('不能移动到它自己的子分类下');return;}
  pushUndo();
  const fi=cats.findIndex(c=>c.key===srcKey);
  const [item]=cats.splice(fi,1);
  if(mode==='into'){
    item.parent=targetKey;
    const ti=cats.findIndex(c=>c.key===targetKey);
    cats.splice(ti+1,0,item);
    state.collapsed['wbcat:'+targetKey]=false;
  }else{
    item.parent=tgt.parent||null;
    if(!item.parent)item.group=tgt.group||item.group||'article';
    let ti=cats.findIndex(c=>c.key===targetKey);
    if(mode==='after')ti+=1;
    cats.splice(ti,0,item);
  }
  save();renderWriteList();
  toast(mode==='into'?('已设为「'+getLabel(targetKey)+'」的子分类'):'已重新排序');
}
function moveArticles(ids,targetKey,beforeId){
  const tw=state.writing[targetKey];
  if(!tw){toast('目标分类不存在');return;}
  const uniq=[...new Set(ids)];
  pushUndo();
  const moving=[];
  uniq.forEach(id=>{
    const i=id.indexOf('|');const k=id.slice(0,i),aid=id.slice(i+1);
    const w=state.writing[k];if(!w||!Array.isArray(w.articles))return;
    const j=w.articles.findIndex(a=>a.id===aid);if(j<0)return;
    moving.push(w.articles[j]);
    w.articles.splice(j,1);
    if(w.activeId===aid)w.activeId=(w.articles[0]||{}).id||null;
  });
  if(!moving.length){toast('没有可移动的文章');return;}
  let idx=beforeId?tw.articles.findIndex(a=>a.id===beforeId):-1;
  if(idx<0)idx=tw.articles.length;
  moving.forEach((m,i)=>tw.articles.splice(idx+i,0,m));
  selArts.clear();
  state.collapsed['wbcat:'+targetKey]=false;
  save();renderWriteList();renderEditor();updateSelBar();
  logAction('移动文章',moving.length+' 篇 → '+getLabel(targetKey));
  toast('已移动 '+moving.length+' 篇文章到「'+getLabel(targetKey)+'」');
}
