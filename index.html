/* ---------- 文档导入与自动匹配 ---------- */
function pickDocFiles(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.txt,.md,.markdown,.json,.docx,.text,.log';
  inp.multiple=true;
  inp.onchange=async()=>{
    const files=Array.from(inp.files||[]);
    if(!files.length)return;
    toast('正在解析 '+files.length+' 个文档…');
    const results=[];
    for(const f of files){
      try{
        const arts=await parseDocFile(f);
        arts.forEach(a=>{
          const m=matchCategory(a.body,a.title);
          results.push({title:a.title,body:a.body,target:m?m.key:null});
        });
      }catch(err){console.warn('parse fail',f.name,err);toast('无法解析：'+f.name+'（跳过）');}
    }
    if(!results.length){toast('未解析到可导入的内容');return;}
    openImportDialog(results);
  };
  inp.click();
}
async function parseDocFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='docx')return parseDocx(f);
  const text=await f.text();
  if(ext==='json'){
    const o=JSON.parse(text);
    const arr=Array.isArray(o)?o:(o.articles||o.data||[]);
    return arr.map(x=>({title:String(x.title||f.name),body:String(x.body||x.content||'')})).filter(x=>x.body);
  }
  return splitTextToArticles(text,f.name.replace(/\.[^.]+$/,''));
}
function sliceByHeaders(text,matches){
  const parts=[];
  for(let i=0;i<matches.length;i++){
    const start=matches[i].idx+matches[i].len;
    const end=i+1<matches.length?matches[i+1].idx:text.length;
    parts.push({title:matches[i].title,body:text.slice(start,end)});
  }
  if(matches[0].idx>0)parts.unshift({title:null,body:text.slice(0,matches[0].idx)});
  return parts;
}
function splitTextToArticles(text,fname){
  text=String(text||'').replace(/\r\n?/g,'\n').replace(/^\uFEFF/,'');
  const base=fname||'未命名';
  let parts=[];
  const md=[];let m;
  const reMd=/^#{1,6}\s+(.+)$/gm;
  while((m=reMd.exec(text)))md.push({idx:m.index,title:m[1].trim(),len:m[0].length});
  if(md.length){parts=sliceByHeaders(text,md);}
  else{
    const ch=[];
    const reCh=/^(第[0-9０-９一二三四五六七八九十百千零两]+[章回节卷部篇][^\n]{0,40})$/gm;
    while((m=reCh.exec(text)))ch.push({idx:m.index,title:m[1].trim(),len:m[0].length});
    if(ch.length){parts=sliceByHeaders(text,ch);}
  }
  if(!parts.length){
    if(text.length>12000){
      const chunks=text.split(/\n{2,}/);let cur='';
      chunks.forEach(c=>{
        if((cur+c).length>9000&&cur){parts.push({title:null,body:cur});cur=c+'\n\n';}
        else cur+=c+'\n\n';
      });
      if(cur.trim())parts.push({title:null,body:cur});
    }else{
      parts=[{title:base,body:text}];
    }
  }
  parts=parts.filter(p=>p.body&&p.body.trim());
  return parts.map((p,i)=>({title:(p.title||'').trim()||(parts.length>1?base+' · 第'+(i+1)+'部分':base),body:p.body.trim()}));
}
async function parseDocx(f){
  const buf=new Uint8Array(await f.arrayBuffer());
  const view=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  let eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65558);i--){
    if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){eocd=i;break;}
  }
  if(eocd<0)throw new Error('not a zip');
  const count=view.getUint16(eocd+10,true);
  let off=view.getUint32(eocd+16,true);
  let entry=null;
  const dec=new TextDecoder();
  for(let i=0;i<count;i++){
    if(view.getUint32(off,true)!==0x02014b50)break;
    const method=view.getUint16(off+10,true);
    const csize=view.getUint32(off+20,true);
    const nlen=view.getUint16(off+28,true);
    const elen=view.getUint16(off+30,true);
    const clen=view.getUint16(off+32,true);
    const name=dec.decode(buf.subarray(off+46,off+46+nlen));
    const lhOff=view.getUint32(off+42,true);
    if(name==='word/document.xml'){entry={method,csize,lhOff};break;}
    off+=46+nlen+elen+clen;
  }
  if(!entry)throw new Error('word/document.xml not found');
  if(view.getUint32(entry.lhOff,true)!==0x04034b50)throw new Error('bad local header');
  const nl=view.getUint16(entry.lhOff+26,true);
  const el=view.getUint16(entry.lhOff+28,true);
  const dataStart=entry.lhOff+30+nl+el;
  const raw=buf.subarray(dataStart,dataStart+entry.csize);
  let xmlBytes;
  if(entry.method===8){
    if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持 docx 解压');
    const ds=new DecompressionStream('deflate-raw');
    xmlBytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
  }else if(entry.method===0){xmlBytes=raw;}
  else throw new Error('unsupported compression '+entry.method);
  let xml=dec.decode(xmlBytes);
  xml=xml.replace(/<w:tab\b[^>]*\/?>/g,'\t').replace(/<w:br\b[^>]*\/?>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  return splitTextToArticles(xml,f.name.replace(/\.docx$/i,''));
}
function matchCategory(body,title){
  const src=(String(title||'')+'\n'+String(body||'')).toLowerCase();
  let best=null,bs=0;
  (state.wbCategories||[]).forEach(c=>{
    const kws=new Set();
    String(c.label||'').split(/[\s·、，,．.「」『』()（）\/]+/).forEach(w=>{w=w.trim().toLowerCase();if(w.length>=2)kws.add(w)});
    (c.tags||[]).forEach(t=>{const w=String(t).toLowerCase();if(w.length>=2)kws.add(w)});
    const w=state.writing[c.key];
    if(w&&Array.isArray(w.articles))w.articles.slice(0,30).forEach(a=>{const t=String(a.title||'').trim().toLowerCase();if(t.length>=2&&t.length<=14)kws.add(t)});
    let s=0;
    kws.forEach(k=>{let i=0,cnt=0;while(cnt<30){i=src.indexOf(k,i);if(i<0)break;cnt++;i+=k.length;}s+=cnt*k.length*2;});
    if(s>bs){bs=s;best=c;}
  });
  if(best)return{key:best.key,score:bs};
  const r=catRoots();
  return r.length?{key:r[0].key,score:0}:null;
}
function openImportDialog(items){
  importBuffer=items;
  const opts=(sel)=>flattenTree().map(({c,depth})=>`<option value="${attr(c.key)}"${c.key===sel?' selected':''}>${'　'.repeat(depth)}${escapeHtml(getLabel(c.key))}</option>`).join('');
  const rows=items.map((it,i)=>`<div class="import-row"><span class="n">${i+1}</span><div class="t"><input type="text" data-imp-t="${attr(i)}" value="${escapeHtml(it.title||('导入 '+(i+1)))}"></div><select data-imp-c="${attr(i)}">${opts(it.target)}</select><span class="n">${countWords(it.body)}字</span></div>`).join('');

  $('#modal-root').innerHTML=html;

  $('#impConfirm').addEventListener('click',()=>{

      if(cEl)it.target=cEl.value;
    });
    pushUndo();
    let n=0;
    items.forEach(it=>{
      const w=state.writing[it.target];
      if(!w)return;
      w.articles.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,6),title:(it.title||'').trim(),body:it.body,updatedAt:Date.now()});
      state.collapsed['wbcat:'+it.target]=false;
      n++;
    });
    logAction('导入文档',n+' 篇');
    save();
    $('#modal-root').innerHTML='';
    importBuffer=null;
    renderWriteList();
    updateSelBar();
    toast('已导入 '+n+' 篇文章');
  });
}

      if(!ev) return;
      showEvHoverTip(ev);
    });
    it.addEventListener('mouseleave',hideHoverTip);
  });
}
function showEvHoverTip(ev){
  hideHoverTip();
  const tip=document.createElement('div');
  tip.className='hover-tip'; tip.style.maxWidth='340px';
  tip.innerHTML=`<h4>${escapeHtml(ev.title)}</h4><div class="sub">${escapeHtml(ev.kind)} · ${escapeHtml(ev.time)}</div><div class="tip-body">${escapeHtml(ev.body)}</div>`;
  document.body.appendChild(tip); hoverTipEl=tip;
  positionTip(lastMouseX,lastMouseY);
}

function renderTimeline(){
  const canvas=$('#tlCanvas');
  const nodesLayer=$('#tlNodes');
  const svg=$('#tlLinksSvg');
  if(!canvas||!nodesLayer||!svg) return;

  const stage=$('#tlStage');
  const stageW = stage ? stage.clientWidth : 1400;
  const stageH = stage ? stage.clientHeight : 800;

  let maxX = 0;
  state.timeline.forEach(n=>{
    maxX = Math.max(maxX, (typeof n.x==='number'?n.x:0) + 200);
  });
  const contentW = Math.max(stageW, maxX, TL_PAD*2 + Math.max(0,state.timeline.length-1)*TL_NODE_W);
  canvas.style.width = contentW+'px';
  canvas.style.height = stageH+'px';

  const emptyEl=$('#tlEmpty');
  if(state.timeline.length===0){
    nodesLayer.innerHTML='';
    svg.innerHTML='';
    if(!emptyEl){
      const e=document.createElement('div');
      e.className='tl-empty'; e.id='tlEmpty';
      e.innerHTML='<b>时间线为空</b><span>从左侧拖动事件到此处，或右键画布新建节点</span>';
      canvas.appendChild(e);
    }
    return;
  }
  if(emptyEl) emptyEl.remove();

  const centerY = stageH/2;
  const subTotal = state.timeline.filter(n=>n.line==='sub').length;
  let subIdx=0;

  let html='';
  state.timeline.forEach((n,i)=>{
    let color;
    if(n.line==='main') color=state.tlMain;
    else { color=subColorFor(subIdx, Math.max(subTotal-1,1)); subIdx++; }

    let x = typeof n.x==='number' ? n.x : (TL_PAD + i*TL_NODE_W);
    let y = centerY + (Number(n.dy)||0);
    if(typeof n.x!=='number'){ n.x = x; }

    const num = String(i+1).padStart(2,'0');
    const sel = ctrlSel.includes(n.id) ? ' ctrl-sel' : '';

    html += `<div class="tl-node${sel}" data-tl="${attr(n.id)}" style="left:${x}px;top:${y}px;--node-color:${color}">
      <div class="date">${escapeHtml(n.date||'')}</div>
      <div class="title">${escapeHtml(n.title||'')}</div>
      <div class="dot"></div>
      <div class="num">#${num}</div>
      <div class="tag">${n.line==='main'?'主线':'支线'}</div>
    </div>`;
  });
  nodesLayer.innerHTML=html;

  drawLinks();
  bindNodeEvents();
}

function tlCenters(){
  const canvas=$('#tlCanvas');
  if(!canvas) return {};
  const h = canvas.offsetHeight || 800;
  const centerY = h/2;
  const map={};
  state.timeline.forEach((n,i)=>{
    let x = typeof n.x==='number' ? n.x : (TL_PAD + i*TL_NODE_W);
    let y = centerY + (Number(n.dy)||0);
    map[n.id] = { x, y };
  });
  return map;
}

function drawLinks(){
  const svg=$('#tlLinksSvg');
  const canvas=$('#tlCanvas');
  if(!svg||!canvas) return;

  const w = canvas.offsetWidth || 1600;
  const h = canvas.offsetHeight || 800;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.style.width = w+'px';
  svg.style.height = h+'px';

  const centers = tlCenters();
  const parts=[];

  state.timeline.forEach(n=>{
    (n.links||[]).forEach(lid=>{
      const c1=centers[n.id], c2=centers[lid];
      if(!c1||!c2) return;
      const key = n.id+'-'+lid;
      const curve=(n.linkCurves||{})[lid];
      let d;
      if(curve && typeof curve.cx==='number'){
        d = `M ${c1.x.toFixed(1)} ${c1.y.toFixed(1)} Q ${curve.cx.toFixed(1)} ${curve.cy.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}`;
      } else {
        const mx=(c1.x+c2.x)/2;
        const bow = Math.max(28, Math.min(120, Math.abs(c2.x-c1.x)*0.18));
        const my=(c1.y+c2.y)/2 - bow;
        d = `M ${c1.x.toFixed(1)} ${c1.y.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}`;
      }
      const isSel = selectedLinks.includes(key);
      parts.push(`<path d="${d}" class="tl-link-hit" data-from="${attr(n.id)}" data-to="${attr(lid)}"></path>`);
      parts.push(`<path d="${d}" class="tl-link-visual${isSel?' selected':''}" data-from="${attr(n.id)}" data-to="${attr(lid)}"></path>`);
    });
  });

  svg.innerHTML=parts.join('');
  bindLinkEvents();
}

function updateLinksForNode(nodeId, newX, newY) {
  const svg = $('#tlLinksSvg');
  if (!svg) return;
  const centers = tlCenters();
  centers[nodeId] = { x: newX, y: newY };

  state.timeline.forEach(n => {
    (n.links || []).forEach(lid => {
      if (n.id === nodeId || lid === nodeId) {
        const c1 = centers[n.id], c2 = centers[lid];
        if (!c1 || !c2) return;
        const curve = (n.linkCurves || {})[lid];
        let d;
        if (curve && typeof curve.cx === 'number') {
          d = `M ${c1.x.toFixed(1)} ${c1.y.toFixed(1)} Q ${curve.cx.toFixed(1)} ${curve.cy.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}`;
        } else {
          const mx = (c1.x + c2.x) / 2;
          const bow = Math.max(28, Math.min(120, Math.abs(c2.x - c1.x) * 0.18));
          const my = (c1.y + c2.y) / 2 - bow;
          d = `M ${c1.x.toFixed(1)} ${c1.y.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}`;
        }
        const hitPath = svg.querySelector(`.tl-link-hit[data-from="${attr(n.id)}"][data-to="${attr(lid)}"]`);
        const visualPath = svg.querySelector(`.tl-link-visual[data-from="${attr(n.id)}"][data-to="${attr(lid)}"]`);
        if (hitPath) hitPath.setAttribute('d', d);
        if (visualPath) visualPath.setAttribute('d', d);
      }
    });
  });
}

function refreshLinkSelection(){
  $$('#tlLinksSvg .tl-link-visual').forEach(p=>{
    const k = p.dataset.from+'-'+p.dataset.to;
    p.classList.toggle('selected', selectedLinks.includes(k));
  });
}

function bindLinkEvents(){
  $$('#tlLinksSvg .tl-link-hit').forEach(hit=>{
    const fromId=hit.dataset.from, toId=hit.dataset.to;
    const key = fromId+'-'+toId;

    hit.addEventListener('contextmenu', e=>{
      e.preventDefault(); e.stopPropagation();
      if(!selectedLinks.includes(key)){
        selectedLinks=[key];
        refreshLinkSelection();
      }
      showLinkCtxMenu(e.clientX, e.clientY, fromId, toId);
    });

    hit.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      e.preventDefault(); e.stopPropagation();

      const multi = e.ctrlKey || e.metaKey;
      if(multi){
        const i = selectedLinks.indexOf(key);
        if(i>=0) selectedLinks.splice(i,1);
        else selectedLinks.push(key);
        refreshLinkSelection();
        if(!selectedLinks.includes(key)) return;
      } else {
        if(selectedLinks.includes(key)){
          selectedLinks = selectedLinks.filter(k=>k!==key);
          refreshLinkSelection();
          return;
        } else {
          selectedLinks = [key];
          refreshLinkSelection();
        }
      }
      startLinkCurveDrag(hit, fromId, toId, e);
    });
  });
}

function startLinkCurveDrag(hitEl, fromId, toId, e){
  const n = state.timeline.find(x=>x.id===fromId);
  if(!n) return;
  if(!n.linkCurves) n.linkCurves={};

  const centers = tlCenters();
  const c1=centers[fromId], c2=centers[toId];
  if(!c1||!c2) return;

  const svg = $('#tlLinksSvg');
  const visualEl = svg.querySelector(`.tl-link-visual[data-from="${fromId}"][data-to="${toId}"]`);

  const cur = n.linkCurves[toId];
  const defBow = Math.max(28, Math.min(120, Math.abs(c2.x-c1.x)*0.18));
  const cx0 = (cur && typeof cur.cx==='number') ? cur.cx : (c1.x+c2.x)/2;
  const cy0 = (cur && typeof cur.cy==='number') ? cur.cy : (c1.y+c2.y)/2 - defBow;

  const startX=e.clientX, startY=e.clientY;

  let moved=false;
  document.body.style.cursor='grabbing';

  const move = ev=>{
    const dx=ev.clientX-startX;
    const dy=ev.clientY-startY;
    if(!moved){
      if(Math.abs(dx)+Math.abs(dy) < 3) return;
      moved = true;
      pushUndo();
    }
    n.linkCurves[toId]={cx: cx0+dx, cy: cy0+dy};
    const cs = tlCenters();
    const a=cs[fromId], b=cs[toId];
    if(a&&b){
      const newD = `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} Q ${n.linkCurves[toId].cx.toFixed(1)} ${n.linkCurves[toId].cy.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
      if(hitEl) hitEl.setAttribute('d', newD);
      if(visualEl) visualEl.setAttribute('d', newD);
    }
  };
  const up = ()=>{
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    document.body.style.cursor='';
    if(moved) save();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function bindNodeEvents(){
  const layer=$('#tlNodes');
  if(!layer) return;

  layer.querySelectorAll('.tl-node').forEach(node=>{
    node.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      e.preventDefault();
      hideHoverTip();

      const id=node.dataset.tl;
      const idx=state.timeline.findIndex(x=>x.id===id);
      if(idx<0) return;

      const nodeData=state.timeline[idx];
      const startX=e.clientX, startY=e.clientY;
      const canvas=$('#tlCanvas');
      const cr=canvas.getBoundingClientRect();
      const scale = cr.width / (canvas.offsetWidth||cr.width);

      const startNodeX = typeof nodeData.x==='number' ? nodeData.x : (TL_PAD + idx*TL_NODE_W);
      const startDy = Number(nodeData.dy)||0;
      const centerY = (canvas.offsetHeight||800)/2;

      let moved=false;
      let curX=startNodeX, curDy=startDy;

      node.classList.add('dragging');
      document.body.style.cursor='grabbing';

      const move = ev=>{
        const dx=ev.clientX-startX;
        const dy=ev.clientY-startY;
        if(!moved && (Math.abs(dx)>3||Math.abs(dy)>3)) moved=true;
        if(moved){
          curX = startNodeX + dx;
          curDy = startDy + dy;
          node.style.left = curX+'px';
          node.style.top = (centerY+curDy)+'px';
          updateLinksForNode(id, curX, centerY + curDy);
        }
      };
      const up = ()=>{
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        node.classList.remove('dragging');
        document.body.style.cursor='';

        if(moved){
          if(Math.abs(curDy) < SNAP_DIST){
            curDy = 0;
          }
          nodeData.x = Math.round(curX);
          nodeData.dy = Math.round(curDy);
          pushUndo(); save();
          renderTimeline();
          logAction('时间线移动', nodeData.title);
        } else {
          if(e.ctrlKey || e.metaKey){
            const i=ctrlSel.indexOf(id);
            if(i>=0) ctrlSel.splice(i,1);
            else ctrlSel.push(id);
            node.classList.toggle('ctrl-sel', ctrlSel.includes(id));
            if(ctrlSel.length>=2){
              const prev=ctrlSel[ctrlSel.length-2];
              const cur=ctrlSel[ctrlSel.length-1];
              const a=state.timeline.find(x=>x.id===prev);
              if(a && prev!==cur){
                if(!a.links) a.links=[];
                if(!a.links.includes(cur)) a.links.push(cur);
                pushUndo(); save();
                drawLinks();
                toast('已连接两个节点');
              }
              ctrlSel=[];
              $$('.tl-node').forEach(n=>n.classList.remove('ctrl-sel'));
            }
          } else {
            ctrlSel=[];
            $$('.tl-node').forEach(n=>n.classList.remove('ctrl-sel'));
          }
        }
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });

    node.addEventListener('mouseenter', ()=>{
      const id=node.dataset.tl;
      const n=state.timeline.find(x=>x.id===id);
      if(n) showNodeHoverTip(node, n);
    });
    node.addEventListener('mouseleave', hideHoverTip);

    node.addEventListener('dblclick', e=>{
      e.stopPropagation();
      const id=node.dataset.tl;
      const n=state.timeline.find(x=>x.id===id);
      if(n) editNodeDialog(n);
    });

    node.addEventListener('contextmenu', e=>{
      e.preventDefault(); e.stopPropagation();
      hideHoverTip();
      showNodeCtxMenu(e.clientX, e.clientY, node.dataset.tl);
    });
  });
}

function showNodeHoverTip(nodeEl, n){
  hideHoverTip();
  const color = getComputedStyle(nodeEl).getPropertyValue('--node-color').trim() || state.tlMain;
  const tip=document.createElement('div');
  tip.className='hover-tip';
  tip.style.maxWidth='320px';
  tip.style.borderTopColor=color;
  tip.innerHTML=`<h4>#${String(n.num||1).padStart(2,'0')} ${escapeHtml(n.title||'')}</h4>
    <div class="sub">${escapeHtml(n.date||'')} · ${n.line==='main'?'主线':'支线'}</div>
    <div class="tip-body">${escapeHtml(n.desc||'（无描述）')}</div>`;
  document.body.appendChild(tip); hoverTipEl=tip;
  positionTip(lastMouseX, lastMouseY);
}

function computeDropIndex(clientX){
  const canvas=$('#tlCanvas');
  if(!canvas) return state.timeline.length;
  const cr=canvas.getBoundingClientRect();
  const scale=cr.width/(canvas.offsetWidth||cr.width);
  const x=(clientX-cr.left)/scale;
  let idx=Math.round((x-TL_PAD)/TL_NODE_W);
  return Math.max(0, Math.min(state.timeline.length, idx));
}

function showTlBlankCtx(cx,cy,x,y){
  const menu=document.createElement('div');
  menu.className='tl-ctx-menu';
  menu.style.left=cx+'px'; menu.style.top=cy+'px';
  menu.innerHTML=`<div class="item" data-act="new-main">在此新建主线节点</div>
                  <div class="item" data-act="new-sub">在此新建支线节点</div>`;
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),0);
  menu.addEventListener('click', e=>{
    const it=e.target.closest('[data-act]'); if(!it) return;
    const isSub = it.dataset.act==='new-sub';
    const id='tl'+Date.now()+Math.random().toString(36).slice(2,5);
    const canvas=$('#tlCanvas');
    const h = canvas ? (canvas.offsetHeight||800) : 800;
    state.timeline.push({
      id, title:'新节点', date:'纪年 ——', line:isSub?'sub':'main',
      desc:'在此输入描述……',
      x:Math.max(TL_PAD, Math.round(x)),
      dy:Math.round(y - h/2),
      links:[], linkCurves:{}
    });

    renderTimeline();
    toast(isSub?'已新建支线节点':'已新建主线节点');

  });
}

function showNodeCtxMenu(cx,cy,id){
  const n=state.timeline.find(x=>x.id===id); if(!n) return;
  const menu=document.createElement('div');
  menu.className='tl-ctx-menu';
  menu.style.left=cx+'px'; menu.style.top=cy+'px';
  menu.innerHTML=`<div class="title-bar">#${String(n.num||1).padStart(2,'0')} ${escapeHtml(n.title||'')}</div>
    <div class="item" data-act="edit">编辑内容</div>
    <div class="item" data-act="relate">关联到其他节点…</div>
    <div class="item" data-act="line-main">设为主线</div>
    <div class="item" data-act="line-sub">设为支线</div>
    <div class="item" data-act="reset-dy">对齐到主轴</div>
    <div class="item danger" data-act="del">删除节点</div>`;
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),0);
  menu.addEventListener('click', e=>{
    const it=e.target.closest('[data-act]'); if(!it) return;
    const act=it.dataset.act;
    if(act==='edit'){ menu.remove(); editNodeDialog(n); return; }
    if(act==='relate'){ menu.remove(); openRelateDialog(n); return; }
    if(act==='line-main'||act==='line-sub'){
      n.line = act==='line-main'?'main':'sub';
      pushUndo(); save(); renderTimeline();
      toast(n.line==='main'?'已设为主线':'已设为支线');
      menu.remove(); return;
    }
    if(act==='reset-dy'){
      n.dy=0;
      pushUndo(); save(); renderTimeline();
      toast('已对齐到主轴');
      menu.remove(); return;
    }
    if(act==='del'){
      if(!confirm('删除该时间节点？')) return;
      state.timeline = state.timeline.filter(x=>x.id!==id);
      state.timeline.forEach(t=>{
        t.links=(t.links||[]).filter(l=>l!==id);
        if(t.linkCurves) delete t.linkCurves[id];
      });
      renumberTimeline(); pushUndo(); save(); renderTimeline();
      toast('已删除'); menu.remove();
    }
  });
}

function editNodeDialog(n){
  const html=`<div class="modal-mask"><div class="modal" onclick="event.stopPropagation()" style="max-width:600px">
    <div class="modal-head"><h3>编辑节点 #${String(n.num||1).padStart(2,'0')}</h3><button class="modal-close" data-nec>✕</button></div>
    <div class="modal-body">
      <div class="data-grid">
        <div class="row"><label>标题</label><input type="text" id="ne-title" value="${escapeHtml(n.title||'')}"></div>
        <div class="row"><label>时间</label><input type="text" id="ne-date" value="${escapeHtml(n.date||'')}"></div>
        <div class="row" style="grid-column:1/-1"><label>描述</label><textarea id="ne-desc" style="min-height:120px;resize:vertical">${escapeHtml(n.desc||'')}</textarea></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
        <button class="btn" data-nec>取消</button>
        <button class="btn primary" id="ne-save">保存</button>
      </div>
    </div></div></div>`;
  $('#modal-root').innerHTML=html;
  $$('[data-nec]').forEach(b=>b.addEventListener('click',()=>{$('#modal-root').innerHTML=''}));

function openRelateDialog(n){
  const others=state.timeline.filter(x=>x.id!==n.id);
  if(!others.length){ toast('没有其他节点可关联'); return; }
  const list=others.map(o=>`<div class="sb-item" data-relate-to="${attr(o.id)}"><span class="nm">#${String(o.num||1).padStart(2,'0')} ${escapeHtml(o.title||'')}</span></div>`).join('');
  const html=`<div class="modal-mask"><div class="modal" onclick="event.stopPropagation()" style="max-width:480px">
    <div class="modal-head"><h3>关联到其他节点</h3><button class="modal-close" data-relc>✕</button></div>
    <div class="modal-body"><p style="font-size:.72em;color:var(--text-dim);margin-bottom:12px;">点击目标节点即可从当前节点连接过去。</p><div class="sb-body" style="max-height:340px;overflow-y:auto">${list}</div></div>
  </div></div>`;
  $('#modal-root').innerHTML=html;
  $$('[data-relc]').forEach(b=>b.addEventListener('click',()=>{$('#modal-root').innerHTML=''}));
  document.querySelectorAll('[data-relate-to]').forEach(el=>{
    el.addEventListener('click',()=>{
      const tid=el.dataset.relateTo;
      if(!n.links) n.links=[];
      if(!n.links.includes(tid)) n.links.push(tid);
      pushUndo(); save(); drawLinks();
      $('#modal-root').innerHTML='';
      toast('已关联');
    });
  });
}

function showLinkCtxMenu(cx,cy,fromId,toId){
  const menu=document.createElement('div');
  menu.className='tl-ctx-menu';
  menu.style.left=cx+'px'; menu.style.top=cy+'px';
  menu.innerHTML=`<div class="title-bar">连线操作</div>
                  <div class="item" data-act="new-node">新建节点</div>
                  <div class="item danger" data-act="del-curve">删除曲线</div>`;
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),0);
  menu.addEventListener('click', e=>{
    const it=e.target.closest('[data-act]'); if(!it) return;
    const act=it.dataset.act;
    if(act==='new-node'){
      menu.remove();
      createNodeOnLink(fromId, toId);
      return;
    }
    if(act==='del-curve'){
      const key = fromId+'-'+toId;
      const targets = (selectedLinks.includes(key) && selectedLinks.length>1) ? selectedLinks.slice() : [key];
      pushUndo();
      let count=0;
      targets.forEach(k=>{
        const parts = k.split('-');
        const f = parts[0], t = parts[1];
        const a = state.timeline.find(x=>x.id===f);
        if(!a) return;
        if((a.links||[]).includes(t)){
          a.links = a.links.filter(l=>l!==t);
          if(a.linkCurves) delete a.linkCurves[t];
          count++;
        }
      });
      selectedLinks = selectedLinks.filter(k=>!targets.includes(k));
      save(); drawLinks();
      toast(`已删除 ${count} 条连线`);
      menu.remove();
    }
  });
}

function createNodeOnLink(fromId, toId){
  const a = state.timeline.find(x=>x.id===fromId);
  if(!a) return;

  const centers = tlCenters();
  const c1 = centers[fromId], c2 = centers[toId];
  const canvas = $('#tlCanvas');
  const h = canvas ? (canvas.offsetHeight||800) : 800;

  let midX, midY;
  if(c1 && c2){ midX = (c1.x + c2.x)/2; midY = (c1.y + c2.y)/2; }
  else { midX = TL_PAD; midY = h/2; }

  const newId = 'tl'+Date.now()+Math.random().toString(36).slice(2,5);
  pushUndo();
  const newNode = {
    id: newId, title:'新节点', date:'纪年 ——',
    line: a.line || 'main',

function drawTlDeco(){
  const deco=$('#tlDeco'); if(!deco) return;

  const colors=[mixColor(state.blBlood,'#ffffff',0.05), mixColor(state.blBlood,'#4a0008',0.35), mixColor(state.blBlood,'#ffffff',0.25)];
  for(let k=0;k<3;k++){
    const off=(k-1)*30+(Math.random()-.5)*16; const yB=cy+off;
    const amp=8+Math.random()*16; const freq=0.6+Math.random()*1.2; const ph=Math.random()*Math.PI*2;
    const c=colors[k]; const w=0.5+Math.random()*1.0; const dur=18+Math.random()*18; const del=-Math.random()*10;
    let d=`M 0 ${yB}`;
    for(let x=0;x<=W;x+=36){ const y=yB+Math.sin(x/520*freq+ph)*amp; d+=` L ${x} ${y.toFixed(1)}`; }
    lines.push(`<path class="wave" d="${d}" stroke="${c}" stroke-width="${w.toFixed(2)}" style="animation-duration:${dur.toFixed(1)}s;animation-delay:${del.toFixed(1)}s;opacity:0.25"/>`);
  }
  deco.innerHTML=`<svg viewBox="0 0 ${W} 1080" preserveAspectRatio="none" style="width:100%;height:100%">${lines.join('')}</svg>`;

/* ============ 世界·生物 ============ */
const WORLD_ORDER=['+13','+12','+11','+10','+9','+8','+7','+5','+4','+3','+1','0','−1','−2','−5','−6','−7','−8','−9','−10','−12','−18','深层'];
/* 层块颜色跟随主配色 */
function layerColor(l){
  let n=0;
  if(l==='0')n=0;
  else if(l==='深层')n=-30;
  else{const s=l.replace(/[+−]/g,m=>m==='−'?'-':'');n=parseInt(s,10);if(isNaN(n))n=0}
  const dark = mixColor(state.accent,'#000000',0.78);
  return mixColor(state.accent, dark, Math.min(Math.abs(n),10)/10);
}
function layerAlpha(l){let n=0;if(l==='深层')n=-30;else if(l!=='0'){const s=l.replace(/[−]/g,'-');n=parseInt(s,10);if(isNaN(n))n=0}if(n>=10)return Math.max(.18,.72-(n-10)*.13);if(n<=-10)return Math.max(.18,.72-(-n-10)*.13);return 1}
function layerBlur(l,L){let n=0;if(l==='深层')n=-30;else if(l!=='0'){const s=l.replace(/[−]/g,'-');n=parseInt(s,10);if(isNaN(n))n=0}const d=Math.abs(n);const hi=L&&L.hasInfo!==false;if(d>=10){if(hi)return 1+(d-10)*.5;return 1+(d-10)*1.4}return 0}
let worldTab='layers';let worldDetailId=null;let bioDetailId=null;let worldQuery='';
let worldCenters=[];let worldAnimRAF=null;let worldAnimStart=0;

let detailLinkData = [];
let currentDetailType = null;

function extractMentionedLevels(text){
  const set=new Set();
  const t=String(text||'').replace(/[−–—﹣]/g,'-');
  let m;
  const re1=/([+-])\s*(\d+)\s*层/g;
  while((m=re1.exec(t)))set.add((m[1]==='+'?'+':'−')+parseInt(m[2],10));
  const re2=/([+-])\s*(\d+)(?![\d\s]*层)/g;
  while((m=re2.exec(t)))set.add((m[1]==='+'?'+':'−')+parseInt(m[2],10));
  if(/(?<![\d])0\s*层/.test(t))set.add('0');
  if(/(深层|深渊|无底)/.test(t))set.add('深层');
  if(/十层/.test(t))set.add('+10');
  return set;
}

function selectLayer(level){
  if(worldTab!=='layers')return;

function collectWorldCenters(){
  const map=$('#worldMap');if(!map)return;
  const r=map.getBoundingClientRect();
  const blks=Array.from(map.querySelectorAll('.world-block'));
  worldCenters=blks.map(b=>{const br=b.getBoundingClientRect();return{x:br.left-r.left+br.width/2,y:br.top-r.top+br.height/2}}).sort((a,b)=>a.y-b.y);
}

function initDetailLinks(type, onlyLevels) {
  currentDetailType = type;
  detailLinkData = [];
  const st = type === 'world' ? $('#worldStage') : $('#bioStage');
  const svgId = type === 'world' ? '#worldDetailLinksSvg' : '#bioDetailLinksSvg';
  const svg = $(svgId);
  if (!st || !svg) return;
  svg.innerHTML = '';

  const blocks = st.querySelectorAll(type === 'world' ? '.world-block' : '.bio-card');

  blocks.forEach(blk => {
    if (onlyLevels && !onlyLevels.has(blk.dataset.layer)) return;
    const phase = Math.random() * Math.PI * 2;
    const period = 3 + Math.random() * 4;
    const amp = 10 + Math.random() * 20;
    const strokeWidth = (0.6 + Math.random() * 1.5).toFixed(2);
    const opacity = (0.15 + Math.random() * 0.35).toFixed(2);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--bl-blood)');
    path.setAttribute('stroke-width', strokeWidth);
    path.setAttribute('opacity', opacity);
    path.style.animation = `worldLineBreath ${state.blPeriod * (0.8 + Math.random()*0.6)}s ease-in-out infinite`;
    path.style.animationDelay = `-${Math.random() * state.blPeriod}s`;

    svg.appendChild(path);

    detailLinkData.push({ path, blk, phase, period, amp });
  });

  svg.setAttribute('viewBox', `0 0 ${st.clientWidth} ${st.clientHeight}`);
  svg.style.width = '100%';
  svg.style.height = '100%';
}

function animateWorldBloodline(now){
  if(!$('#worldStage')){worldAnimRAF=null;worldAnimStart=0;return}
  if(!worldAnimStart)worldAnimStart=now;
  const t=(now-worldAnimStart)/1000;

  const p=$('#worldPathMain'),ps=$('#worldPathSub');
  if(p&&worldCenters.length>1){
    const amp=20;const om=Math.PI*2/120;const ph=t*om;
    let d=`M ${worldCenters[0].x.toFixed(1)} ${worldCenters[0].y.toFixed(1)}`;
    for(let i=1;i<worldCenters.length;i++){const p0=worldCenters[i-1],p1=worldCenters[i];const my=(p0.y+p1.y)/2;const w=Math.sin(ph+i*0.7)*amp+Math.cos(ph*0.4+i*0.9)*amp*0.5;d+=` C ${(p0.x+w).toFixed(1)} ${my.toFixed(1)}, ${(p1.x-w).toFixed(1)} ${my.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`}
    p.setAttribute('d',d);
  }
  if(ps&&worldCenters.length>1){
    const amp=28;const om=Math.PI*2/150;const ph=t*om+1.2;
    let d=`M ${(worldCenters[0].x+22).toFixed(1)} ${worldCenters[0].y.toFixed(1)}`;
    for(let i=1;i<worldCenters.length;i++){const p0=worldCenters[i-1],p1=worldCenters[i];const my=(p0.y+p1.y)/2;const w=Math.cos(ph+i*1.1)*amp;d+=` C ${(p0.x+22+w).toFixed(1)} ${my.toFixed(1)}, ${(p1.x+22-w).toFixed(1)} ${my.toFixed(1)}, ${(p1.x+22).toFixed(1)} ${p1.y.toFixed(1)}`}
    ps.setAttribute('d',d);
  }

  if(detailLinkData.length > 0) {
    const st = currentDetailType === 'world' ? $('#worldStage') : $('#bioStage');
    if (st) {
      const detail = st.querySelector('.world-detail');
      if (detail) {
        const sr = st.getBoundingClientRect();
        const dr = detail.getBoundingClientRect();
        const startX = dr.left - sr.left + 10;
        const startY = dr.top - sr.top + 40;

        detailLinkData.forEach(data => {
          const br = data.blk.getBoundingClientRect();
          const endX = br.right - sr.left;
          const endY = br.top - sr.top + br.height / 2;
          const waveX = Math.sin(t * (Math.PI * 2 / data.period) + data.phase) * data.amp;
          const waveY = Math.cos(t * (Math.PI * 2 / data.period) + data.phase) * data.amp;
          const baseCx = (startX + endX) / 2;
          const baseCy = (startY + endY) / 2 - Math.max(20, Math.min(80, Math.abs(endX - startX) * 0.2));
          const cx = baseCx + waveX;
          const cy = baseCy + waveY;
          const d = `M ${startX.toFixed(1)} ${startY.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${endX.toFixed(1)} ${endY.toFixed(1)}`;
          data.path.setAttribute('d', d);
        });
      }
    }
  }

  worldAnimRAF=requestAnimationFrame(animateWorldBloodline);
}

function updateWorldDetail(level){
  const st = $('#worldStage');
  const container = $('#worldDetailContainer');
  if (!st || !container) return;
  
  if (!level) {
    st.classList.remove('detail-open');
    setTimeout(() => { 
      if (!st.classList.contains('detail-open')) container.innerHTML = ''; 
    }, 550);
    $$('.world-block').forEach(b => b.classList.remove('selected'));
    const svg = $('#worldDetailLinksSvg'); if (svg) svg.innerHTML = '';
    detailLinkData = [];
    return;
  }
  
  const d = allLayers().find(l => l.level === level);
  if (!d) return;
  const c = layerColor(d.level);
  
  const blk = document.querySelector(`.world-block[data-layer="${CSS.escape(level)}"]`);
  let top = 0;
  if (blk) {
    const br = blk.getBoundingClientRect();
    const sr = st.getBoundingClientRect();
    top = Math.max(0, br.top - sr.top);
  }
  const maxH = Math.max(200, st.clientHeight - top);
  
  st.classList.remove('detail-open');
  container.innerHTML = `<div class="world-detail" id="worldDetail" style="--wd-color:${c};top:${top}px;max-height:${maxH}px;">
    <div class="wd-line"></div>
    <div class="wd-head">
      <button class="close" data-close-detail>✕</button>
      <div class="wd-level">${escapeHtml(d.level)}</div>
      <div class="wd-name">${escapeHtml(d.name)}</div>
      <div class="wd-terrain">${escapeHtml(d.terrain)}</div>
    </div>
    <div class="wd-body">${escapeHtml(d.desc || '（无详细描述）')}</div>
  </div>`;
  
  const svg = $('#worldDetailLinksSvg'); if (svg) svg.innerHTML = '';
  detailLinkData = [];
  
  $$('.world-block').forEach(b => b.classList.toggle('selected', b.dataset.layer === level));
  
  const closeBtn = container.querySelector('[data-close-detail]');
  if (closeBtn) closeBtn.addEventListener('click', () => {
    worldDetailId = null;
    save();
    updateWorldDetail(null);
  });
  
  void st.offsetWidth;
  st.classList.add('detail-open');
  
  const mentioned = extractMentionedLevels([d.name, d.terrain, d.desc].join(' '));
  mentioned.add(d.level);
  initDetailLinks('world', mentioned);
}

function updateBioDetail(id){
  const st = $('#bioStage');
  const container = $('#bioDetailContainer');
  if (!st || !container) return;
  if (!id) {
    st.classList.remove('detail-open');
    setTimeout(() => { 
      if (!st.classList.contains('detail-open')) container.innerHTML = ''; 
    }, 550);
    const svg = $('#bioDetailLinksSvg'); if (svg) svg.innerHTML = '';
    detailLinkData = [];
    return;
  }
  const det = (state.bioImages || []).find(b => b.id === id);
  if (!det) return;
  
  const card = document.querySelector(`.bio-card[data-bio-id="${CSS.escape(id)}"]`);
  let top = 0;
  if (card) {
    const br = card.getBoundingClientRect();
    const sr = st.getBoundingClientRect();
    top = Math.max(0, br.top - sr.top);
  }
  const maxH = Math.max(200, st.clientHeight - top);
  
  st.classList.remove('detail-open');
  container.innerHTML = `<div class="world-detail" id="bioDetail" style="--wd-color:var(--accent);top:${top}px;max-height:${maxH}px;">
    <div class="wd-line"></div>
    <div class="wd-head">
      <button class="close" data-close-bio>✕</button>
      ${det.src?`<img src="${det.src}" data-view-src="${attr(det.src)}" data-view-title="${escapeHtml(det.name||'')}" title="点击查看原图" style="width:100%;max-height:200px;object-fit:cover;margin-bottom:12px;border:1px solid var(--border);cursor:zoom-in;">`:''}
      <div class="wd-name" style="font-size:1.05em;">${escapeHtml(det.name||'未命名')}</div>
      <div class="wd-terrain">${det.size?(det.size/1024).toFixed(1)+' KB':'无图片'} · ${escapeHtml(det.date||'')}</div>
    </div>
    <div class="wd-body">${escapeHtml(det.desc||'（无详细描述）')}</div>
    <div style="padding:0 20px 20px;"><button class="btn danger" data-del-bio="${attr(det.id)}" style="width:100%">删除该生物</button></div>
  </div>`;
  
  const svg = $('#bioDetailLinksSvg'); if (svg) svg.innerHTML = '';
  detailLinkData = [];
  
  void st.offsetWidth;
  st.classList.add('detail-open');
  
  const closeBtn = container.querySelector('[data-close-bio]');
  if (closeBtn) closeBtn.addEventListener('click', () => {
    bioDetailId = null; save(); updateBioDetail(null);
    document.querySelectorAll('.bio-card').forEach(x => x.classList.remove('selected'));
  });
  const delBtn = container.querySelector('[data-del-bio]');
  if (delBtn) delBtn.addEventListener('click', () => {
    if (!confirm('删除该生物？')) return;
    pushUndo();
    state.bioImages = state.bioImages.filter(b => b.id !== delBtn.dataset.delBio);
    bioDetailId = null; save();
    updateBioDetail(null);
    renderBioPane();
    renderWorldNav();
    logAction('删除生物', '');
    toast('已删除');
  });
  
  initDetailLinks('bio');
}

function openAddBioDialog(){
  const html=`<div class="modal-mask"><div class="modal" onclick="event.stopPropagation()" style="max-width:560px"><div class="modal-head"><h3>添加生物</h3><button class="modal-close" data-close>✕</button></div><div class="modal-body"><div class="data-grid"><div class="row" style="grid-column:1/-1"><label>生物名称 *</label><input type="text" id="nb-name" placeholder="如：纽曼娜集群"></div><div class="row" style="grid-column:1/-1"><label>详细描述</label><textarea id="nb-desc" style="min-height:120px;resize:vertical"></textarea></div><div class="row" style="grid-column:1/-1"><label>图片（选填 · 单张 ≤ 80 MB）</label><input type="file" id="nb-img" accept="image/*"></div></div><div class="img-hint">单张 ≤ 80 MB，总量 ≤ 512 MB</div><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn primary" id="nb-confirm">添加</button></div></div></div></div>`;

  document.querySelector('.modal').addEventListener('click',e=>e.stopPropagation());
  $('#nb-confirm').addEventListener('click',()=>{const name=($('#nb-name').value||'').trim();if(!name){toast('请填写生物名称');return}const desc=($('#nb-desc').value||'').trim();const file=$('#nb-img').files&&$('#nb-img').files[0];const fin=(src,size)=>{pushUndo();state.bioImages.push({id:'img'+Date.now()+Math.random().toString(36).slice(2,5),name,desc,src,size:size||0,date:new Date().toLocaleDateString()});save();$('#modal-root').innerHTML='';renderWorldView();logAction('添加生物',name);toast('已添加生物')};if(file){if(file.size>80*1024*1024){toast('单张图片超过 80 MB，请压缩后重试');return}const tot=(state.bioImages||[]).reduce((s,i)=>s+i.size,0);if(tot+file.size>512*1024*1024){toast('生物图片总量超过 512 MB');return}const rd=new FileReader();rd.onload=()=>fin(rd.result,file.size);rd.onerror=()=>fin(null,0);rd.readAsDataURL(file)}else fin(null,0)});

function safeData(){
  const r={cats:[],writing:{},totalArticles:0,totalWords:0,bioTotal:0,totalSize:'?',snaps:[],logs:[],last14:[],maxW:1};
  try{r.cats=Array.isArray(state.wbCategories)?state.wbCategories.filter(c=>c&&typeof c==='object'&&c.key):[]}catch(e){}
  try{r.writing=state.writing||{}}catch(e){}
  try{r.cats.forEach(c=>{const w=r.writing[c.key];if(!w||!Array.isArray(w.articles))return;r.totalArticles+=w.articles.length;w.articles.forEach(a=>{if(a)r.totalWords+=countWords(a.body)})})}catch(e){}
  try{r.bioTotal=(state.bioImages||[]).reduce((s,i)=>s+((i&&i.size)||0),0)}catch(e){}
  try{r.totalSize=(JSON.stringify(state).length/1024).toFixed(1)}catch(e){}
  try{r.snaps=snapshotsLoad()}catch(e){}
  try{r.logs=(state.actionLog||[]).slice().reverse()}catch(e){}
  try{for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const rec=(state.statsHistory||[]).find(x=>x&&x.date===k);r.last14.push({date:k,words:rec?rec.words:0})}r.maxW=Math.max(1,...r.last14.map(x=>x.words))}catch(e){}
  return r;
}

function handleBgUpload(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(f.size>80*1024*1024){toast('图片超过 80 MB');e.target.value='';return}
  const r=new FileReader();
  r.onload=()=>{pushUndo();state.bgImage=r.result;save();applyBg();renderDataBody();logAction('上传背景图',f.name);toast('已设置背景图')};
  r.readAsDataURL(f);e.target.value='';
}
function handleBioUpload(e){
  const inputEl=e.target;
  const fs=Array.from(inputEl.files||[]);if(!fs.length)return;
  let tot=(state.bioImages||[]).reduce((s,i)=>s+((i&&i.size)||0),0);
  let added=0,skip=0;
  const next=idx=>{
    if(idx>=fs.length){save();renderDataBody();renderWorldNav();const msg=[];if(added)msg.push('已添加 '+added+' 张');if(skip)msg.push('跳过 '+skip+' 张');logAction('上传生物图像',msg.join(' · '));toast(msg.join(' · ')||'无图片被添加');inputEl.value='';return}
    const f=fs[idx];
    if(f.size>80*1024*1024){skip++;next(idx+1);return}
    if(tot+f.size>512*1024*1024){skip++;next(idx+1);return}
    const r=new FileReader();
    r.onload=()=>{state.bioImages.push({id:'img'+Date.now()+Math.random().toString(36).slice(2,5),name:f.name.replace(/\.[^.]+$/,''),size:f.size,src:r.result,date:new Date().toLocaleDateString()});tot+=f.size;added++;next(idx+1)};
    r.onerror=()=>{skip++;next(idx+1)};
    r.readAsDataURL(f);
  };
  pushUndo();next(0);
}
function doExport(){
  const payload={_meta:{app:'三构体创作台',exportedAt:new Date().toISOString(),version:20},data:state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='sangouti-full-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  logAction('导出数据','JSON');save();toast('已导出全部数据');
}

/* ============ 面板边缘拖拽调整大小（全局委托） ============ */
document.addEventListener('pointerdown', e=>{
  const h = e.target.closest('[data-pane-resizer]');
  if(!h) return;
  e.preventDefault();
  e.stopPropagation();
  const key = h.dataset.paneResizer;
  const wrap = h.closest('[data-pane-wrap]');
  if(!wrap || !PANE_DEF[key]) return;

  const startX = e.clientX;
  const curW = paneW(key);
  const minW = PANE_DEF[key].min, maxW = PANE_DEF[key].max;

  h.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';

  const move = ev=>{
    const dx = ev.clientX - startX;
    const w = Math.max(minW, Math.min(maxW, Math.round(curW + dx)));
    state.paneW[key] = w;
    wrap.style.gridTemplateColumns = `${w}px minmax(0,1fr)`;
  };
  const up = ()=>{
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    h.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    if(location.hash.indexOf('#/events')===0) renderTimeline();
    save();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

/* ============ 全局事件 ============ */
document.addEventListener('click',e=>{
  const xref=e.target.closest('.xref');
  if(xref){e.preventDefault();e.stopPropagation();const id=xref.dataset.goto;if(id)showEntryModal(id);return}
  const tag=e.target.closest('[data-tag]');
  if(tag){const t=tag.dataset.tag;const found=allArchive().find(x=>x.title===t||(x.tags||[]).includes(t));if(found)showEntryModal(found.id);return}
  const chip=e.target.closest('[data-keyword]');
  if(chip){const k=chip.dataset.keyword;const found=allArchive().find(x=>x.title===k||(x.tags||[]).includes(k));if(found)showEntryModal(found.id);return}
  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const key=tg.dataset.toggle;
    if(key.startsWith('card:')){
      /* v3：二级条目默认折叠，closed 为 true（state.collapsed[key]!==false） */
      const closed=state.collapsed[key]!==false;
      state.collapsed[key]=!closed;save();
      const card=tg.closest('.card');if(card)card.classList.toggle('collapsed',!closed);
      const chev=tg.querySelector('.chev');if(chev)chev.classList.toggle('closed',!closed);
      if(typeof archFoldFX==='function')archFoldFX();
      return;
    }
    if(key.startsWith('cgrp:')){
      /* 默认值修正：未记录状态 = 展开，与渲染逻辑一致 */
      const closed=!!state.collapsed[key];
      state.collapsed[key]=!closed;save();
      const grp=tg.closest('.char-group')||tg.closest('.char-roster-group');if(grp)grp.classList.toggle('collapsed',state.collapsed[key]);
      const chev=tg.querySelector('.chev');if(chev)chev.classList.toggle('closed',state.collapsed[key]);
      return;
    }
    state.collapsed[key]=!state.collapsed[key];save();

/* ============ 世界层数块拖拽（全局指针） ============ */
let worldDragTarget = null;
let worldDragStart = { x: 0, y: 0 };
let worldDragPos = { dx: 0, dy: 0 };
let worldDragging = false;

document.addEventListener('pointerdown', e => {
  const block = e.target.closest('.world-block');
  if (!block || e.button !== 0) return;
  e.preventDefault();
  worldDragTarget = block;
  worldDragStart.x = e.clientX;
  worldDragStart.y = e.clientY;
  const lv = block.dataset.layer;
  const pos = state.worldPositions[lv] || { dx: 0, dy: 0 };
  worldDragPos.dx = pos.dx;
  worldDragPos.dy = pos.dy;
  worldDragging = false;
  document.body.style.cursor = 'grabbing';
});

window.addEventListener('pointermove', e => {
  if (!worldDragTarget) return;
  const dx = e.clientX - worldDragStart.x;
  const dy = e.clientY - worldDragStart.y;
  if (!worldDragging && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
    worldDragging = true;
    worldDragTarget.classList.add('dragging');
  }
  if (worldDragging) {
    const lv = worldDragTarget.dataset.layer;
    state.worldPositions[lv] = { dx: worldDragPos.dx + dx, dy: worldDragPos.dy + dy };
    worldDragTarget.style.transform = `translate(${state.worldPositions[lv].dx}px,${state.worldPositions[lv].dy}px)`;
    collectWorldCenters();
  }
});

window.addEventListener('pointerup', e => {
  if (!worldDragTarget) return;
  const block = worldDragTarget;
  const wasDragging = worldDragging;
  worldDragTarget = null;
  worldDragging = false;
  document.body.style.cursor = '';
  block.classList.remove('dragging');
  
  if (wasDragging) {
    pushUndo();
    save();
  } else {
    selectLayer(block.dataset.layer);
  }
});

/* v7 内容补全：把 docx 标准阵容合并进已有档案（不覆盖用户已填字段，只补缺角色/空字段） */
function ensureSeedContent(){
  if((state.contentVer||0)>=3)return;
  ensureCharCats();
  const legByNum={};state.charCats.forEach(c=>{const m=/^leg-(\d+)$/.exec(c.id||'');if(m)legByNum[+m[1]]=c});
  const byId={};(state.characters||[]).forEach(c=>byId[c.id]=c);
  let added=0;
  SEED_CHARACTERS.forEach(s=>{
    let t=byId[s.id];
    if(!t){t=Object.assign({},s);state.characters.push(t);byId[s.id]=t;added++}
    else Object.keys(s).forEach(k=>{if(t[k]===undefined||t[k]===''||t[k]==='—')t[k]=s[k]});
    if(!t.cat||!state.charCats.some(c=>c.id===t.cat)){
      const n=legionNumFromText((t.faction||'')+(t.identity||''));
      const cat=legByNum[n]||state.charCats[0];
      if(cat)t.cat=cat.id;
    }
    if(!t.group)t.group='other';
    if(!t.memberType)t.memberType='internal';
  });
  state.contentVer=3;
  if(added)toast('已按设定文档补全 '+added+' 位人物');
}

<script>
/* ============================================================
   v3 第二块：展示图库 · 顶栏拖拽 · 右键编辑 · 数据清空
   ============================================================ */

/* ---------- 展示图库 ---------- */
const GAL_CATS=[{id:'illus',name:'插图'},{id:'world',name:'世界'},{id:'creature',name:'生物'},{id:'scene',name:'场景'},{id:'arch',name:'建筑'},{id:'person',name:'人物'},{id:'other',name:'其他'}];
const GAL_SUBS=[{id:'final',name:'正式稿'},{id:'design',name:'设计稿'},{id:'sketch',name:'手稿'}];
let galCat='illus',galSub='final',galDetailId=null,galQuery='';
let galLinkData=[],galRAF=null,galT0=0;
function galCatName(id){const c=GAL_CATS.find(x=>x.id===id);return c?c.name:id}
function galSubName(id){const s=GAL_SUBS.find(x=>x.id===id);return s?s.name:id}
function renderGalleryView(){
  const view=$('#view');
  view.innerHTML=`<div class="gal-wrap" data-pane-wrap style="grid-template-columns:${paneW('gallery')}px minmax(0,1fr)"><aside class="view-sidebar">${panelCtrlHtml('gallery')}<div class="sb-head"><h3>${escapeHtml(state.labels.__navGallery||'展示图库')}</h3><div class="sb-search"><span class="si">⌕</span><input id="galSearch" type="text" placeholder="搜索图片 / 故事…"></div></div><div class="sb-body" id="galNav"></div><div class="sb-actions"><button class="btn primary" id="btnGalAdd">＋ 添加图片</button></div><div class="pane-resizer" data-pane-resizer="gallery"></div></aside><div class="gal-main"><div class="gal-body" id="galBody"></div></div></div>`;
  const inp=$('#galSearch');if(inp){inp.value=galQuery;inp.addEventListener('input',debounce(()=>{galQuery=inp.value;renderGalNav();renderGalBody()},180))}
  const b=$('#btnGalAdd');if(b)b.addEventListener('click',()=>openGalDialog());
  renderGalNav();renderGalBody();bindPanelCtrl();
}
function renderGalNav(){
  const nav=$('#galNav');if(!nav)return;
  const q=galQuery.toLowerCase();
  nav.innerHTML=GAL_CATS.map(c=>{
    const n=(state.gallery||[]).filter(g=>g.cat===c.id&&(!q||((g.title||'')+(g.story||'')).toLowerCase().includes(q))).length;
    if(q&&!n)return '';
    return `<div class="sb-item${galCat===c.id?' active':''}" data-galcat="${attr(c.id)}"><span class="nm">${c.name}</span><span class="badge">${n}</span></div>`;
  }).join('')||'<div class="sb-empty">无匹配结果</div>';
  nav.querySelectorAll('[data-galcat]').forEach(el=>{el.addEventListener('click',()=>{galCat=el.dataset.galcat;galDetailId=null;renderGalNav();renderGalBody()})});
}
function galCardHtml(g,i){
  const sub=g.cat==='illus'?'插图 · 相关故事':galCatName(g.cat)+' · '+galSubName(g.sub);
  return `<div class="gal-card${galDetailId===g.id?' selected':''}" data-gal-id="${attr(g.id)}" style="animation-delay:${Math.min(i*40,400)}ms">${g.src?`<img src="${g.src}" alt="">`:`<div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--text-dim);background:var(--panel2);font-size:1.6em;">○</div>`}<div class="cap" data-edit="gal" data-edit-id="${attr(g.id)}" data-edit-field="title">${escapeHtml(g.title||'未命名')}</div><div class="cap-sub">${sub}${g.date?' · '+escapeHtml(g.date):''}</div></div>`;
}
function renderGalBody(){
  const body=$('#galBody');if(!body)return;
  const q=galQuery.toLowerCase();
  const items=(state.gallery||[]).filter(g=>{
    if(galCat==='illus'){if(g.cat!=='illus')return false}
    else{if(g.cat!==galCat||g.sub!==galSub)return false}
    if(q&&!((g.title||'')+(g.story||'')).toLowerCase().includes(q))return false;
    return true;
  });
  const tabs=GAL_CATS.map(c=>{
    const n=(state.gallery||[]).filter(g=>g.cat===c.id).length;
    return `<button class="gal-tab${galCat===c.id?' active':''}" data-galcat="${attr(c.id)}">${c.name}<span style="opacity:.55;font-size:.85em"> ${n}</span></button>`;
  }).join('');
  const subs=galCat==='illus'?'':`<div class="gal-subs">${GAL_SUBS.map(s=>`<button class="gal-sub-btn${galSub===s.id?' active':''}" data-galsub="${attr(s.id)}">${s.name}</button>`).join('')}</div>`;
  body.innerHTML=`<div class="gal-hero"><h1 data-edit="label" data-edit-id="__navGallery">${escapeHtml(state.labels.__navGallery||'展示图库')}</h1><p>${galCat==='illus'?'「插图」分类置于最前：此处仅展示插图与相关故事。':'每个分类下设：正式稿 / 设计稿 / 手稿。单张 ≤ 600 KB，总量 ≤ 6 MB。'}</p></div><div class="gal-tabs">${tabs}</div>${subs}<div class="gal-stage" id="galStage">${items.length?`<div class="gal-grid">${items.map(galCardHtml).join('')}</div>`:`<div class="gal-empty"><b>暂无图片</b><br>点击左侧「＋ 添加图片」开始收录${galCatName(galCat)}${galCat==='illus'?'插图':' · '+galSubName(galSub)}。</div>`}<svg class="gal-detail-links" id="galLinksSvg"></svg><div id="galDetailContainer"></div></div>`;
  body.querySelectorAll('[data-galcat]').forEach(el=>{if(el.classList.contains('gal-tab'))el.addEventListener('click',()=>{galCat=el.dataset.galcat;galDetailId=null;renderGalNav();renderGalBody()})});
  body.querySelectorAll('[data-galsub]').forEach(el=>{el.addEventListener('click',()=>{galSub=el.dataset.galsub;galDetailId=null;renderGalBody()})});
  body.querySelectorAll('[data-gal-id]').forEach(el=>{el.addEventListener('click',e=>{if(Date.now()-(el.__dragT||0)<300)return;if(e.target.closest('[data-edit]'))return;const id=el.dataset.galId;if(galDetailId===id)closeGalDetail();else openGalDetail(id)})});
  if(galDetailId&&(state.gallery||[]).find(g=>g.id===galDetailId))openGalDetail(galDetailId,true);
}
function galInitLinks(){
  galLinkData=[];
  const st=$('#galStage'),svg=$('#galLinksSvg');if(!st||!svg)return;
  svg.innerHTML='';
  st.querySelectorAll('.gal-card').forEach(blk=>{
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('fill','none');path.setAttribute('stroke','var(--bl-blood)');
    path.setAttribute('stroke-width',(0.6+Math.random()*1.5).toFixed(2));
    path.style.animation=`worldLineBreathV ${(state.blPeriod*(0.8+Math.random()*0.6)).toFixed(1)}s ease-in-out infinite`;
    path.style.animationDelay=(-Math.random()*state.blPeriod).toFixed(1)+'s';
    svg.appendChild(path);
    galLinkData.push({path,blk,phase:Math.random()*Math.PI*2,period:3+Math.random()*4,amp:10+Math.random()*20});
  });
  svg.setAttribute('viewBox',`0 0 ${st.clientWidth} ${st.clientHeight}`);
  svg.style.width='100%';svg.style.height='100%';
}
function startGalAnim(){if(galRAF)cancelAnimationFrame(galRAF);galT0=0;galRAF=requestAnimationFrame(galTick)}
function stopGalAnim(){if(galRAF){cancelAnimationFrame(galRAF);galRAF=null}}
function galTick(now){
  const st=$('#galStage');
  if(!st){galRAF=null;return}
  if(!galT0)galT0=now;
  const t=(now-galT0)/1000;
  const det=st.querySelector('.gal-detail');
  if(det&&galLinkData.length){
    const sr=st.getBoundingClientRect();
    const dr=det.getBoundingClientRect();
    const startX=dr.left-sr.left;
    const startY=dr.top-sr.top+40;
    galLinkData.forEach(d=>{
      const br=d.blk.getBoundingClientRect();
      const endX=br.left-sr.left;
      const endY=br.top-sr.top+br.height/2;
      const waveX=Math.sin(t*(Math.PI*2/d.period)+d.phase)*d.amp;
      const waveY=Math.cos(t*(Math.PI*2/d.period)+d.phase)*d.amp;
      const cx=(startX+endX)/2+waveX;
      const cy=(startY+endY)/2-Math.max(20,Math.min(80,Math.abs(endX-startX)*0.2))+waveY;
      d.path.setAttribute('d',`M ${startX.toFixed(1)} ${startY.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${endX.toFixed(1)} ${endY.toFixed(1)}`);
    });
  }
  galRAF=requestAnimationFrame(galTick);
}
function openGalDetail(id,instant){
  const st=$('#galStage'),container=$('#galDetailContainer');
  if(!st||!container)return;
  const g=(state.gallery||[]).find(x=>x.id===id);if(!g)return;
  galDetailId=id;save();
  const card=st.querySelector(`[data-gal-id="${CSS.escape(id)}"]`);
  let top=0;
  if(card){const br=card.getBoundingClientRect(),sr=st.getBoundingClientRect();top=Math.max(0,br.top-sr.top)}
  const maxH=Math.max(200,st.clientHeight-top);
  container.innerHTML=`<div class="gal-detail" style="top:${top}px;max-height:${maxH}px;"><div class="gd-line"></div><div class="gd-head"><button class="close" data-galclose>✕</button><div class="gd-name" data-edit="gal" data-edit-id="${attr(g.id)}" data-edit-field="title">${escapeHtml(g.title||'未命名')}</div><div class="gd-meta">${galCatName(g.cat)}${g.cat!=='illus'?' · '+galSubName(g.sub):''}${g.date?' · '+escapeHtml(g.date):''}</div></div>${g.src?`<img class="gd-img" src="${g.src}" data-view-src="${attr(g.src)}" data-view-title="${escapeHtml(g.title||'')}" title="点击查看原图" alt="">`:`<div class="gal-empty" style="padding:30px 20px;">（无图片）</div>`}<div class="gd-story" data-edit="gal" data-edit-id="${attr(g.id)}" data-edit-field="story">${renderText(g.story||'（暂无相关故事 · 右键编辑）')}</div><div class="gd-ops"><button class="btn danger" data-galdel="${attr(g.id)}" style="flex:1">删除该图片</button></div></div>`;
  st.querySelectorAll('.gal-card').forEach(x=>x.classList.toggle('selected',x.dataset.galId===id));
  const c1=container.querySelector('[data-galclose]');if(c1)c1.addEventListener('click',closeGalDetail);
  const c2=container.querySelector('[data-galdel]');if(c2)c2.addEventListener('click',()=>{if(!confirm('删除该图片？'))return;pushUndo();state.gallery=(state.gallery||[]).filter(x=>x.id!==id);galDetailId=null;save();stopGalAnim();renderGalNav();renderGalBody();logAction('删除图库图片',g.title||'');toast('已删除')});
  if(!instant){st.classList.remove('detail-open');void st.offsetWidth;}
  st.classList.add('detail-open');
  galInitLinks();startGalAnim();
}
function closeGalDetail(){
  const st=$('#galStage');if(!st)return;
  galDetailId=null;save();
  st.classList.remove('detail-open');
  stopGalAnim();galLinkData=[];
  st.querySelectorAll('.gal-card').forEach(x=>x.classList.remove('selected'));
  const svg=$('#galLinksSvg');if(svg)setTimeout(()=>{if(!st.classList.contains('detail-open'))svg.innerHTML=''},520);
}
function openGalDialog(){
  const catOpts=GAL_CATS.map(c=>`<option value="${attr(c.id)}"${c.id===galCat?' selected':''}>${c.name}</option>`).join('');
  const subOpts=GAL_SUBS.map(s=>`<option value="${s.id}"${s.id===galSub?' selected':''}>${s.name}</option>`).join('');
  const html=`<div class="modal-mask"><div class="modal" onclick="event.stopPropagation()" style="max-width:600px"><div class="modal-head"><h3>添加图片</h3><button class="modal-close" data-gc>✕</button></div><div class="modal-body"><div class="data-grid"><div class="row"><label>所属分类</label><select id="galCatSel" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-size:.7em;font-family:inherit">${catOpts}</select></div><div class="row"><label>稿件类型（插图为独立分类）</label><select id="galSubSel" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-size:.7em;font-family:inherit">${subOpts}</select></div><div class="row" style="grid-column:1/-1"><label>标题</label><input type="text" id="galTitle" placeholder="图片标题"></div><div class="row" style="grid-column:1/-1"><label>相关故事 / 描述</label><textarea id="galStory" style="min-height:110px;resize:vertical" placeholder="支持 [[条目id|显示名]] 血线链接语法"></textarea></div><div class="row" style="grid-column:1/-1"><label>图片（≤ 80 MB · 展示比例 4:3）</label><input type="file" id="galImg" accept="image/*"></div></div><div class="edit-tip">总量 ≤ 512 MB；「插图」分类下的内容仅展示插图与相关故事。</div><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn" data-gc>取消</button><button class="btn primary" id="galSave">添加</button></div></div></div></div>`;
  $('#modal-root').innerHTML=html;
  $$('#modal-root [data-gc]').forEach(b=>b.addEventListener('click',()=>{$('#modal-root').innerHTML=''}));
  $('#galSave').addEventListener('click',()=>{
    const cat=$('#galCatSel').value,sub=$('#galSubSel').value,title=$('#galTitle').value.trim(),story=$('#galStory').value;
    const f=$('#galImg').files&&$('#galImg').files[0];
    const fin=(src,size)=>{pushUndo();state.gallery.push({id:'gal'+Date.now()+Math.random().toString(36).slice(2,5),cat:cat==='illus'?'illus':cat,sub:cat==='illus'?'final':sub,title:title||'未命名',story,src,size:size||0,date:new Date().toLocaleDateString()});save();$('#modal-root').innerHTML='';galCat=cat;galSub=sub;renderGalNav();renderGalBody();logAction('添加图库图片',title);toast('图片已收录')};
    if(f){if(f.size>80*1024*1024){toast('单张图片超过 80 MB');return}const tot=(state.gallery||[]).reduce((s,i)=>s+(i.size||0),0);if(tot+f.size>512*1024*1024){toast('图库总量超过 512 MB');return}const rd=new FileReader();rd.onload=()=>fin(rd.result,f.size);rd.readAsDataURL(f)}
    else fin(null,0);
  });
}

/* ---------- 顶栏模块拖拽排序（FLIP 动画） ---------- */
const NAV_DEFAULT=['studio','chars','archive','gallery','events','world','data'];
let navJustDragged=0;
function applyNavOrder(){
  let order=Array.isArray(state.navOrder)?state.navOrder.filter(k=>NAV_DEFAULT.includes(k)):[];
  NAV_DEFAULT.forEach(k=>{if(!order.includes(k))order.push(k)});
  state.navOrder=order;
  const nav=$('#mainnav');if(!nav)return;
  const anchors={};nav.querySelectorAll('a[data-nav]').forEach(a=>anchors[a.dataset.nav]=a);
  order.forEach(k=>{if(anchors[k])nav.appendChild(anchors[k])});
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.nav-drag');if(!h)return;
  e.preventDefault();e.stopPropagation();
  const nav=$('#mainnav');const a=h.closest('a');if(!nav||!a)return;
  document.body.style.cursor='grabbing';
  let moved=false;
  const move=ev=>{
    const links=[...nav.querySelectorAll('a[data-nav]')];
    const from=links.indexOf(a);if(from<0)return;
    let idx=links.length;
    for(let i=0;i<links.length;i++){const r=links[i].getBoundingClientRect();if(ev.clientX<r.left+r.width/2){idx=i;break}}
    if(idx===from||idx===from+1)return;
    moved=true;
    const before=new Map(links.map(l=>[l,l.getBoundingClientRect().left]));
    nav.insertBefore(a,links[idx]||null);
    nav.querySelectorAll('a[data-nav]').forEach(l=>{const o=before.get(l);if(o==null)return;const d=o-l.getBoundingClientRect().left;if(d){l.style.transition='none';l.style.transform=`translateX(${d}px)`;void l.offsetWidth;l.style.transition='transform .26s cubic-bezier(.3,.8,.4,1)';l.style.transform=''}});
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.body.style.cursor='';
    if(moved){
      state.navOrder=[...nav.querySelectorAll('a[data-nav]')].map(x=>x.dataset.nav);
      save();navJustDragged=Date.now();
      logAction('调整模块顺序',state.navOrder.join(' › '));
      toast('模块顺序已保存');
      setTimeout(applyNavOrder,280);
    }
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
});
document.addEventListener('click',e=>{
  const a=e.target.closest('#mainnav a');
  if(a&&Date.now()-navJustDragged<350){e.preventDefault();e.stopPropagation();}
},true);

/* ---------- 覆盖：文档查看 / 检索（支持编辑与清空标记） ---------- */
function showDocViewer(fileId){
  const f=v3getFile(fileId);if(!f)return;const root=$('#modal-root');
  const content=state.archiveContentCleared?'（文档内容已清空）':f.content;
  root.innerHTML=`<div class="modal-mask" data-docclose><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3>${escapeHtml(f.name)}</h3><span style="font-size:.68em;color:var(--text-dim);margin-right:12px;">${f.typeLabel} · ${f.size} · ${f.date}</span><button class="modal-close" data-docclose-btn>✕</button></div><div class="modal-body"><div class="doc-content" data-edit="doc" data-edit-id="${attr(f.id)}" data-edit-field="content">${escapeHtml(content)}</div></div></div></div>`;
  root.querySelector('[data-docclose]').addEventListener('click',ev=>{if(ev.target.closest('.modal'))return;root.innerHTML=''});
  root.querySelector('[data-docclose-btn]').addEventListener('click',()=>{root.innerHTML=''});
  logAction('查看文档',f.name);save();
}
function doFileSearch(){
  const q=studioQuery.toLowerCase();const list=q?allFiles().filter(f=>(f.name+f.content+f.path).toLowerCase().includes(q)):allFiles();
  const el=$('#srchFiles');if(!el)return;
  if(!list.length){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:.8em;">无匹配文件</div>';$('#srchNav').innerHTML='';return}
  el.innerHTML=list.map(f=>{const act=f.id===activeSearchFileId;const nameHtml=q?highlightText(f.name,q):escapeHtml(f.name);return `<div class="srch-file${act?' active':''}" data-fileid="${attr(f.id)}"><div class="nm">${nameHtml}</div><div class="mt">${f.typeLabel} · ${f.size} · ${f.date}</div><div class="open-hint">双击打开完整文档</div></div>`}).join('');
  renderStudioPreview();
  $('#srchNav').innerHTML=`<span>共 ${list.length} 个文件</span><span style="flex:1"></span><button class="btn" onclick="showDocViewer('${activeSearchFileId}')">打开文档</button>`;
}
function renderStudioPreview(){
  const el=$('#srchPrev');if(!el)return;const f=v3getFile(activeSearchFileId);
  if(!f){el.innerHTML='选择左侧文件以预览';return}
  const q=studioQuery.toLowerCase();let content=state.archiveContentCleared?'（文档内容已清空）':f.content;content=q?highlightText(content,q):escapeHtml(content);
  el.innerHTML=content;
}
/* ---------- 覆盖：词条弹窗（带动画与右键编辑） ---------- */
function showEntryModal(id){
  const e=getEntry(id);const root=$('#modal-root');
  if(!e){root.innerHTML=`<div class="modal-mask"><div class="modal"><div class="modal-head"><h3>未找到词条</h3><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">✕</button></div><div class="modal-body">该词条不存在或已被删除。</div></div></div>`;return}
  const tags=(e.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
  let content='';if(e.body)content+=`<div data-edit="archive" data-edit-id="${attr(e.id)}" data-edit-field="body">${renderText(e.body)}</div>`;
  if(e.list&&e.list.length)content+='<ul>'+e.list.map(l=>'<li>'+renderText(l)+'</li>').join('')+'</ul>';
  if(!content)content='<div style="color:var(--text-dim);font-size:.8em;">（无详细内容 · 右键可编辑）</div>';
  root.innerHTML=`<div class="modal-mask" data-modal-close><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3 data-edit="archive" data-edit-id="${attr(e.id)}" data-edit-field="title">${escapeHtml(e.title)}</h3><button class="modal-close" data-modal-close-btn>✕</button></div><div class="modal-body">${e.sub?`<div style="font-size:.72em;color:var(--text-dim);letter-spacing:.14em;margin-bottom:14px;" data-edit="archive" data-edit-id="${attr(e.id)}" data-edit-field="sub">${escapeHtml(e.sub)}</div>`:''}${content}${tags?`<div class="modal-tags">${tags}</div>`:''}</div></div></div>`;
  root.querySelector('[data-modal-close]').addEventListener('click',ev=>{if(ev.target.closest('.modal'))return;root.innerHTML=''});
  root.querySelector('[data-modal-close-btn]').addEventListener('click',()=>{root.innerHTML=''});
}
window.showEntryModal=showEntryModal;

/* ---------- 右键单独编辑 ---------- */
function v3EditTarget(kind,id,field){
  switch(kind){
    case 'archive':{
      const isU=String(id).startsWith('u');
      return{
        get(){if(isU){const u=(state.userEntries||[]).find(x=>x.id===id);return u?(u[field]||''):''}const e=getEntry(id);return e?(e[field]||''):''},
        set(v){pushUndo();if(isU){const u=(state.userEntries||[]).find(x=>x.id===id);if(u)u[field]=v}else{state.archiveEdit[id]=Object.assign({},state.archiveEdit[id]);state.archiveEdit[id][field]=v}save();route()}
      };
    }
    case 'doc':return{get(){const f=v3getFile(id);return f?(f[field]||''):''},set(v){pushUndo();state.docEdit[id]=safeAssign({},state.docEdit[id]);state.docEdit[id][field]=v;save();route()}};
    case 'layer':return{get(){const L=allLayers().find(l=>l.level===id);return L?(L[field]||''):''},set(v){pushUndo();const cl=(state.customLayers||[]).find(l=>l.level===id);if(cl)cl[field]=v;else{state.layerEdit[id]=safeAssign({},state.layerEdit[id]);state.layerEdit[id][field]=v}save();route()}};
    case 'char':return{get(){const c=(state.characters||[]).find(x=>x.id===id);return c?(c[field]||''):''},set(v){pushUndo();const c=(state.characters||[]).find(x=>x.id===id);if(c){c[field]=v;save();route()}}};
    case 'gal':return{get(){const g=(state.gallery||[]).find(x=>x.id===id);return g?(g[field]||''):''},set(v){pushUndo();const g=(state.gallery||[]).find(x=>x.id===id);if(g){g[field]=v;save();route()}}};
    case 'label':return{get:()=>(state.labels[id]!==undefined?state.labels[id]:''),set(v){pushUndo();state.labels[id]=v;save();applyLabels();route()}};
    case 'catname':return{get(){return state.labels['__cat:'+id]||(CATS.find(c=>c.id===id)||{}).name||''},set(v){pushUndo();state.labels['__cat:'+id]=v;save();route()}};

<script>
/* ============================================================
   v4：人物档案独立板块 · 战力雷达（总战力/异能单独战力）
       图库分类拖拽排序 · 渲染性能优化 · 移动端自适应

/* ---------- 战力雷达：数据模型 ---------- */
const RADAR_DEF_AXES={total:['攻击','防御','速度','精神','体质','技巧'],power:['数据系','能量系','空间系','特殊系','精神系','体质系']};
const RADAR_SEEDS={
 'ch-siyu':{color:'#ff2140',opacity:.32,total:[82,64,91,78,66,88],power:[96,92,18,42,68,55]},
 'ch-suotana':{color:'#7c5cff',opacity:.32,total:[58,80,62,90,60,74],power:[35,30,25,93,85,50]},
 'ch-sinuolier':{color:'#ffb020',opacity:.32,total:[76,85,55,95,70,82],power:[94,40,90,55,88,60]},
 'ch-suoyina':{color:'#38bdf8',opacity:.32,total:[45,88,50,72,68,60],power:[20,25,15,90,70,65]}
};
function mkAxes(kind,vals){const defs=RADAR_DEF_AXES[kind];return defs.map((d,i)=>({label:d,value:vals?vals[i%vals.length]:50}))}
function migrateRadar(ch){
  if(!ch||typeof ch!=='object')return;
  const seed=RADAR_SEEDS[ch.id]||{};
  const r=ch.radar&&typeof ch.radar==='object'?ch.radar:{};
  if(typeof r.color!=='string'||!r.color)r.color=seed.color||'#ff2140';
  if(typeof r.opacity!=='number'||isNaN(r.opacity))r.opacity=(seed.opacity!=null?seed.opacity:.32);
  r.opacity=Math.max(.05,Math.min(1,r.opacity));
  ['total','power'].forEach(k=>{
    if(!Array.isArray(r[k])||r[k].length<3)r[k]=mkAxes(k,seed[k]);
    r[k]=r[k].map(a=>({label:String(a.label!=null?a.label:'词条'),value:Math.max(0,Math.min(100,Number(a.value)||0))}));
  });
  if(!Array.isArray(r.presets))r.presets=[];
  r.presets=r.presets.filter(p=>p&&Array.isArray(p.axes)).map(p=>({id:p.id||('p'+Date.now()+Math.random().toString(36).slice(2,5)),name:String(p.name||'设定'),kind:p.kind==='power'?'power':'total',axes:p.axes.map(a=>({label:String(a.label!=null?a.label:'词条'),value:Math.max(0,Math.min(100,Number(a.value)||0))}))}));
  if(ch.id==='ch-siyu'&&!r.presets.length){
    r.presets.push({id:'p-siyu-1',name:'常态',kind:'total',axes:JSON.parse(JSON.stringify(r.total))});
    r.presets.push({id:'p-siyu-2',name:'临界爆发',kind:'power',axes:[{label:'数据系',value:99},{label:'能量系',value:98},{label:'空间系',value:20},{label:'特殊系',value:45},{label:'精神系',value:80},{label:'体质系',value:70}]});
  }
  ch.radar=r;
}

/* ---------- 战力雷达：SVG 渲染 ---------- */
function radarSvgHtml(kind,axes,color,opacity,compare){
  const n=axes.length;
  if(n<3)return '<div class="radar-empty">词条数至少为 3<br>点击右上角「词条」按钮自定义</div>';
  const cx=150,cy=150,R=104;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const rings=[.25,.5,.75,1].map(f=>'<polygon points="'+axes.map((x,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="color-mix(in srgb,var(--text) 13%,transparent)" stroke-width="1"/>').join('');
  const spokes=axes.map((x,i)=>{const p=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="color-mix(in srgb,var(--text) 11%,transparent)" stroke-width="1"/>`}).join('');
  const labels=axes.map((ax,i)=>{const p=pt(i,R+17);const anch=Math.abs(p[0]-cx)<12?'middle':(p[0]>cx?'start':'end');return `<text class="radar-axis" data-ax-kind="${attr(kind)}" data-ax-idx="${attr(i)}" x="${p[0].toFixed(1)}" y="${(p[1]+3).toFixed(1)}" text-anchor="${anch}">${escapeHtml(ax.label)}</text>`}).join('');
  const poly=axes.map((ax,i)=>pt(i,R*Math.max(0,Math.min(100,ax.value))/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots=axes.map((ax,i)=>{const p=pt(i,R*Math.max(0,Math.min(100,ax.value))/100);return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${color}"/>`}).join('');
  let cmp='';
  if(compare&&Array.isArray(compare.axes)&&compare.axes.length>=3){
    const m=compare.axes;const cpts=[];
    for(let i=0;i<n;i++){const v=m[i%m.length];cpts.push(pt(i,R*Math.max(0,Math.min(100,v.value!=null?v.value:v))/100).map(x=>x.toFixed(1)).join(','))}
    cmp=`<polygon points="${cpts.join(' ')}" fill="none" stroke="${compare.color||'#7c5cff'}" stroke-width="1.4" stroke-dasharray="5 4" opacity=".85"/>`;
  }
  return `<svg viewBox="0 0 300 300" width="300" height="300" style="max-width:100%;height:auto">${rings}${spokes}<polygon points="${poly}" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>${cmp}${dots}${labels}</svg>`;
}

function charCatSel(){return Array.isArray(state.charCatSel)?state.charCatSel:[]}
function charCatHidden(){return Array.isArray(state.charCatHidden)?state.charCatHidden:[]}
const CAT_COLOR_PALETTE=['#ff2140','#7c5cff','#ffb020','#20c997','#2f9bff','#e05cff','#8bd450','#ff7847'];
const CHAR_TIER1=[{id:'faction',label:'阵营/势力'},{id:'other',label:'其他人物'}];
const CHAR_TIER2=[{id:'internal',label:'内部成员'},{id:'external',label:'其他成员'}];
const CHAR_TIER3=[{id:'important',label:'重要人物'},{id:'other',label:'其他人物'}];
const LEGION_NUMS='一二三四五六七八九十';
function legionLabel(n){if(n<=10)return '第'+LEGION_NUMS[n-1]+'军团';if(n===11)return '第十一军团';if(n===12)return '第十二军团';return '第十三军团'}
function legionNumFromText(t){const m=/(第([一二三四五六七八九十]{1,3})军团)/.exec(t||'');if(!m)return 0;const s=m[2];if(s==='十')return 10;if(s.length===1)return LEGION_NUMS.indexOf(s)+1;if(s[0]==='十')return 10+LEGION_NUMS.indexOf(s[1])+1;if(s[1]==='十')return (LEGION_NUMS.indexOf(s[0])+1)*10;return 0}
const CHAR_CAT_DEFAULTS=[].concat(
  Array.from({length:13},(_,i)=>({id:'leg-'+String(i+1).padStart(2,'0'),label:legionLabel(i+1),t1:'faction',kind:'阵营'})),
  [{id:'cat-mch',label:'商会',t1:'faction',kind:'势力'},{id:'cat-reg',label:'地区',t1:'faction',kind:'势力'},{id:'cat-cty',label:'城市',t1:'faction',kind:'势力'},{id:'cat-merc',label:'雇佣兵',t1:'faction',kind:'势力'},{id:'cat-oth',label:'其他人物',t1:'other',kind:''}]
);
function tier1Label(id){const t=(state.charTier1||CHAR_TIER1).find(x=>x.id===id);return t?t.label:'其他人物'}
function charT1Of(ch){const cat=(state.charCats||[]).find(x=>x.id===ch.cat);return cat?cat.t1:'other'}
function ensureCharCats(){
  if(!Array.isArray(state.charTier1)||!state.charTier1.length)state.charTier1=deepCopy(CHAR_TIER1);
  if(!Array.isArray(state.charCats)||!state.charCats.length){

    /* 旧版迁移：group important→阵营/势力；旧「重要人物」分类归入「军团」 */
    state.charCats.forEach(c=>{
      if(!c.t1)c.t1=(c.group==='important')?'faction':'other';
      if(c.t1==='faction'&&c.label==='重要人物')c.label='军团';
    });
    /* 新 taxonomy：单一「军团」分类 → 13 个「第X军团」，并按 faction 文本自动归属 */
    if((state.rosterTaxVer||0)<2){
      const legCat=state.charCats.find(c=>c.t1==='faction'&&c.label==='军团'&&!c.kind);

      if(legCat)state.charCats=state.charCats.filter(c=>c!==legCat);
      CHAR_CAT_DEFAULTS.filter(d=>d.t1==='faction').forEach(d=>{if(!state.charCats.some(c=>c.label===d.label&&c.t1==='faction'))state.charCats.push(Object.assign({},d))});
      const legByNum={};state.charCats.forEach(c=>{const m=/^leg-(\d+)$/.exec(c.id||'');if(m)legByNum[+m[1]]=c});

  }
  /* 种子人物按 faction 文本自动归属军团（仅首次无 rosterTaxVer 时执行一次） */
  if(!state.rosterTaxSeeded&&state.rosterTaxVer>=2){

      const n=legionNumFromText((ch.faction||'')+(ch.identity||''));

function bindListOrderDrag(item,container,attr,onOrder,handle){
  (handle||item).addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const sx=e.clientX,sy=e.clientY;let active=false;
    const mv=ev=>{
      if(!active&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){active=true;item.classList.add('dragging')}
      if(!active)return;
      const y=ev.clientY;let before=null;
      container.querySelectorAll('['+attr+']').forEach(b=>{
        if(b===item)return;const r=b.getBoundingClientRect();
        if(y<r.top+r.height/2&&before===null)before=b;
      });
      if(before)before.parentNode.insertBefore(item,before);
      else{const all=[...container.querySelectorAll('['+attr+']')].filter(b=>b!==item);const lastB=all[all.length-1];if(lastB)lastB.parentNode.appendChild(item)}
    };
    const up=()=>{
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      item.classList.remove('dragging');
      if(active){item.__dragT=Date.now();onOrder([...container.querySelectorAll('['+attr+']')].map(b=>b.getAttribute(attr)))}
    };
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
