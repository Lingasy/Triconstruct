function bindCharMoveDrag(el){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('.selbox'))return;
    const id=el.dataset.chid;
    const sx=e.clientX,sy=e.clientY;let active=false,ghost=null,hot=null;
    const scroller=(()=>{let n=el;while(n&&n!==document.body&&n!==document.documentElement){const ov=getComputedStyle(n).overflowY;if((ov==='auto'||ov==='scroll')&&n.scrollHeight>n.clientHeight+4)return n;n=n.parentElement}return null})();
    const ids0=()=>[id];
    const mv=ev=>{
      if(!active&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){
        active=true;
        el.__dragIds=ids0();
        ghost=document.createElement('div');ghost.className='ch-drag-ghost';ghost.textContent='移动 '+el.__dragIds.length+' 人';
        document.body.appendChild(ghost);
        el.classList.add('dragging');
      }
      if(!active)return;
      ghost.style.left=(ev.clientX+16)+'px';ghost.style.top=(ev.clientY+18)+'px';
      if(scroller){const sr=scroller.getBoundingClientRect();
        if(ev.clientY>sr.bottom-52)scroller.scrollTop+=14;
        else if(ev.clientY<sr.top+52)scroller.scrollTop-=14}
      const t=document.elementFromPoint(ev.clientX,ev.clientY);
      const h=t&&t.closest?t.closest('.char-sub-head,.char-sub2-head,.char-cat-item,.char-roster-item'):null;
      if(hot&&hot!==h)hot.classList.remove('drop-hot');
      hot=h;if(hot)hot.classList.add('drop-hot');
    };
    const up=ev=>{
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      if(!active)return;
      el.classList.remove('dragging');
      if(ghost)ghost.remove();
      if(hot)hot.classList.remove('drop-hot');
      el.__dragT=Date.now();
      const ids=el.__dragIds||[id];
      /* 释放点邻近搜索，避免边缘自动滚动导致的错位 */
      let drop=null;
      const pts=[[ev.clientX,ev.clientY],[ev.clientX,ev.clientY-26],[ev.clientX,ev.clientY+26],[ev.clientX-44,ev.clientY],[ev.clientX+44,ev.clientY],[ev.clientX,ev.clientY-52],[ev.clientX,ev.clientY+52]];
      for(let i=0;i<pts.length&&!drop;i++){
        const t=document.elementFromPoint(pts[i][0],pts[i][1]);
        if(!t||!t.closest)continue;
        let catId=null,member=null,grp=null;
        const s3=t.closest('.char-sub-head');
        if(s3){const parts=s3.dataset.subtoggle.split(':');catId=parts[1]||null;member=parts[2]||null;grp=parts[3]||null}
        if(!catId){const s2=t.closest('.char-sub2-head');
        if(s2){const blk=s2.closest('.char-cat-block');if(blk){catId=blk.dataset.cat;const parts=s2.dataset.subtoggle.split(':');member=parts[2]||null}}}
        if(!catId){const blk=t.closest('.char-cat-block');if(blk)catId=blk.dataset.cat}
        if(!catId){const it=t.closest('.char-roster-item');if(it&&it.dataset.chid!==id){const ch=(state.characters||[]).find(x=>x.id===it.dataset.chid);if(ch){catId=ch.cat;member=ch.memberType}}}
        if(catId)drop={catId,member,grp};
      }
      if(!drop)return;
      const catId=drop.catId,member=drop.member,grp=drop.grp;
      pushUndo();
      let n=0;(state.characters||[]).forEach(c=>{if(ids.includes(c.id)){c.cat=catId;if(member)c.memberType=member;if(grp)c.group=grp;n++}});
      save();renderCharRoster();
      const cat=state.charCats.find(x=>x.id===catId);
      toast('已将 '+n+' 人移动到「'+(cat?cat.label:'')+'」');
    };
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}

/* ---------- 图库：分类可拖拽排序 ---------- */
function galCatOrder(){let o=Array.isArray(state.galCatOrder)?state.galCatOrder.filter(id=>GAL_CATS.some(c=>c.id===id)):[];GAL_CATS.forEach(c=>{if(!o.includes(c.id))o.push(c.id)});return o}
function galSubOrder(cat){state.galSubOrder=state.galSubOrder||{};let o=Array.isArray(state.galSubOrder[cat])?state.galSubOrder[cat].filter(id=>GAL_SUBS.some(s=>s.id===id)):[];GAL_SUBS.forEach(s=>{if(!o.includes(s.id))o.push(s.id)});return o}
function orderedGalCats(){const o=galCatOrder();return o.map(id=>GAL_CATS.find(c=>c.id===id))}
function orderedGalSubs(cat){const o=galSubOrder(cat);return o.map(id=>GAL_SUBS.find(s=>s.id===id))}
function bindTabDrag(btn,container,onOrder){
  btn.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    e.preventDefault();
    const startX=e.clientX;let active=false;
    const siblings=()=>[...container.querySelectorAll('.gal-tab,.gal-sub-btn')];
    const move=ev=>{
      const dx=ev.clientX-startX;
      if(!active&&Math.abs(dx)>6){active=true;btn.classList.add('dragging')}
      if(!active)return;
      const x=ev.clientX;
      let before=null;
      siblings().forEach(b=>{if(b===btn)return;const r=b.getBoundingClientRect();if(x>r.left+r.width/2)before=b});
      if(before===null)container.insertBefore(btn,container.firstChild);
      else if(before!==btn)container.insertBefore(btn,before.nextSibling);
    };
    const up=()=>{
      document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
      btn.classList.remove('dragging');
      if(active){onOrder(siblings().map(b=>b.dataset.galcat||b.dataset.galsub));save();renderGalNav();renderGalBody()}
    };
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  });
}
function renderGalNav(){
  const nav=$('#galNav');if(!nav)return;
  const q=galQuery.toLowerCase();
  nav.innerHTML=orderedGalCats().map(c=>{
    const n=(state.gallery||[]).filter(g=>g.cat===c.id&&(!q||((g.title||'')+(g.story||'')).toLowerCase().includes(q))).length;
    if(q&&!n)return '';
    return `<div class="sb-item${galCat===c.id?' active':''}" data-galcat="${attr(c.id)}" title="拖动调整分类顺序"><span class="nm">${c.name}</span><span class="badge">${n}</span></div>`;
  }).join('')||'<div class="sb-empty">无匹配结果</div>';
  nav.querySelectorAll('[data-galcat]').forEach(el=>{
    el.addEventListener('click',()=>{if(Date.now()-(el.__dragT||0)<300)return;galCat=el.dataset.galcat;galDetailId=null;renderGalNav();renderGalBody()});
    bindListOrderDrag(el,nav,'data-galcat',order=>{state.galCatOrder=order;save();renderGalNav();renderGalBody();toast('分类顺序已调整')});
  });
}
function renderGalBody(){
  const body=$('#galBody');if(!body)return;
  const q=galQuery.toLowerCase();
  const items=(state.gallery||[]).filter(g=>{
    if(galCat==='illus'){if(g.cat!=='illus')return false}

  const subs=galCat==='illus'?'':`<div class="gal-subs">${orderedGalSubs(galCat).map(s=>`<button class="gal-sub-btn${galSub===s.id?' active':''}" data-galsub="${attr(s.id)}" title="拖动调整子分类顺序">${s.name}</button>`).join('')}</div>`;
  body.innerHTML=`<div class="gal-hero"><h1 data-edit="label" data-edit-id="__navGallery">${escapeHtml(state.labels.__navGallery||'展示图库')}</h1><p>${galCat==='illus'?'「插图」分类置于最前：此处仅展示插图与相关故事。':'点击左侧分类浏览；子分类：正式稿 / 设计稿 / 手稿，均可拖动排序。'}</p></div>${subs}<div class="gal-stage" id="galStage">${items.length?`<div class="gal-grid">${items.map(galCardHtml).join('')}</div>`:`<div class="gal-empty"><b>暂无图片</b><br>点击左侧「＋ 添加图片」开始收录${galCatName(galCat)}${galCat==='illus'?'插图':' · '+galSubName(galSub)}。</div>`}<svg class="gal-detail-links" id="galLinksSvg"></svg><div id="galDetailContainer"></div></div>`;
  body.querySelectorAll('[data-galsub]').forEach(el=>{el.addEventListener('click',()=>{galSub=el.dataset.galsub;galDetailId=null;renderGalBody()})});
  body.querySelectorAll('[data-gal-id]').forEach(el=>{el.addEventListener('click',e=>{if(Date.now()-(el.__dragT||0)<300)return;if(e.target.closest('[data-edit]'))return;const id=el.dataset.galId;if(galDetailId===id)closeGalDetail();else openGalDetail(id)})});
  const subBox=body.querySelector('.gal-subs');
  if(subBox)subBox.querySelectorAll('.gal-sub-btn').forEach(b=>bindTabDrag(b,subBox,order=>{state.galSubOrder=state.galSubOrder||{};state.galSubOrder[galCat]=order}));
  /* 图片内容自由拖动排序 */
  const grid=body.querySelector('.gal-grid');
  if(grid)grid.querySelectorAll('.gal-card').forEach(card=>bindGalImgDrag(card,grid));
  bindGalImgFade(body);
  if(galDetailId&&(state.gallery||[]).find(g=>g.id===galDetailId))openGalDetail(galDetailId,true);
}
/* 图库图片拖动排序 */
function bindGalImgDrag(card,grid){
  card.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('[data-edit]'))return;
    const sx=e.clientX,sy=e.clientY;let active=false,ghost=null;
    const scroller=(()=>{let n=grid;while(n&&n!==document.body){const ov=getComputedStyle(n).overflowY;if((ov==='auto'||ov==='scroll')&&n.scrollHeight>n.clientHeight+4)return n;n=n.parentElement}return null})();
    const mv=ev=>{
      if(!active&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){
        active=true;card.classList.add('dragging');
        ghost=document.createElement('div');ghost.className='ch-drag-ghost';ghost.textContent='移动图片';
        document.body.appendChild(ghost);
      }
      if(!active)return;
      ghost.style.left=(ev.clientX+16)+'px';ghost.style.top=(ev.clientY+18)+'px';
      if(scroller){const sr=scroller.getBoundingClientRect();
        if(ev.clientY>sr.bottom-52)scroller.scrollTop+=14;
        else if(ev.clientY<sr.top+52)scroller.scrollTop-=14}
      let before=null;
      grid.querySelectorAll('.gal-card').forEach(b=>{
        if(b===card)return;const r=b.getBoundingClientRect();
        const cy=r.top+r.height/2;
        if(ev.clientY>cy)before=b;
        else if(Math.abs(ev.clientY-cy)<=r.height/2&&ev.clientX>r.left+r.width/2)before=b;
      });
      if(before===null)grid.insertBefore(card,grid.firstChild);
      else if(before.nextSibling!==card)grid.insertBefore(card,before.nextSibling);
    };
    const up=()=>{
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      if(!active)return;
      card.classList.remove('dragging');
      if(ghost)ghost.remove();
      card.__dragT=Date.now();
      const order=[...grid.querySelectorAll('.gal-card')].map(b=>b.dataset.galId);
      const set=new Set(order);const gal=state.gallery||[];
      const first=gal.find(g=>set.has(g.id));if(!first)return;
      const rest=gal.filter(g=>!set.has(g.id));
      let pos=0;for(const g of gal){if(g===first)break;if(!set.has(g.id))pos++}
      rest.splice(pos,0,...order.map(id=>gal.find(g=>g.id===id)));
      pushUndo();state.gallery=rest;save();renderGalNav();renderGalBody();
      toast('图片顺序已调整');
    };
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* 图片加载后淡入（配合 .gal-card img 的 opacity 过渡） */
function bindGalImgFade(root){
  (root||document).querySelectorAll('.gal-card img').forEach(im=>{
    if(im.complete&&im.naturalWidth)im.classList.add('ld');
    else im.addEventListener('load',()=>im.classList.add('ld'),{once:true});
  });
}

function bindPanelCtrl(){

/* ---------- 事件板块：世界时间线 / 当前时间线 双模式 ---------- */
const v4RouteBase=route;
let v4LastHash=location.hash||'#/studio';
route=function(){
  const hash=location.hash||'#/studio';
  if(String(v4LastHash).startsWith('#/events')&&!hash.startsWith('#/events'))saveEvSlot();
  v4LastHash=hash;

const v4RenderEventsOrig=renderEventsView;
renderEventsView=function(){
  loadEvSlot(state.evMode||'world');
  v4RenderEventsOrig();
  wrapEvPane();injectEvModeUI();
};
function ensureEvData(){
  state.evData=state.evData||{};
  if(!state.evData.world||!Array.isArray(state.evData.world.events))state.evData.world={events:[],timeline:[]};
  if(!state.evData.current||!Array.isArray(state.evData.current.events))state.evData.current={events:state.events||[],timeline:state.timeline||[]};
}
function loadEvSlot(m){ensureEvData();state.events=state.evData[m].events;state.timeline=state.evData[m].timeline}
function saveEvSlot(){ensureEvData();state.evData[state.evMode||'world']={events:state.events,timeline:state.timeline}}
function wrapEvPane(){
  const view=$('#view');const wrap=view.querySelector('.events-wrap');if(!wrap)return;
  if(!wrap.parentElement||!wrap.parentElement.classList.contains('ev-slide')){
    const slide=document.createElement('div');slide.className='ev-slide';
    view.insertBefore(slide,wrap);slide.appendChild(wrap);
  }
}
function injectEvModeUI(){
  const head=$('.tl-header');if(!head)return;
  if(!head.querySelector('.ev-mode-sw')){
    head.insertAdjacentHTML('afterbegin','<div class="ev-mode-sw"><button data-evmode="world" type="button">世界时间线</button><button data-evmode="current" type="button">当前时间线</button></div>');
    head.querySelectorAll('.ev-mode-sw [data-evmode]').forEach(b=>b.addEventListener('click',()=>switchEvMode(b.dataset.evmode)));
  }
  updateEvModeBtns();
}
function updateEvModeBtns(){const m=state.evMode||'world';document.querySelectorAll('.ev-mode-sw [data-evmode]').forEach(b=>b.classList.toggle('on',b.dataset.evmode===m))}
let evSwitching=false;
const EVSW_OUT=200,EVSW_IN=240;
function switchEvMode(to){
  if(evSwitching)return;
  const from=state.evMode||'world';
  if(!to)to=from==='world'?'current':'world';
  if(to===from)return;
  evSwitching=true;
  const dir=to==='current'?1:-1;
  const old=document.querySelector('.ev-slide .events-wrap');
  const swap=()=>{
    saveEvSlot();
    state.evMode=to;
    loadEvSlot(to);
    save();
    renderEventsView();
    const nw=document.querySelector('.ev-slide .events-wrap');
    if(nw){
      nw.style.transition='none';
      nw.style.transform=`translateY(${dir*60}px) scale(.985)`;
      nw.style.opacity='0';
      requestAnimationFrame(()=>{requestAnimationFrame(()=>{
        nw.style.transition=`transform ${EVSW_IN}ms cubic-bezier(.22,.8,.3,1),opacity ${EVSW_IN}ms ease`;
        nw.style.transform='translateY(0) scale(1)';
        nw.style.opacity='1';
        setTimeout(()=>{evSwitching=false;nw.style.transition='';nw.style.transform='';nw.style.opacity=''},EVSW_IN+40);
      })});
    }else evSwitching=false;
    updateEvModeBtns();
  };
  if(old){
    old.style.transition=`transform ${EVSW_OUT}ms cubic-bezier(.55,.05,.7,.3),opacity ${EVSW_OUT}ms ease`;
    old.style.transform=`translateY(${-dir*70}px) scale(.985)`;
    old.style.opacity='0';
    setTimeout(swap,EVSW_OUT+20);
  }else swap();
}
let evWheelLock=0;
const v4RenderEvListOrig=renderEvList;
renderEvList=function(){v4RenderEvListOrig();applyEvCatCollapse()};
function applyEvCatCollapse(){
  document.querySelectorAll('.ev-cat').forEach(h=>{
    const key='evcat:'+h.textContent.split(' · ')[0];
    if(!state.collapsed[key])return;
    h.classList.add('off');
    let n=h.nextElementSibling;
    while(n&&!n.classList.contains('ev-cat')){if(n.classList.contains('ev-item'))n.style.display='none';n=n.nextElementSibling}
  });
}
document.addEventListener('wheel',e=>{
  if(evSwitching)return;
  if(!(location.hash||'').startsWith('#/events'))return;
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
  const now=Date.now();if(now-evWheelLock<800)return;
  const sc=e.target&&e.target.closest?e.target.closest('.sb-body,.chars-list,.modal-body,.tl-scroll'):null;
  if(sc&&sc.scrollHeight>sc.clientHeight+4&&sc.clientHeight>60)return;
  if(Math.abs(e.deltaY)<24)return;
  e.preventDefault();
  evWheelLock=now;
  const mode=state.evMode||'world';
  if(e.deltaY>0&&mode==='world')switchEvMode('current');
  else if(e.deltaY<0&&mode==='current')switchEvMode('world');
},{passive:false});

/* ---------- v4 初始化 ---------- */
(function v4init(){
  try{
    /* 一次性迁移：整体默认字号 22 → 23 */
    if((state.fsVer||0)<1){state.fsVer=1;if(state.font===22)state.font=23}
    if(!CHAR_FIELDS.find(f=>f[0]==='personality'))CHAR_FIELDS.push(['personality','性格介绍']);
    if(!CHAR_FIELDS.find(f=>f[0]==='abilityBias'))CHAR_FIELDS.push(['abilityBias','能力偏向']);
    (state.characters||[]).forEach(migrateRadar);
    ensureCharCats();
    ensureSeedContent();
    /* 档案库新分类体系迁移：旧分类 → 10 新分类 + 再分类(cls) */
    (function migrateArchiveTax(){
      if(state.arTaxVer>=2)return;
      const map={core:'core',horror:'aberr',bio:'bio',society:'society',legion:'fgroup',person:'person',faction:'fgroup',art:'art'};
      const defCls={core:'平面',aberr:'有威胁',bio:'其他',mega:'其他',phen:'其他',spec:'待确认',society:'当前社会情况',fgroup:'军团',person:'其他',art:'其他'};
      (state.userEntries||[]).forEach(u=>{
        if(!u||typeof u!=='object')return;
        const nc=map[u.cat]||(CATS.find(c=>c.id===u.cat)?u.cat:'core');
        u.cat=nc;if(!u.cls)u.cls=defCls[nc]||'其他';
      });
      state.arTaxVer=2;save();
    })();
    /* 修复：世界时间线与当前时间线槽位内容互换（默认故事数据属于当前时间线） */
    (function fixEvSlots(){
      state.evData=state.evData||{};
      if(!state.evFixSwap){
        const w=state.evData.world,c=state.evData.current;
        const wHas=w&&Array.isArray(w.events)&&w.events.length;
        const cHas=c&&Array.isArray(c.events)&&c.events.length;
        if(wHas&&!cHas){state.evData.world={events:[],timeline:[]};state.evData.current=w}
        state.evFixSwap=true;save();
      }
    })();
    /* 数据清空后同步双时间线槽位 */
    document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#btnClearAll'))setTimeout(()=>{try{saveEvSlot()}catch(err){}},50)});
    /* 人物档案默认位于档案库之前：旧数据中无 chars 时插入到 archive 前 */
    if(Array.isArray(state.navOrder)&&!state.navOrder.includes('chars')){const ai=state.navOrder.indexOf('archive');if(ai>=0)state.navOrder.splice(ai,0,'chars');else state.navOrder.push('chars')}
    applyNavOrder();save();applyLabels();
    fitStage();
    /* v3init 在解析期调用 route 时 v4 函数尚未定义，此处补一次正确渲染 */
    route();
  }catch(err){console.error('v4init error',err)}
})();
</script>

  const blk=state.writing[activeWriteBlock];if(!blk||!Array.isArray(blk.articles)||!blk.articles.length){toast('当前没有可删除的文章');return}

/* 创作台：一键清除所有分类下的空白文章 */
function clearBlankArticles(){

  Object.keys(state.writing||{}).forEach(k=>{const w=state.writing[k];if(w&&Array.isArray(w.articles))w.articles.forEach(a=>{if(!((a.title||'').trim())&&!((a.body||'').trim()))n++})});

  if(!confirm('一键清除全部 '+n+' 篇空白文章（标题与正文均为空）？'))return;

  let removed=0;
  Object.keys(state.writing||{}).forEach(k=>{
    const w=state.writing[k];if(!w||!Array.isArray(w.articles))return;
    const kept=[];
    w.articles.forEach(a=>{
      const blank=!((a.title||'').trim())&&!((a.body||'').trim());
      if(blank){removed++;selArts.delete(k+'|'+a.id);if(w.activeId===a.id)w.activeId=null}
      else kept.push(a);
    });
    if(!kept.length)kept.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,6),title:'',body:'',updatedAt:Date.now()});
    w.articles=kept;
    if(!w.activeId)w.activeId=kept[0].id;

  fi.value=state.font;
  const v9ApplyTheme=applyTheme;
  applyTheme=function(){v9ApplyTheme();const f=$('#fontInput');if(f&&document.activeElement!==f)f.value=state.font};
})();
/* 档案库折叠动画性能：动画期间暂停布局模糊与合成（约 0.45s） */
function archFoldFX(){
  const lay=document.querySelector('.view-layout');
  if(!lay)return;
  lay.classList.add('fold-anim');
  clearTimeout(lay.__foldT);
  lay.__foldT=setTimeout(()=>lay.classList.remove('fold-anim'),460);
}
/* 折叠动画性能：动画期间临时关闭侧栏 backdrop-filter（约 0.35s），消除每帧重模糊的开销 */
function rosterFoldFX(){
  const side=document.querySelector('.chars-side');
  if(!side)return;
  side.classList.add('fold-anim');
  clearTimeout(side.__foldT);
  side.__foldT=setTimeout(()=>side.classList.remove('fold-anim'),360);
}
/* 点击查看原图：全屏查看器（显示原图，滚轮缩放，点击 / Esc 关闭） */
function openImageViewer(src,title){
  if(!src)return;
  const mask=document.createElement('div');
  mask.className='img-viewer-mask';
  mask.innerHTML=`<div class="img-viewer-bar"><span class="t">${escapeHtml(title||'查看原图')}</span><span class="h">滚轮缩放 · 点击任意处关闭</span><button class="modal-close" style="position:static">✕</button></div><div class="img-viewer-wrap"><img src="${src}" alt=""></div>`;
  document.body.appendChild(mask);
  const img=mask.querySelector('img');
  let scale=1;
  mask.querySelector('.img-viewer-wrap').addEventListener('wheel',e=>{e.preventDefault();scale=Math.min(10,Math.max(0.1,scale*(e.deltaY<0?1.15:1/1.15)));img.style.transform='scale('+scale+')'},{passive:false});
  const close=()=>{mask.classList.add('out');setTimeout(()=>mask.remove(),180);document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(e.key==='Escape')close()};
  mask.addEventListener('click',e=>{if(e.target.closest('.modal-close')||!e.target.closest('.img-viewer-bar'))close()});
  document.addEventListener('keydown',onKey);
  requestAnimationFrame(()=>mask.classList.add('in'));
}
/* 捕获阶段拦截：带 data-view-src 的图片点击直接查看原图，不触发选中 / 折叠 */
document.addEventListener('click',e=>{
  const im=e.target.closest('img[data-view-src]');
  if(!im)return;
  e.stopPropagation();e.preventDefault();
  openImageViewer(im.dataset.viewSrc,im.dataset.viewTitle||'');
},true);
</script>
